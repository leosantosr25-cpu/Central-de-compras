        // ---------- Módulo 1f: Modal Baixa Múltipla por Voz / Texto (Gemini API + Trava de Confirmação) ----------
        function ModalBaixaChat({ produtosComEstoque, onClose, mostrarToast, executar }) {
            const [etapa, setEtapa] = useState('input');
            const [texto, setTexto] = useState('');
            const [gravando, setGravando] = useState(false);
            const [carregando, setCarregando] = useState(false);
            const [itensConfirmar, setItensConfirmar] = useState([]);
            const recognitionRef = React.useRef(null);

            useEffect(() => {
                return () => {
                    if (recognitionRef.current) {
                        recognitionRef.current.abort();
                        recognitionRef.current = null;
                    }
                };
            }, []);

            const toggleGravacao = () => {
                if (gravando) {
                    if (recognitionRef.current) {
                        recognitionRef.current.stop();
                        recognitionRef.current = null;
                    }
                    setGravando(false);
                    return;
                }
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    mostrarToast('Reconhecimento de voz não suportado neste navegador.', 'erro');
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.lang = 'pt-BR';
                recognition.interimResults = false;
                recognition.continuous = true;
                recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        if (event.results[i].isFinal) transcript += event.results[i][0].transcript;
                    }
                    if (transcript) {
                        setTexto(prev => prev ? `${prev} ${transcript.trim()}` : transcript.trim());
                    }
                };
                recognition.onerror = (event) => {
                    if (event.error !== 'aborted') mostrarToast('Erro no microfone: ' + event.error, 'erro');
                    setGravando(false);
                    recognitionRef.current = null;
                };
                recognition.onend = () => {
                    setGravando(false);
                    recognitionRef.current = null;
                };
                recognitionRef.current = recognition;
                recognition.start();
                setGravando(true);
            };

            const analisar = async () => {
                const apiKey = localStorage.getItem('gemini_api_key') || '';
                if (!apiKey) {
                    mostrarToast('Configure sua chave GEMINI_API_KEY nas Configurações.', 'erro');
                    return;
                }
                if (!texto.trim()) {
                    mostrarToast('Digite ou fale o que você consumiu.', 'erro');
                    return;
                }
                setCarregando(true);
                try {
                    const itensEstoque = produtosComEstoque
                        .filter(p => p.stockTotal > 0)
                        .map(p => ({ id: p.id, name: p.name, unit: p.unit || 'unidade', quantity: p.stockTotal, peso_por_unidade: p.peso_por_unidade || 0 }));
                    const prompt = `Você controla o estoque doméstico. O usuário descreveu o que consumiu.\n\n` +
                        `ITENS EM ESTOQUE ATUALMENTE:\n${JSON.stringify(itensEstoque)}\n\n` +
                        `TEXTO DO USUÁRIO: "${texto.trim()}"\n\n` +
                        `Retorne APENAS um JSON array no formato: [{"id": "id_do_produto", "nome": "nome_do_produto", "quantidade": numero}].\n` +
                        `Regras:\n` +
                        `- Associe cada item mencionado ao produto mais provável do estoque (usando sua unidade e peso_por_unidade para converter se precisar).\n` +
                        `- Se um item não existir no estoque com saldo > 0, use id "__nao_encontrado__" e o nome descrito.\n` +
                        `- Se não houver quantidade explícita, use 1.`;

                    const parsed = await chamarGeminiJSON(apiKey, [{ text: prompt }], { temperature: 0 });
                    const lista = Array.isArray(parsed) ? parsed : (Array.isArray(parsed?.itens) ? parsed.itens : []);
                    const processados = lista.map((item, idx) => {
                        const prodMatch = produtosComEstoque.find(p => p.id === item.id);
                        return {
                            _key: `${item.id}_${idx}`,
                            id: item.id,
                            nome: (prodMatch && prodMatch.name) || item.nome || 'Desconhecido',
                            quantidade: Math.max(0, Number(item.quantidade) || 1),
                            encontrado: !!prodMatch && item.id !== '__nao_encontrado__',
                            prodRef: prodMatch || null,
                            estoqueDisponivel: prodMatch ? prodMatch.stockTotal : 0,
                            unidade: prodMatch ? (prodMatch.unit || 'un') : 'un'
                        };
                    });
                    setItensConfirmar(processados);
                    setEtapa('confirming');
                } catch (err) {
                    console.error(err);
                    mostrarToast(err.message || 'Erro ao analisar consumo.', 'erro');
                } finally {
                    setCarregando(false);
                }
            };

            const atualizarQtd = (key, val) => {
                setItensConfirmar(prev => prev.map(it => it._key === key ? { ...it, quantidade: Math.max(0, Number(val) || 0) } : it));
            };

            const removerItem = (key) => {
                setItensConfirmar(prev => prev.filter(it => it._key !== key));
            };

            const confirmarBaixa = async () => {
                const validos = itensConfirmar.filter(it => it.encontrado && it.quantidade > 0);
                if (validos.length === 0) {
                    mostrarToast('Nenhum item válido para dar baixa.', 'erro');
                    return;
                }
                setEtapa('processing');
                await executar(async () => {
                    const ops = [];
                    const agoraIso = new Date().toISOString();
                    validos.forEach((item, idx) => {
                        const baixaOps = gerarOpsBaixaLotes(item.prodRef, item.quantidade);
                        baixaOps.forEach(op => ops.push(op));
                        ops.push({
                            type: 'set', col: 'consumption', id: `cons_${Date.now()}_${idx}`,
                            data: {
                                product_id: item.prodRef.id,
                                product_name: item.prodRef.name,
                                quantity: item.quantidade,
                                consumed_at: agoraIso,
                                notes: 'Baixa por voz/texto IA'
                            }
                        });
                    });
                    await CB.batchOps(ops);
                    mostrarToast(`Baixa confirmada em ${validos.length} item(ns)!`);
                    onClose();
                }, 'Erro ao confirmar baixa no estoque.');
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4" onClick={e => { if (e.target === e.currentTarget && etapa !== 'processing') onClose(); }}>
                    <div className="bg-white w-full sm:max-w-lg sm:rounded-3xl rounded-t-3xl max-h-[90vh] flex flex-col shadow-2xl">
                        <div className="flex items-center justify-between p-5 border-b border-slate-100">
                            <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                                <Icon name="mic" className="w-4 h-4 text-violet-700" />
                                <span>Registrar Consumo (Voz/Texto)</span>
                            </h3>
                            {etapa !== 'processing' && (
                                <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
                            )}
                        </div>

                        <div className="flex-1 overflow-y-auto p-5 space-y-4">
                            {etapa === 'input' && (
                                <>
                                    <p className="text-xs text-slate-500">Descreva o que foi gasto na casa. Ex: <em>"usei 2 ovos, 1 litro de leite e 1 pacote de macarrão"</em></p>
                                    <div className="relative">
                                        <textarea
                                            value={texto}
                                            onChange={e => setTexto(e.target.value)}
                                            rows={4}
                                            placeholder="Digite ou clique no microfone para falar..."
                                            className="w-full border border-slate-200 rounded-2xl p-3 pr-14 text-xs focus:ring-2 focus:ring-violet-200 focus:outline-none resize-none"
                                        />
                                        <button
                                            type="button"
                                            onClick={toggleGravacao}
                                            className={`absolute bottom-3 right-3 p-2.5 rounded-full transition ${gravando ? 'bg-rose-600 text-white animate-pulse shadow-lg' : 'bg-violet-100 text-violet-800 hover:bg-violet-200'}`}
                                            title={gravando ? 'Parar gravação' : 'Falar em pt-BR'}
                                        >
                                            <Icon name="mic" className="w-4 h-4" />
                                        </button>
                                    </div>
                                    {gravando && <p className="text-xs text-rose-600 font-bold animate-pulse">🔴 Ouvindo (pt-BR)... clique no microfone para parar.</p>}
                                    <button
                                        onClick={analisar}
                                        disabled={carregando || !texto.trim()}
                                        className="w-full bg-violet-700 hover:bg-violet-600 disabled:opacity-50 text-white py-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-2 shadow"
                                    >
                                        <Icon name="sparkles" className="w-4 h-4" />
                                        <span>{carregando ? 'Analisando com Gemini...' : 'Identificar itens para baixa'}</span>
                                    </button>
                                </>
                            )}

                            {etapa === 'confirming' && (
                                <div className="space-y-3">
                                    <p className="text-xs text-slate-600 font-semibold">Confira e ajuste as quantidades antes de confirmar a baixa em lote:</p>
                                    {itensConfirmar.length === 0 ? (
                                        <p className="text-xs text-slate-400 text-center py-6">Nenhum item identificado no texto.</p>
                                    ) : (
                                        <div className="space-y-2">
                                            {itensConfirmar.map(it => (
                                                <div key={it._key} className={`flex items-center justify-between gap-2 p-3 rounded-2xl border text-xs ${!it.encontrado ? 'bg-rose-50 border-rose-200' : 'bg-slate-50 border-slate-200'}`}>
                                                    <div className="min-w-0 flex-1">
                                                        <p className={`font-bold truncate ${!it.encontrado ? 'text-rose-700' : 'text-slate-800'}`}>{it.nome}</p>
                                                        {!it.encontrado ? (
                                                            <p className="text-[10px] text-rose-600">⚠️ Não encontrado com saldo no estoque</p>
                                                        ) : (
                                                            <p className={`text-[10px] ${it.quantidade > it.estoqueDisponivel ? 'text-amber-700 font-bold' : 'text-slate-500'}`}>
                                                                Disponível: {it.estoqueDisponivel} {it.unidade}
                                                            </p>
                                                        )}
                                                    </div>
                                                    <div className="flex items-center gap-1.5 shrink-0">
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            step="any"
                                                            disabled={!it.encontrado}
                                                            value={it.quantidade}
                                                            onChange={e => atualizarQtd(it._key, e.target.value)}
                                                            className="w-16 border rounded-xl px-2 py-1 text-center text-xs bg-white font-bold"
                                                        />
                                                        <span className="text-[10px] text-slate-500 w-8 truncate">{it.unidade}</span>
                                                        <button onClick={() => removerItem(it._key)} className="text-rose-500 hover:text-rose-700 font-bold px-1" title="Remover">✕</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {etapa === 'processing' && (
                                <div className="py-10 text-center space-y-3">
                                    <div className="w-10 h-10 border-4 border-violet-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                                    <p className="text-xs font-bold text-slate-700">Aplicando baixa em lote no estoque...</p>
                                </div>
                            )}
                        </div>

                        {etapa === 'confirming' && (
                            <div className="p-4 border-t border-slate-100 flex gap-2">
                                <button onClick={() => setEtapa('input')} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-bold">Voltar</button>
                                <button
                                    onClick={confirmarBaixa}
                                    disabled={itensConfirmar.filter(it => it.encontrado && it.quantidade > 0).length === 0}
                                    className="flex-1 bg-violet-700 hover:bg-violet-600 disabled:opacity-40 text-white py-2.5 rounded-xl text-xs font-bold"
                                >
                                    Confirmar Baixa
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ---------- Módulo 3: Aba Receitas (Base Estática + Receitas Pessoais + Match Estoque + Freezer) ----------
        const RECEITAS_BASE_FALLBACK = [
            {
                id: 'arroz-feijao', nome: 'Arroz com Feijão', categoria: 'Pratos principais', tempo_preparo: '40 min', porcoes: 4,
                ingredientes: [
                    { nome_generico: 'Arroz branco', quantidade: 2, unidade: 'xícara' },
                    { nome_generico: 'Feijão carioca', quantidade: 1, unidade: 'xícara' },
                    { nome_generico: 'Alho', quantidade: 3, unidade: 'dente' },
                    { nome_generico: 'Cebola', quantidade: 1, unidade: 'unidade' },
                    { nome_generico: 'Óleo de soja', quantidade: 2, unidade: 'colher' }
                ],
                modo_preparo: ['Cozinhe o feijão na pressão por 25 min.', 'Refogue alho e cebola no óleo, junte o arroz e adicione água (2x o volume).']
            },
            {
                id: 'omelete-simples', nome: 'Omelete Simples', categoria: 'Lanches rápidos', tempo_preparo: '10 min', porcoes: 1,
                ingredientes: [
                    { nome_generico: 'Ovos', quantidade: 3, unidade: 'unidade' },
                    { nome_generico: 'Queijo mussarela', quantidade: 50, unidade: 'g' },
                    { nome_generico: 'Tomate', quantidade: 1, unidade: 'unidade' },
                    { nome_generico: 'Manteiga', quantidade: 1, unidade: 'colher' }
                ],
                modo_preparo: ['Bata os ovos com sal.', 'Doure na manteiga, adicione queijo e tomate e dobre ao meio.']
            }
        ];

        function ReceitasView({ produtosComEstoque, receitasPessoais, listaCompras, executar, mostrarToast }) {
            const [receitasBase, setReceitasBase] = useState(RECEITAS_BASE_FALLBACK);
            const [busca, setBusca] = useState('');
            const [catFiltro, setCatFiltro] = useState('Todos');
            const [modalPreparei, setModalPreparei] = useState(null);
            const [qtyEdits, setQtyEdits] = useState({});
            const [gerarFreezer, setGerarFreezer] = useState(false);
            const [qtdPorcoesFreezer, setQtdPorcoesFreezer] = useState(4);
            const [modalReceita, setModalReceita] = useState(null);
            const [iaLoading, setIaLoading] = useState(false);
            const [iaSugestao, setIaSugestao] = useState(null);

            useEffect(() => {
                if (typeof window !== 'undefined' && /^https?:$/i.test(window.location.protocol)) {
                    fetch('./receitas_base.json?_=' + Date.now())
                        .then(r => r.ok ? r.json() : null)
                        .then(data => { if (Array.isArray(data) && data.length > 0) setReceitasBase(data); })
                        .catch(() => {});
                }
            }, []);

            const prodsComestiveis = useMemo(() => {
                return produtosComEstoque.filter(p => obterLocalEstoque(p, null) !== 'higiene');
            }, [produtosComEstoque]);

            const matchIngrediente = (ing) => {
                if (ing.item_estoque_id) {
                    const porId = prodsComestiveis.find(p => p.id === ing.item_estoque_id);
                    if (porId) return porId;
                }
                const nomeNorm = normalizar(ing.nome_generico || '');
                if (!nomeNorm) return null;
                const exato = prodsComestiveis.find(p => normalizar(p.name) === nomeNorm);
                if (exato) return exato;
                const substringMatch = prodsComestiveis.find(p => {
                    const pn = normalizar(p.name);
                    return pn.includes(nomeNorm) || nomeNorm.includes(pn);
                });
                if (substringMatch) return substringMatch;
                return acharProdutoDaOferta(ing.nome_generico || '', prodsComestiveis);
            };

            const todasReceitas = useMemo(() => {
                const combinadas = [
                    ...receitasBase.map(r => ({ ...r, _pessoal: false })),
                    ...(receitasPessoais || []).map(r => ({ ...r, _pessoal: true }))
                ];
                return combinadas.map(r => {
                    const ings = r.ingredientes || [];
                    const disponiveis = [];
                    const faltando = [];
                    let pertoVencer = 0;

                    ings.forEach(ing => {
                        const prod = matchIngrediente(ing);
                        if (prod && prod.stockTotal > 0) {
                            disponiveis.push({ ...ing, _prod: prod });
                            const temUrgente = (prod.lotes || []).some(l => {
                                const dias = calcularDiasParaVencer(l.expiration_date);
                                return dias !== null && dias >= 0 && dias <= 7;
                            });
                            if (temUrgente) pertoVencer++;
                        } else {
                            faltando.push({ ...ing, _prod: prod || null });
                        }
                    });

                    const pct = ings.length > 0 ? Math.round((disponiveis.length / ings.length) * 100) : 0;
                    return { ...r, _compat: { pct, disponiveis, faltando, pertoVencer } };
                });
            }, [receitasBase, receitasPessoais, prodsComestiveis]);

            const categorias = ['Todos', 'Pratos principais', 'Lanches rápidos', 'Sobremesas', 'Acompanhamentos'];

            const filtradas = useMemo(() => {
                const b = normalizar(busca);
                return todasReceitas
                    .filter(r => (catFiltro === 'Todos' || r.categoria === catFiltro) && (!b || normalizar(r.nome).includes(b)))
                    .sort((a, b2) => b2._compat.pertoVencer - a._compat.pertoVencer || b2._compat.pct - a._compat.pct || (a.nome || '').localeCompare(b2.nome || ''));
            }, [todasReceitas, catFiltro, busca]);

            const abrirModalPreparei = (receita) => {
                const iniciais = {};
                receita._compat.disponiveis.forEach(ig => {
                    const pad = Number(ig.quantidade) || 1;
                    // Se estoque for menor (ex.: ingrediente em unidade/xícara vs pacote), sugere min(1, pad) quando unidade diferente
                    const mesmaUn = normalizar(ig.unidade) === normalizar(ig._prod.unit);
                    iniciais[ig._prod.id] = mesmaUn ? Math.min(pad, ig._prod.stockTotal) : Math.min(1, ig._prod.stockTotal);
                });
                setQtyEdits(iniciais);
                setGerarFreezer(false);
                setQtdPorcoesFreezer(Number(receita.porcoes) || 4);
                setModalPreparei(receita);
            };

            const confirmarPreparei = async () => {
                if (!modalPreparei) return;
                await executar(async () => {
                    const ops = [];
                    const agoraIso = new Date().toISOString();
                    let baixas = 0;

                    modalPreparei._compat.disponiveis.forEach((ig, idx) => {
                        const q = Number(qtyEdits[ig._prod.id] || 0);
                        if (q > 0) {
                            gerarOpsBaixaLotes(ig._prod, q).forEach(op => ops.push(op));
                            ops.push({
                                type: 'set', col: 'consumption', id: `rec_${Date.now()}_${idx}`,
                                data: {
                                    product_id: ig._prod.id,
                                    product_name: ig._prod.name,
                                    quantity: q,
                                    consumed_at: agoraIso,
                                    notes: `Receita: ${modalPreparei.nome}`
                                }
                            });
                            baixas++;
                        }
                    });

                    if (gerarFreezer && Number(qtdPorcoesFreezer) > 0) {
                        const prodIdFreezer = `freezer_rec_${slug(modalPreparei.nome)}`;
                        const nomeFreezer = `${modalPreparei.nome} (porção pronta)`;
                        const val90d = new Date(Date.now() + 90 * 86400000).toISOString().slice(0, 10);
                        ops.push({
                            type: 'set', col: 'products', id: prodIdFreezer,
                            data: {
                                name: nomeFreezer,
                                category: 'Congelados',
                                brand: 'Caseiro',
                                unit: 'porção',
                                default_quantity: 1,
                                minimum_stock: 0,
                                essencial: false,
                                local_estoque: 'freezer',
                                notes: `Gerado pela receita ${modalPreparei.nome}`,
                                is_demo: false
                            }
                        });
                        ops.push({
                            type: 'set', col: 'product_expiration', id: `lote_rec_${Date.now()}`,
                            data: {
                                product_id: prodIdFreezer,
                                quantity: Number(qtdPorcoesFreezer),
                                expiration_date: val90d,
                                local_estoque: 'freezer',
                                is_demo: false
                            }
                        });
                    }

                    if (ops.length === 0) {
                        mostrarToast('Nenhuma alteração para registrar.', 'erro');
                        return;
                    }
                    await CB.batchOps(ops);
                    setModalPreparei(null);
                    mostrarToast(gerarFreezer
                        ? `Estoque baixado (${baixas} ing.) + ${qtdPorcoesFreezer} porções salvas no Freezer! ❄️`
                        : `Receita preparada! Baixa realizada em ${baixas} ingrediente(s).`);
                }, 'Erro ao registrar preparo da receita.');
            };

            const adicionarFaltantesLista = (receita) => executar(async () => {
                const ops = [];
                let count = 0;
                receita._compat.faltando.forEach((ig, idx) => {
                    const jaNaLista = listaCompras.some(l => !l.purchased && (
                        (ig._prod && l.product_id === ig._prod.id) ||
                        normalizar(l.product_name) === normalizar(ig.nome_generico)
                    ));
                    if (jaNaLista) return;
                    const itemId = `rec_list_${slug(ig.nome_generico)}_${Date.now()}_${idx}`;
                    ops.push({
                        type: 'set', col: 'shopping_list', id: itemId,
                        data: {
                            product_id: ig._prod ? ig._prod.id : '',
                            product_name: ig._prod ? ig._prod.name : ig.nome_generico,
                            unit: (ig._prod && ig._prod.unit) || ig.unidade || 'unidade',
                            quantity: Number(ig.quantidade) || 1,
                            default_price: (ig._prod && Number(ig._prod.default_price)) || 0,
                            purchased: false
                        }
                    });
                    count++;
                });
                if (ops.length === 0) {
                    mostrarToast('Todos os ingredientes faltantes já estão na sua Lista de Compras!');
                    return;
                }
                await CB.batchOps(ops);
                mostrarToast(`${count} ingrediente(s) faltante(s) adicionado(s) à Lista de Compras!`);
            });

            const sugerirComIA = async () => {
                const apiKey = localStorage.getItem('gemini_api_key') || '';
                if (!apiKey) {
                    mostrarToast('Configure sua chave GEMINI_API_KEY nas Configurações.', 'erro');
                    return;
                }
                const disp = prodsComestiveis.filter(p => p.stockTotal > 0);
                if (disp.length === 0) {
                    mostrarToast('Adicione alimentos ao estoque primeiro.', 'erro');
                    return;
                }
                setIaLoading(true);
                setIaSugestao(null);
                try {
                    const urgentes = [];
                    disp.forEach(p => {
                        const dMin = (p.lotes || []).reduce((acc, l) => {
                            const d = calcularDiasParaVencer(l.expiration_date);
                            return d === null ? acc : (acc === null ? d : Math.min(acc, d));
                        }, null);
                        if (dMin !== null && dMin <= 7) urgentes.push(`${p.name} (vence em ${dMin}d)`);
                    });
                    const listaTxt = disp.map(p => `${p.name}: ${p.stockTotal} ${p.unit}`).join(', ');
                    const prompt = `Sugira UMA receita prática brasileira usando prioritariamente os ingredientes disponíveis abaixo:\n` +
                        `ESTOQUE: ${listaTxt}\n` +
                        (urgentes.length > 0 ? `PRIORIDADE (vencendo em breve): ${urgentes.join(', ')}\n` : '') +
                        `\nResponda APENAS JSON no formato: {"nome": "...", "categoria": "Pratos principais|Lanches rápidos|Sobremesas|Acompanhamentos", "tempo_preparo": "20 min", "porcoes": 2, "dica": "...", "ingredientes": [{"nome_generico": "...", "quantidade": 1, "unidade": "..."}], "modo_preparo": ["passo 1", "passo 2"]}`;

                    const sug = await chamarGeminiJSON(apiKey, [{ text: prompt }], { temperature: 0.7 });
                    setIaSugestao(sug);
                } catch (err) {
                    console.error(err);
                    mostrarToast(err.message || 'Erro ao gerar sugestão com IA.', 'erro');
                } finally {
                    setIaLoading(false);
                }
            };

            return (
                <div className="space-y-5">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h2 className="text-lg font-bold text-slate-800">👨‍🍳 Receitas & Aproveitamento</h2>
                                <p className="text-xs text-slate-500">Cruza seu estoque de alimentos (ignorando Higiene) e prioriza itens perto do vencimento.</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                <button onClick={sugerirComIA} disabled={iaLoading} className="bg-gradient-to-r from-violet-700 to-indigo-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow flex items-center gap-1.5 disabled:opacity-50">
                                    <Icon name="sparkles" className="w-3.5 h-3.5" />
                                    <span>{iaLoading ? 'Pensando...' : 'Sugerir com IA'}</span>
                                </button>
                                <button onClick={() => setModalReceita({})} className="bg-violet-100 hover:bg-violet-200 text-violet-800 text-xs font-bold px-3.5 py-2 rounded-xl flex items-center gap-1.5">
                                    <Icon name="plus" className="w-3.5 h-3.5" />
                                    <span>Minha Receita</span>
                                </button>
                            </div>
                        </div>

                        <div className="relative">
                            <span className="text-slate-400 absolute left-3.5 top-2.5"><Icon name="search" className="w-4 h-4" /></span>
                            <input type="text" placeholder="Buscar receita..." value={busca} onChange={e => setBusca(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-2xl pl-10 pr-4 py-2.5 text-xs" />
                        </div>

                        <div className="flex flex-wrap gap-1.5">
                            {categorias.map(cat => (
                                <button key={cat} onClick={() => setCatFiltro(cat)} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${catFiltro === cat ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                    {cat}
                                </button>
                            ))}
                        </div>
                    </div>

                    {iaSugestao && (
                        <div className="bg-gradient-to-br from-violet-50 to-indigo-50 border border-violet-200 rounded-3xl p-5 shadow-sm space-y-3">
                            <div className="flex justify-between items-start gap-2">
                                <div>
                                    <span className="text-[10px] font-bold bg-violet-700 text-white px-2.5 py-0.5 rounded-full">✨ Sugestão da IA</span>
                                    <h3 className="text-base font-bold text-slate-800 mt-1">{iaSugestao.nome}</h3>
                                    <p className="text-[11px] text-slate-500">{iaSugestao.tempo_preparo} • {iaSugestao.porcoes} porções</p>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => executar(async () => {
                                            await CB.saveDoc('receitas_pessoais', `ia_${slug(iaSugestao.nome)}_${Date.now()}`, {
                                                nome: iaSugestao.nome, categoria: iaSugestao.categoria || 'Pratos principais',
                                                tempo_preparo: iaSugestao.tempo_preparo || '20 min', porcoes: Number(iaSugestao.porcoes) || 2,
                                                ingredientes: iaSugestao.ingredientes || [], modo_preparo: iaSugestao.modo_preparo || []
                                            });
                                            mostrarToast('Receita salva em Minhas Receitas!');
                                        })}
                                        className="text-xs bg-white border border-violet-300 text-violet-800 font-bold px-3 py-1.5 rounded-xl hover:bg-violet-100"
                                    >
                                        💾 Salvar
                                    </button>
                                    <button onClick={() => setIaSugestao(null)} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-4 h-4" /></button>
                                </div>
                            </div>
                            {iaSugestao.dica && <p className="text-xs bg-white/80 text-violet-900 px-3 py-2 rounded-xl">💡 {iaSugestao.dica}</p>}
                            <details className="text-xs">
                                <summary className="cursor-pointer font-bold text-violet-700">Ver ingredientes e modo de preparo</summary>
                                <div className="mt-2 space-y-2">
                                    <ul className="space-y-0.5 text-slate-600">
                                        {(iaSugestao.ingredientes || []).map((ig, i) => <li key={i}>• {ig.quantidade} {ig.unidade} de {ig.nome_generico}</li>)}
                                    </ul>
                                    <ol className="space-y-1 text-slate-600 list-decimal pl-4">
                                        {(iaSugestao.modo_preparo || []).map((p, i) => <li key={i}>{p}</li>)}
                                    </ol>
                                </div>
                            </details>
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filtradas.map(r => {
                            const c = r._compat;
                            const barCls = c.pct >= 80 ? 'bg-emerald-500' : c.pct >= 50 ? 'bg-amber-500' : 'bg-rose-400';
                            const txtCls = c.pct >= 80 ? 'text-emerald-700' : c.pct >= 50 ? 'text-amber-700' : 'text-rose-600';
                            return (
                                <div key={`${r._pessoal ? 'p' : 'b'}_${r.id}`} className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between space-y-3">
                                    <div className="space-y-3">
                                        <div className="flex justify-between items-start gap-2">
                                            <div>
                                                <div className="flex flex-wrap items-center gap-1.5">
                                                    <h3 className="text-sm font-bold text-slate-800">{r.nome}</h3>
                                                    {r._pessoal && <span className="text-[10px] font-bold bg-violet-100 text-violet-800 px-2 py-0.5 rounded-full">Pessoal</span>}
                                                </div>
                                                <p className="text-[11px] text-slate-500 mt-0.5">{r.categoria} • {r.tempo_preparo} • {r.porcoes} porções</p>
                                            </div>
                                            {r._pessoal && (
                                                <button onClick={() => setModalReceita(r)} className="text-xs text-slate-400 hover:text-violet-700 font-bold" title="Editar receita">✏️</button>
                                            )}
                                        </div>

                                        <div>
                                            <div className="flex justify-between items-center text-[11px] mb-1">
                                                <span className={`font-bold ${txtCls}`}>{c.pct}% compatível com seu estoque ({c.disponiveis.length}/{(r.ingredientes || []).length})</span>
                                                {c.pertoVencer > 0 && <span className="font-bold text-orange-700 bg-orange-100 px-2 py-0.5 rounded-full text-[10px]">⏰ Usa {c.pertoVencer} perto de vencer</span>}
                                            </div>
                                            <div className="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                                <div className={`h-full ${barCls}`} style={{ width: `${c.pct}%` }}></div>
                                            </div>
                                        </div>

                                        <details className="text-xs">
                                            <summary className="cursor-pointer font-bold text-slate-600 hover:text-violet-700">
                                                Ingredientes ({(r.ingredientes || []).length})
                                            </summary>
                                            <ul className="mt-1.5 space-y-1">
                                                {(r.ingredientes || []).map((ig, i) => {
                                                    const ok = c.disponiveis.some(d => d.nome_generico === ig.nome_generico && d.item_estoque_id === ig.item_estoque_id);
                                                    return (
                                                        <li key={i} className={`flex items-center gap-1.5 text-[11px] ${ok ? 'text-slate-700' : 'text-slate-400'}`}>
                                                            <span>{ok ? '✅' : '⭕'}</span>
                                                            <span>{ig.quantidade} {ig.unidade} — {ig.nome_generico}</span>
                                                        </li>
                                                    );
                                                })}
                                            </ul>
                                        </details>

                                        <details className="text-xs">
                                            <summary className="cursor-pointer font-bold text-slate-600 hover:text-violet-700">
                                                Modo de preparo ({(r.modo_preparo || []).length} passos)
                                            </summary>
                                            <ol className="mt-1.5 space-y-1 list-decimal pl-4 text-[11px] text-slate-600">
                                                {(r.modo_preparo || []).map((p, i) => <li key={i}>{p}</li>)}
                                            </ol>
                                        </details>
                                    </div>

                                    <div className="flex gap-2 pt-3 border-t border-slate-100">
                                        <button onClick={() => abrirModalPreparei(r)} className="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold py-2 px-3 rounded-xl transition">
                                            🍳 Preparei
                                        </button>
                                        <button onClick={() => adicionarFaltantesLista(r)} disabled={c.faltando.length === 0} className="flex-1 bg-amber-50 hover:bg-amber-100 disabled:opacity-40 text-amber-800 text-xs font-bold py-2 px-3 rounded-xl transition">
                                            🛒 Faltantes ({c.faltando.length})
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {filtradas.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhuma receita encontrada neste filtro.</p>}

                    {/* Modal Preparei Receita */}
                    {modalPreparei && (
                        <div className="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-50 p-0 sm:p-4" onClick={() => setModalPreparei(null)}>
                            <div className="bg-white w-full sm:max-w-md sm:rounded-3xl rounded-t-3xl max-h-[85vh] overflow-y-auto p-6 space-y-4 shadow-2xl" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-center">
                                    <h3 className="text-base font-bold text-slate-800">🍳 Preparei: {modalPreparei.nome}</h3>
                                    <button onClick={() => setModalPreparei(null)} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
                                </div>

                                <div className="space-y-2">
                                    <p className="text-xs font-bold text-slate-600">Baixar do estoque (ajuste as quantidades reais usadas):</p>
                                    {modalPreparei._compat.disponiveis.map(ig => (
                                        <div key={ig._prod.id} className="flex items-center justify-between gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                                            <div className="min-w-0 flex-1">
                                                <p className="font-bold text-slate-800 truncate">{ig._prod.name}</p>
                                                <p className="text-[10px] text-slate-400">Receita pede {ig.quantidade} {ig.unidade} • Saldo: {ig._prod.stockTotal} {ig._prod.unit}</p>
                                            </div>
                                            <div className="flex items-center gap-1 shrink-0">
                                                <input
                                                    type="number"
                                                    min="0"
                                                    step="0.1"
                                                    value={qtyEdits[ig._prod.id] !== undefined ? qtyEdits[ig._prod.id] : 0}
                                                    onChange={e => setQtyEdits(prev => ({ ...prev, [ig._prod.id]: e.target.value }))}
                                                    className="w-16 border rounded-lg px-2 py-1 text-center font-bold bg-white"
                                                />
                                                <span className="text-[10px] text-slate-500">{ig._prod.unit}</span>
                                            </div>
                                        </div>
                                    ))}
                                    {modalPreparei._compat.disponiveis.length === 0 && (
                                        <p className="text-xs text-slate-400 italic">Nenhum ingrediente desta receita tem saldo vinculado para baixa.</p>
                                    )}
                                </div>

                                <div className="bg-indigo-50 border border-indigo-200 rounded-2xl p-3 space-y-2">
                                    <label className="flex items-center gap-2 cursor-pointer text-xs font-bold text-indigo-900">
                                        <input type="checkbox" checked={gerarFreezer} onChange={e => setGerarFreezer(e.target.checked)} className="w-4 h-4 accent-indigo-700" />
                                        <span>❄️ Gerar porções prontas no Freezer</span>
                                    </label>
                                    {gerarFreezer && (
                                        <div className="flex items-center gap-2 pl-6 text-xs text-indigo-800">
                                            <span>Quantidade de porções:</span>
                                            <input type="number" min="1" value={qtdPorcoesFreezer} onChange={e => setQtdPorcoesFreezer(e.target.value)} className="w-16 border rounded-lg px-2 py-1 text-center bg-white font-bold" />
                                        </div>
                                    )}
                                </div>

                                <div className="flex gap-2">
                                    <button onClick={() => setModalPreparei(null)} className="flex-1 bg-slate-100 text-slate-700 py-2.5 rounded-xl text-xs font-bold">Cancelar</button>
                                    <button onClick={confirmarPreparei} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-xs font-bold">Confirmar Baixa</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {modalReceita && (
                        <ModalReceita
                            receita={modalReceita.id ? modalReceita : null}
                            produtosComEstoque={prodsComestiveis}
                            onClose={() => setModalReceita(null)}
                            onSalvo={() => { setModalReceita(null); mostrarToast('Receita salva!'); }}
                            mostrarToast={mostrarToast}
                        />
                    )}
                </div>
            );
        }

        function ModalReceita({ receita, produtosComEstoque, onClose, onSalvo, mostrarToast }) {
            const [nome, setNome] = useState((receita && receita.nome) || '');
            const [categoria, setCategoria] = useState((receita && receita.categoria) || 'Pratos principais');
            const [tempoPreparo, setTempoPreparo] = useState((receita && receita.tempo_preparo) || '30 min');
            const [porcoes, setPorcoes] = useState((receita && receita.porcoes) || 2);
            const [ingredientes, setIngredientes] = useState(
                receita && Array.isArray(receita.ingredientes) && receita.ingredientes.length > 0
                    ? receita.ingredientes.map(ig => ({ ...ig }))
                    : [{ item_estoque_id: '', nome_generico: '', quantidade: 1, unidade: 'unidade' }]
            );
            const [modoPreparo, setModoPreparo] = useState(
                receita && Array.isArray(receita.modo_preparo) && receita.modo_preparo.length > 0
                    ? [...receita.modo_preparo]
                    : ['']
            );
            const [salvando, setSalvando] = useState(false);

            const atualizarIng = (idx, campos) => setIngredientes(prev => prev.map((ig, i) => i === idx ? { ...ig, ...campos } : ig));

            const selecionarEstoqueIng = (idx, prodId) => {
                const prod = produtosComEstoque.find(p => p.id === prodId);
                if (prod) {
                    atualizarIng(idx, { item_estoque_id: prod.id, nome_generico: prod.name, unidade: prod.unit || 'unidade' });
                } else {
                    atualizarIng(idx, { item_estoque_id: '' });
                }
            };

            const salvar = async (e) => {
                e.preventDefault();
                if (!nome.trim()) return;
                setSalvando(true);
                try {
                    const id = (receita && receita.id) || `rec_${slug(nome)}_${Date.now()}`;
                    await CB.saveDoc('receitas_pessoais', id, {
                        nome: nome.trim(),
                        categoria,
                        tempo_preparo: tempoPreparo.trim(),
                        porcoes: Number(porcoes) || 1,
                        ingredientes: ingredientes.filter(ig => (ig.nome_generico || '').trim()),
                        modo_preparo: modoPreparo.filter(p => (p || '').trim())
                    });
                    onSalvo();
                } catch (err) {
                    console.error(err);
                    mostrarToast('Erro ao salvar receita.', 'erro');
                } finally {
                    setSalvando(false);
                }
            };

            const excluir = async () => {
                if (!receita || !receita.id) return;
                if (!confirm(`Excluir a receita "${receita.nome}"?`)) return;
                await CB.removeDoc('receitas_pessoais', receita.id);
                mostrarToast('Receita excluída.');
                onClose();
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <form onSubmit={salvar} className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl my-8 space-y-4">
                        <div className="flex justify-between items-center">
                            <h3 className="text-base font-bold text-slate-800">{receita ? '✏️ Editar Receita' : '+ Nova Receita Pessoal'}</h3>
                            <button type="button" onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
                        </div>

                        <div>
                            <label className="block text-xs font-semibold mb-1">Nome da receita *</label>
                            <input type="text" required value={nome} onChange={e => setNome(e.target.value)} placeholder="Ex: Risoto de frango da casa" className="w-full border rounded-xl px-3 py-2 text-xs" />
                        </div>

                        <div className="grid grid-cols-3 gap-2">
                            <div>
                                <label className="block text-xs font-semibold mb-1">Categoria</label>
                                <select value={categoria} onChange={e => setCategoria(e.target.value)} className="w-full border rounded-xl px-2 py-2 text-xs bg-white">
                                    {['Pratos principais', 'Lanches rápidos', 'Sobremesas', 'Acompanhamentos'].map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold mb-1">Tempo</label>
                                <input type="text" value={tempoPreparo} onChange={e => setTempoPreparo(e.target.value)} className="w-full border rounded-xl px-2 py-2 text-xs" />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold mb-1">Porções</label>
                                <input type="number" min="1" value={porcoes} onChange={e => setPorcoes(e.target.value)} className="w-full border rounded-xl px-2 py-2 text-xs" />
                            </div>
                        </div>

                        <div className="space-y-2 border-t pt-3">
                            <div className="flex justify-between items-center">
                                <span className="text-xs font-bold text-slate-700">Ingredientes (vinculados ao estoque)</span>
                                <button type="button" onClick={() => setIngredientes(prev => [...prev, { item_estoque_id: '', nome_generico: '', quantidade: 1, unidade: 'unidade' }])} className="text-xs text-violet-700 font-bold">+ Ingrediente</button>
                            </div>
                            <div className="space-y-2 max-h-48 overflow-y-auto">
                                {ingredientes.map((ig, i) => (
                                    <div key={i} className="bg-slate-50 p-2.5 rounded-xl space-y-1.5 border border-slate-100">
                                        <select value={ig.item_estoque_id || ''} onChange={e => selecionarEstoqueIng(i, e.target.value)} className="w-full border rounded-lg px-2 py-1 text-xs bg-white">
                                            <option value="">-- Vincular item do estoque (opcional) --</option>
                                            {produtosComEstoque.map(p => <option key={p.id} value={p.id}>{p.name} ({p.unit})</option>)}
                                        </select>
                                        <div className="flex gap-1.5 items-center">
                                            <input type="text" placeholder="Nome do ingrediente" value={ig.nome_generico} onChange={e => atualizarIng(i, { nome_generico: e.target.value })} className="flex-1 border rounded-lg px-2 py-1 text-xs bg-white" />
                                            <input type="number" step="0.1" min="0" value={ig.quantidade} onChange={e => atualizarIng(i, { quantidade: Number(e.target.value) })} className="w-16 border rounded-lg px-2 py-1 text-xs text-center bg-white" />
                                            <input type="text" placeholder="un" value={ig.unidade} onChange={e => atualizarIng(i, { unidade: e.target.value })} className="w-20 border rounded-lg px-2 py-1 text-xs bg-white" />
                                            {ingredientes.length > 1 && <button type="button" onClick={() => setIngredientes(prev => prev.filter((_, idx) => idx !== i))} className="text-rose-500 font-bold px-1">✕</button>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="space-y-2 border-t pt-3">
                            <div className="flex justify-between items-center">
                                <span className="text-xs font-bold text-slate-700">Modo de preparo</span>
                                <button type="button" onClick={() => setModoPreparo(prev => [...prev, ''])} className="text-xs text-violet-700 font-bold">+ Passo</button>
                            </div>
                            <div className="space-y-1.5 max-h-36 overflow-y-auto">
                                {modoPreparo.map((passo, i) => (
                                    <div key={i} className="flex gap-1.5 items-center">
                                        <span className="text-xs font-bold text-violet-700">{i + 1}.</span>
                                        <input type="text" value={passo} onChange={e => setModoPreparo(prev => prev.map((x, idx) => idx === i ? e.target.value : x))} placeholder={`Passo ${i + 1}`} className="flex-1 border rounded-lg px-2 py-1.5 text-xs" />
                                        {modoPreparo.length > 1 && <button type="button" onClick={() => setModoPreparo(prev => prev.filter((_, idx) => idx !== i))} className="text-rose-500 font-bold px-1">✕</button>}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="flex justify-between items-center pt-3 border-t">
                            {receita && receita.id ? (
                                <button type="button" onClick={excluir} className="text-xs text-rose-600 font-bold hover:underline">Excluir</button>
                            ) : <span />}
                            <div className="flex gap-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-xs text-slate-600">Cancelar</button>
                                <button type="submit" disabled={salvando} className="bg-violet-700 text-white px-5 py-2 rounded-xl text-xs font-bold disabled:opacity-50">{salvando ? 'Salvando...' : 'Salvar Receita'}</button>
                            </div>
                        </div>
                    </form>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
