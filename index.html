                                        <option value="__outro__">+ Outro...</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Preço de referência (R$)</label>
                                    <input type="number" step="0.01" min="0" placeholder="0.00" value={defaultPrice} onChange={e => setDefaultPrice(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-2">
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Unidade</label>
                                    <input type="text" placeholder="un, kg, L" value={unit} onChange={e => setUnit(e.target.value)} className="w-full border rounded-xl px-2.5 py-2 text-xs" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Qtd padrão</label>
                                    <input type="number" step="0.01" min="0.01" value={defaultQty} onChange={e => setDefaultQty(e.target.value)} className="w-full border rounded-xl px-2.5 py-2 text-xs" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Estoque mín.</label>
                                    <input type="number" step="0.01" min="0" value={minStock} onChange={e => setMinStock(e.target.value)} className="w-full border rounded-xl px-2.5 py-2 text-xs" />
                                </div>
                            </div>
                            {novo && (
                                <div className="grid grid-cols-2 gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                                    <div>
                                        <label className="block text-[11px] font-medium text-slate-600 mb-1">Estoque inicial</label>
                                        <input type="number" step="0.01" min="0" value={estoqueInicial} onChange={e => setEstoqueInicial(e.target.value)} className="w-full border rounded-lg px-2.5 py-1 text-xs bg-white" />
                                    </div>
                                    <div>
                                        <label className="block text-[11px] font-medium text-slate-600 mb-1">Validade inicial</label>
                                        <input type="date" value={validadeInicial} onChange={e => setValidadeInicial(e.target.value)} className="w-full border rounded-lg px-2.5 py-1 text-xs bg-white" />
                                    </div>
                                </div>
                            )}
                            <div className="flex items-center gap-2 pt-1">
                                <label className="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-700">
                                    <input type="checkbox" checked={essencial} onChange={e => setEssencial(e.target.checked)} className="accent-slate-900" />
                                    <span>Marcar como item essencial</span>
                                </label>
                            </div>
                            <div className="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                                <button type="button" onClick={onClose} className="px-3 py-1.5 text-xs text-slate-600">Cancelar</button>
                                <button type="submit" disabled={salvando || processandoFoto} className="bg-slate-900 text-white px-4 py-1.5 rounded-xl text-xs font-semibold disabled:opacity-50">{salvando ? 'Salvando...' : 'Salvar'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ModalCompra({ compraParaEditar, focoNF, produtos, lotesValidade, historicoPrecos, listaCompras, establishments, onClose, onSalvo, onNovoProduto, onCatalogo, mostrarToast }) {
            const editando = Boolean(compraParaEditar && compraParaEditar.id);
            const itemVazio = () => ({ productId: '', isNew: false, newProductName: '', newProductBrand: '', quantity: 1, unitPrice: 0, expirationDate: '' });

            const [establishment, setEstablishment] = useState(() => {
                if (!compraParaEditar) return establishments[0];
                const achado = establishments.find(e => e === compraParaEditar.notes);
                return achado ? achado : 'Outro';
            });
            const [customEstablishment, setCustomEstablishment] = useState(() => {
                if (!compraParaEditar) return '';
                const achado = establishments.find(e => e === compraParaEditar.notes);
                return achado ? '' : (compraParaEditar.notes || '');
            });
            const [purchaseDate, setPurchaseDate] = useState(() => (compraParaEditar && compraParaEditar.purchase_date) || hojeISO());
            const [itens, setItens] = useState(() => {
                if (compraParaEditar && compraParaEditar.purchase_items && compraParaEditar.purchase_items.length > 0) {
                    return compraParaEditar.purchase_items.map(it => ({
                        productId: it.product_id,
                        isNew: false,
                        newProductName: '',
                        newProductBrand: '',
                        quantity: it.quantity,
                        unitPrice: it.unit_price,
                        expirationDate: it.expiration_date || ''
                    }));
                }
                return [itemVazio()];
            });
            const [fotosCompra, setFotosCompra] = useState(() => {
                if (compraParaEditar && Array.isArray(compraParaEditar.photos)) {
                    return compraParaEditar.photos.map((url, idx) => ({
                        id: `saved_${idx}_${Date.now()}`,
                        previewUrl: url,
                        ocrB64: (url || '').split(',')[1] || '',
                        mimeType: 'image/jpeg',
                        isPdf: false,
                        fileName: `Foto ${idx + 1}`
                    }));
                }
                return [];
            });

            const [salvando, setSalvando] = useState(false);
            const [lendoNota, setLendoNota] = useState(false);
            const [preparandoFotos, setPreparandoFotos] = useState(false);

            const totalNota = itens.reduce((acc, i) => acc + (Number(i.quantity || 0) * Number(i.unitPrice || 0)), 0);

            const atualizar = (idx, campos) => setItens(prev => prev.map((it, i) => i === idx ? { ...it, ...campos } : it));

            const escolherProduto = (idx, valor) => {
                if (valor === '__novo__') {
                    atualizar(idx, { isNew: true, productId: '__novo__' });
                    return;
                }
                const prod = produtos.find(p => p.id === valor);
                const ultimo = historicoPrecos.find(h => h.product_id === valor && Number(h.price) > 0);
                atualizar(idx, {
                    isNew: false,
                    productId: valor,
                    quantity: prod ? Number(prod.default_quantity || 1) : 1,
                    unitPrice: ultimo ? Number(ultimo.price) : (prod && Number(prod.default_price) > 0 ? Number(prod.default_price) : 0)
                });
            };

            const lerArquivoBase64 = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });

            const adicionarFotosCompra = async (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;
                setPreparandoFotos(true);
                try {
                    const novosArquivos = [];
                    for (const file of files) {
                        const ehPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
                        if (ehPdf) {
                            const pdfB64 = await lerArquivoBase64(file);
                            novosArquivos.push({
                                id: `pdf_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                                previewUrl: '',
                                ocrB64: pdfB64,
                                mimeType: 'application/pdf',
                                isPdf: true,
                                fileName: file.name || 'nota.pdf'
                            });
                        } else {
                            const ocrDataUrl = await comprimirImagem(file, 1280, 0.84);
                            const previewUrl = await comprimirImagem(file, 640, 0.62);
                            novosArquivos.push({
                                id: `foto_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                                previewUrl,
                                ocrB64: ocrDataUrl.split(',')[1] || '',
                                mimeType: 'image/jpeg',
                                isPdf: false,
                                fileName: file.name || 'foto.jpg'
                            });
                        }
                    }
                    setFotosCompra(prev => [...prev, ...novosArquivos]);
                    mostrarToast(`${novosArquivos.length} arquivo(s) carregado(s).`);
                } catch (err) {
                    console.error(err);
                    mostrarToast('Erro ao carregar arquivo(s).', 'erro');
                } finally {
                    setPreparandoFotos(false);
                    e.target.value = '';
                }
            };

            const removerFotoCompra = (idFoto) => {
                setFotosCompra(prev => prev.filter(f => f.id !== idFoto));
            };

            const analisarFotosComIA = async () => {
                if (fotosCompra.length === 0) {
                    mostrarToast('Adicione uma foto ou PDF da nota fiscal.', 'erro');
                    return;
                }

                let apiKey = localStorage.getItem('gemini_api_key') || '';
                if (!apiKey) {
                    apiKey = prompt('Digite sua chave GEMINI_API_KEY do Google AI Studio:') || '';
                    if (apiKey.trim()) {
                        apiKey = apiKey.trim();
                        localStorage.setItem('gemini_api_key', apiKey);
                        CB.saveDoc('settings', 'ia', { gemini_key: apiKey });
                    } else return;
                }

                setLendoNota(true);
                try {
                    const listaEstoque = produtos.map(p => ({ id: p.id, name: p.name, unit: p.unit }));
                    const promptTexto = "Extraia dados de notas fiscais de supermercados brasileiros. " +
                        "Cruze itens com o estoque atual:\n" + JSON.stringify(listaEstoque) + "\n\n" +
                        "Responda estritamente em JSON: " +
                        '{"supermercado": "Nome", "data": "AAAA-MM-DD", "itens": [{"produto": "Nome", "marca": "", "quantidade": 1, "preco_unitario": 10.50, "id_item_estoque": "id ou vazio"}]}';

                    const partes = [{ text: promptTexto }];
                    fotosCompra.forEach(f => {
                        if (f.ocrB64) partes.push({ inline_data: { mime_type: f.mimeType || 'image/jpeg', data: f.ocrB64 } });
                    });

                    const resJson = await chamarGeminiJSON(apiKey, partes, { temperature: 0 });
                    if (!resJson || !Array.isArray(resJson.itens) || resJson.itens.length === 0) {
                        throw new Error('Não foi possível identificar os itens na nota.');
                    }

                    if (resJson.supermercado) {
                        const achado = establishments.find(e => normalizar(e).includes(normalizar(resJson.supermercado)) || normalizar(resJson.supermercado).includes(normalizar(e)));
                        if (achado && achado !== 'Outro') {
                            setEstablishment(achado);
                            setCustomEstablishment('');
                        } else {
                            setEstablishment('Outro');
                            setCustomEstablishment(resJson.supermercado);
                        }
                    }

                    if (resJson.data && /^\d{4}-\d{2}-\d{2}$/.test(resJson.data)) {
                        setPurchaseDate(resJson.data);
                    }

                    const idsValidos = new Set(produtos.map(p => p.id));
                    const novosItensForm = [];
                    for (const it of resJson.itens) {
                        const nomeLimpo = (it.produto || '').trim();
                        const precoUn = Number(it.preco_unitario || 0);
                        const qtd = Number(it.quantidade || 1);
                        if (!nomeLimpo || precoUn <= 0) continue;

                        let prodEncontrado = (it.id_item_estoque && idsValidos.has(it.id_item_estoque)) ? produtos.find(p => p.id === it.id_item_estoque) : null;
                        if (!prodEncontrado) prodEncontrado = produtos.find(p => normalizar(p.name) === normalizar(nomeLimpo));
                        if (!prodEncontrado) prodEncontrado = acharProdutoDaOferta(nomeLimpo, produtos);

                        novosItensForm.push({
                            productId: prodEncontrado ? prodEncontrado.id : '__novo__',
                            isNew: !prodEncontrado,
                            newProductName: nomeLimpo,
                            newProductBrand: (it.marca || '').trim(),
                            quantity: qtd > 0 ? qtd : 1,
                            unitPrice: precoUn,
                            expirationDate: ''
                        });
                    }

                    if (novosItensForm.length > 0) {
                        setItens(novosItensForm);
                        mostrarToast(`${novosItensForm.length} itens extraídos.`);
                    }
                } catch (err) {
                    console.error(err);
                    mostrarToast(err.message || 'Erro ao ler nota fiscal.', 'erro');
                } finally {
                    setLendoNota(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const validos = itens.filter(i => (i.productId || (i.isNew && (i.newProductName || '').trim())) && Number(i.quantity) > 0);
                if (validos.length === 0) { mostrarToast('Preencha os itens da compra.', 'erro'); return; }

                const nomeFinalMercado = (establishment === 'Outro' && customEstablishment.trim()) ? customEstablishment.trim() : establishment;

                setSalvando(true);
                try {
                    const compraId = editando ? compraParaEditar.id : `comp_${Date.now()}`;
                    const ops = [];

                    if (editando) {
                        lotesValidade.filter(x => x.purchase_id === compraId).forEach(l => ops.push({ type: 'delete', col: 'product_expiration', id: l.id }));
                        historicoPrecos.filter(x => x.purchase_id === compraId).forEach(h => ops.push({ type: 'delete', col: 'price_history', id: h.id }));
                    }

                    const prodsMap = new Map(produtos.map(p => [p.id, p]));
                    const itensFormatados = validos.map((item, idx) => {
                        let prodId = item.productId;
                        let prodObj = prodId && prodId !== '__novo__' ? prodsMap.get(prodId) : null;
                        if (item.isNew || !prodObj) {
                            const nomeNovo = (item.newProductName || 'Item Nota Fiscal').trim();
                            prodId = `prod_${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 5)}`;
                            prodObj = {
                                id: prodId, name: nomeNovo, category: 'Outros', brand: (item.newProductBrand || '').trim(),
                                unit: 'unidade', default_quantity: Number(item.quantity) || 1, minimum_stock: 1,
                                default_price: Number(item.unitPrice) || 0, local_estoque: 'despensa',
                                image_url: '', notes: 'Via Nota Fiscal', is_demo: false
                            };
                            ops.push({ type: 'set', col: 'products', id: prodId, data: prodObj });
                            prodsMap.set(prodId, prodObj);
                        }
                        return {
                            product_id: prodId,
                            product_name: prodObj.name,
                            quantity: Number(item.quantity),
                            unit_price: Number(item.unitPrice) || 0,
                            total_price: Number((Number(item.quantity) * (Number(item.unitPrice) || 0)).toFixed(2)),
                            expiration_date: item.expirationDate || ''
                        };
                    });

                    const total = Number(itensFormatados.reduce((a, i) => a + i.total_price, 0).toFixed(2));
                    const fotosParaSalvar = fotosCompra.map(f => f.previewUrl).filter(Boolean);

                    ops.push({
                        type: 'set', col: 'purchases', id: compraId,
                        data: {
                            purchase_date: purchaseDate,
                            total,
                            notes: nomeFinalMercado,
                            purchase_items: itensFormatados,
                            photos: fotosParaSalvar,
                            from_nota: true,
                            is_demo: false
                        }
                    });

                    for (let idx = 0; idx < itensFormatados.length; idx++) {
                        const it = itensFormatados[idx];
                        const prodObj = prodsMap.get(it.product_id);
                        ops.push({
                            type: 'set', col: 'product_expiration', id: `lote_${compraId}_${idx}`,
                            data: {
                                product_id: it.product_id, quantity: it.quantity, expiration_date: it.expiration_date,
                                local_estoque: obterLocalEstoque(prodObj, null),
                                purchase_id: compraId, is_demo: false
                            }
                        });
                        if (it.unit_price > 0) {
                            ops.push({
                                type: 'set', col: 'price_history', id: `ph_${compraId}_${idx}`,
                                data: {
                                    product_id: it.product_id, product_name: it.product_name,
                                    brand: (prodObj && prodObj.brand) || '',
                                    price: it.unit_price,
                                    date: purchaseDate, source: nomeFinalMercado, purchase_id: compraId,
                                    from_nota: true, from_site: false, is_demo: false
                                }
                            });
                            ops.push({
                                type: 'set', col: 'products', id: it.product_id,
                                data: { default_price: it.unit_price }
                            });
                        }
                    }

                    const idsComprados = new Set(itensFormatados.map(i => i.product_id));
                    listaCompras.filter(x => !x.purchased && x.product_id && idsComprados.has(x.product_id)).forEach(l => {
                        ops.push({ type: 'set', col: 'shopping_list', id: l.id, data: { purchased: true } });
                    });

                    await CB.batchOps(ops);
                    onSalvo();
                } catch (err) {
                    console.error(err);
                    mostrarToast('Erro ao salvar compra.', 'erro');
                } finally {
                    setSalvando(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl my-6 space-y-4 border border-slate-200">
                        <div className="flex flex-wrap justify-between items-center gap-2">
                            <h3 className="text-sm font-bold text-slate-900">
                                {editando ? 'Editar Compra' : 'Registrar Compra'}
                            </h3>
                            <div className="flex gap-2">
                                <button type="button" onClick={onCatalogo} className="text-xs text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg border">Catálogo</button>
                                <button type="button" onClick={onNovoProduto} className="text-xs text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg border">+ Produto</button>
                            </div>
                        </div>

                        {/* Card Leitor OCR Minimalista */}
                        <div className="bg-slate-50 border border-slate-200 p-4 rounded-xl space-y-3">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                <div>
                                    <p className="text-xs font-semibold text-slate-900">Anexo de Nota Fiscal (Câmera ou PDF)</p>
                                    <p className="text-[11px] text-slate-500">Reconhecimento ótico dos itens e preços.</p>
                                </div>
                                <div className="flex gap-2">
                                    <label className="bg-white border border-slate-200 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-lg cursor-pointer hover:bg-slate-50">
                                        Câmera
                                        <input type="file" accept="image/*" capture="environment" onChange={adicionarFotosCompra} disabled={lendoNota || preparandoFotos} className="hidden" />
                                    </label>
                                    <label className="bg-white border border-slate-200 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-lg cursor-pointer hover:bg-slate-50">
                                        Arquivo / PDF
                                        <input type="file" accept="image/*,application/pdf" multiple onChange={adicionarFotosCompra} disabled={lendoNota || preparandoFotos} className="hidden" />
                                    </label>
                                </div>
                            </div>

                            {fotosCompra.length > 0 && (
                                <div className="space-y-2 pt-2 border-t border-slate-200">
                                    <div className="flex flex-wrap gap-2">
                                        {fotosCompra.map((foto) => (
                                            <div key={foto.id} className="relative w-14 h-14 rounded-lg overflow-hidden border border-slate-200 bg-white flex items-center justify-center">
                                                {foto.isPdf ? (
                                                    <span className="text-[10px] text-slate-600 font-medium">PDF</span>
                                                ) : (
                                                    <img src={foto.previewUrl} alt="" className="w-full h-full object-cover" />
                                                )}
                                                <button type="button" onClick={() => removerFotoCompra(foto.id)} className="absolute top-0 right-0 bg-slate-900 text-white w-4 h-4 text-[9px] flex items-center justify-center">✕</button>
                                            </div>
                                        ))}
                                    </div>
                                    <button
                                        type="button"
                                        onClick={analisarFotosComIA}
                                        disabled={lendoNota || preparandoFotos}
                                        className="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs py-2 rounded-lg transition disabled:opacity-50"
                                    >
                                        {lendoNota ? 'Processando nota...' : 'Extrair dados da nota'}
                                    </button>
                                </div>
                            )}
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Supermercado</label>
                                    <select value={establishment} onChange={e => setEstablishment(e.target.value)} className="w-full border rounded-xl px-2.5 py-2 text-xs bg-white">
                                        {establishments.map(est => <option key={est} value={est}>{est}</option>)}
                                    </select>
                                    {establishment === 'Outro' && (
                                        <input
                                            type="text"
                                            placeholder="Nome da loja..."
                                            value={customEstablishment}
                                            onChange={e => setCustomEstablishment(e.target.value)}
                                            className="w-full border rounded-xl px-3 py-1.5 text-xs mt-1.5"
                                            required
                                        />
                                    )}
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Data</label>
                                    <input type="date" value={purchaseDate} onChange={e => setPurchaseDate(e.target.value)} className="w-full border rounded-xl px-2.5 py-2 text-xs" required />
                                </div>
                            </div>

                            <div className="border-t border-slate-100 pt-2 space-y-2">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-semibold text-slate-700">Itens Comprados</span>
                                    <span className="text-xs font-bold text-slate-900">Total: R$ {dinheiro(totalNota)}</span>
                                </div>
                                <div className="space-y-2 max-h-56 overflow-y-auto">
                                    {itens.map((item, idx) => (
                                        <div key={idx} className="p-2.5 rounded-xl border border-slate-200 bg-slate-50 space-y-1.5">
                                            <div className="flex flex-wrap sm:flex-nowrap gap-1.5 items-center">
                                                <select value={item.isNew ? '__novo__' : item.productId} onChange={e => escolherProduto(idx, e.target.value)} className="w-full sm:flex-1 border rounded-lg px-2 py-1.5 text-xs bg-white">
                                                    <option value="">Selecione o produto...</option>
                                                    <option value="__novo__">+ Cadastrar novo item...</option>
                                                    {produtos.map(p => <option key={p.id} value={p.id}>{p.name} ({p.unit})</option>)}
                                                </select>
                                                <input type="number" step="0.01" min="0.01" placeholder="Qtd" value={item.quantity} onChange={e => atualizar(idx, { quantity: e.target.value })} className="w-16 border rounded-lg px-2 py-1.5 text-xs bg-white" />
                                                <input type="number" step="0.01" min="0" placeholder="R$ un." value={item.unitPrice} onChange={e => atualizar(idx, { unitPrice: e.target.value })} className="w-20 border rounded-lg px-2 py-1.5 text-xs bg-white" />
                                                <input type="date" value={item.expirationDate} onChange={e => atualizar(idx, { expirationDate: e.target.value })} className="w-28 border rounded-lg px-2 py-1.5 text-xs bg-white" />
                                                {itens.length > 1 && <button type="button" onClick={() => setItens(itens.filter((_, i) => i !== idx))} className="text-slate-400 hover:text-rose-600 px-1">✕</button>}
                                            </div>
                                            {item.isNew && (
                                                <input
                                                    type="text"
                                                    placeholder="Nome do produto no estoque..."
                                                    value={item.newProductName}
                                                    onChange={e => atualizar(idx, { newProductName: e.target.value })}
                                                    className="w-full border rounded-lg px-2.5 py-1 text-xs bg-white"
                                                    required
                                                />
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <button type="button" onClick={() => setItens([...itens, itemVazio()])} className="text-xs text-slate-700 font-semibold hover:underline">+ Adicionar linha</button>
                            </div>

                            <div className="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                                <button type="button" onClick={onClose} className="px-3 py-1.5 text-xs text-slate-600">Cancelar</button>
                                <button type="submit" disabled={salvando || lendoNota} className="bg-slate-900 text-white px-4 py-1.5 rounded-xl text-xs font-semibold disabled:opacity-50">
                                    {salvando ? 'Salvando...' : 'Confirmar Compra'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ModalConsumo({ produto, baixarDosLotes, onClose, onSalvo, mostrarToast }) {
            const [qtdConsumir, setQtdConsumir] = useState(1);
            const [salvando, setSalvando] = useState(false);

            const handleConsumir = async (e) => {
                e.preventDefault();
                const qtd = Number(qtdConsumir);
                if (!(qtd > 0) || qtd > produto.stockTotal) {
                    mostrarToast(`Saldo insuficiente. Disponível: ${produto.stockTotal} ${produto.unit}`, 'erro');
                    return;
                }
                setSalvando(true);
                try {
                    await baixarDosLotes(produto, qtd);
                    await CB.saveDoc('consumption', `cons_${Date.now()}`, {
                        product_id: produto.id, product_name: produto.name, quantity: qtd,
                        consumed_at: new Date().toISOString(), notes: 'Baixa de consumo'
                    });
                    onSalvo();
                } catch (err) {
                    console.error(err);
                    mostrarToast('Erro ao registrar baixa.', 'erro');
                } finally {
                    setSalvando(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4 border border-slate-200">
                        <h3 className="text-sm font-bold text-slate-900">Registrar Consumo</h3>
                        <p className="text-xs text-slate-500">{produto.name} (disponível: <strong>{produto.stockTotal} {produto.unit}</strong>)</p>
                        <form onSubmit={handleConsumir} className="space-y-3">
                            <div>
                                <label className="block text-xs font-medium text-slate-600 mb-1">Quantidade utilizada ({produto.unit}):</label>
                                <input type="number" step="0.01" min="0.01" max={produto.stockTotal} value={qtdConsumir} onChange={e => setQtdConsumir(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" required />
                            </div>
                            <div className="flex justify-end space-x-2 pt-2">
                                <button type="button" onClick={onClose} className="px-3 py-1.5 text-xs text-slate-500">Cancelar</button>
                                <button type="submit" disabled={salvando} className="bg-slate-900 text-white px-4 py-1.5 rounded-xl text-xs font-semibold disabled:opacity-50">Confirmar</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ModalDetalheCompra({ compra, onClose, onExcluir, onEditar, onFotoAmpliada }) {
            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 border border-slate-200">
                        <div className="flex justify-between items-center">
                            <h3 className="text-sm font-bold text-slate-900">{compra.notes || 'Supermercado'}</h3>
                            <span className="text-xs font-bold text-slate-900 bg-slate-100 px-2.5 py-1 rounded-lg">R$ {dinheiro(compra.total)}</span>
                        </div>
                        <p className="text-xs text-slate-500">Data registrada: {compra.purchase_date}</p>
                        {Array.isArray(compra.photos) && compra.photos.length > 0 && (
                            <div className="flex gap-2 overflow-x-auto pb-1">
                                {compra.photos.map((foto, idx) => (
                                    <img
                                        key={idx}
                                        src={foto}
                                        alt=""
                                        onClick={() => onFotoAmpliada && onFotoAmpliada({ url: foto, nome: `${compra.notes} — Nota ${idx + 1}` })}
                                        className="w-14 h-14 object-cover rounded-lg border border-slate-200 cursor-pointer shrink-0"
                                    />
                                ))}
                            </div>
                        )}
                        <div className="space-y-1.5 max-h-56 overflow-y-auto">
                            {(compra.purchase_items || []).map((item, idx) => (
                                <div key={idx} className="flex justify-between items-center p-2 bg-slate-50 rounded-lg text-xs">
                                    <div>
                                        <p className="font-medium text-slate-800">{item.product_name}</p>
                                        <p className="text-[10px] text-slate-400">{item.quantity} x R$ {dinheiro(item.unit_price)}</p>
                                    </div>
                                    <span className="font-semibold text-slate-900">R$ {dinheiro(item.total_price)}</span>
                                </div>
                            ))}
                        </div>
                        <div className="flex space-x-2 pt-2 border-t border-slate-100">
                            <button onClick={() => onEditar(compra)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 py-2 rounded-xl text-xs font-semibold">Editar</button>
                            <button onClick={onExcluir} className="px-3 bg-rose-50 hover:bg-rose-100 text-rose-700 py-2 rounded-xl text-xs font-semibold">Excluir</button>
                            <button onClick={onClose} className="px-3 bg-slate-100 hover:bg-slate-200 py-2 rounded-xl text-xs font-semibold">Fechar</button>
                        </div>
                    </div>
                </div>
            );
        }

        function ModalBuscaGlobal({ produtosComEstoque, historicoPrecos, onClose }) {
            const [termo, setTermo] = useState('');
            const t = normalizar(termo);
            const prodRes = t ? produtosComEstoque.filter(p => normalizar(p.name).includes(t)) : [];
            const precosRes = t ? historicoPrecos.filter(h => normalizar(h.product_name).includes(t)) : [];

            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4 border border-slate-200">
                        <div className="flex justify-between items-center">
                            <h3 className="text-sm font-bold text-slate-900">Pesquisa Geral</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-4 h-4" /></button>
                        </div>
                        <input type="text" placeholder="Nome do item..." value={termo} onChange={e => setTermo(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs" autoFocus />
                        <div className="space-y-2 max-h-64 overflow-y-auto">
                            {prodRes.map(p => (
                                <div key={p.id} className="p-2.5 bg-slate-50 border border-slate-100 rounded-lg text-xs flex justify-between gap-2">
                                    <span className="font-medium text-slate-800">{p.name}</span>
                                    <span className="font-semibold text-slate-900">Estoque: {p.stockTotal} {p.unit}</span>
                                </div>
                            ))}
                            {precosRes.slice(0, 6).map(h => (
                                <div key={h.id} className="p-2.5 bg-slate-50 rounded-lg text-xs flex justify-between gap-2">
                                    <span className="text-slate-600">{h.product_name} ({h.source})</span>
                                    <span className="font-semibold text-slate-900">R$ {dinheiro(h.price)}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function ModalConfig({ user, modoLocal, dados, onClose, mostrarToast }) {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');

            const salvarApiKey = () => {
                localStorage.setItem('gemini_api_key', apiKey.trim());
                CB.saveDoc('settings', 'ia', { gemini_key: apiKey.trim() });
                mostrarToast('Chave da API atualizada.');
            };

            const exportar = () => {
                const blob = new Blob([JSON.stringify({ ...dados, versao: 'central-compras-v2', exportadoEm: new Date().toISOString() }, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup-central-compras-${hojeISO()}.json`;
                a.click();
                URL.revokeObjectURL(url);
                mostrarToast('Backup exportado.');
            };

            const importar = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const parsed = JSON.parse(ev.target.result);
                        if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.produtos)) throw new Error('inválido');
                        if (!confirm('Restaurar dados deste backup?')) return;
                        const ops = [];
                        for (const [chave, colecao] of COLECOES_BACKUP) {
                            for (const item of (parsed[chave] || [])) {
                                if (item && item.id) ops.push({ type: 'set', col: colecao, id: item.id, data: item });
                            }
                        }
                        if (ops.length > 0) await CB.batchOps(ops);
                        mostrarToast('Backup restaurado.');
                        onClose();
                    } catch (err) {
                        console.error(err);
                        mostrarToast('Arquivo de backup inválido.', 'erro');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-4 border border-slate-200">
                        <h3 className="text-sm font-bold text-slate-900">Configurações e Backup</h3>
                        
                        <div className="bg-slate-50 border border-slate-200 p-3.5 rounded-xl space-y-2">
                            <label className="block text-xs font-semibold text-slate-800">Chave GEMINI_API_KEY:</label>
                            <div className="flex gap-2">
                                <input
                                    type="password"
                                    placeholder="AIzaSy..."
                                    value={apiKey}
                                    onChange={e => setApiKey(e.target.value)}
                                    className="flex-1 border rounded-lg px-2.5 py-1.5 text-xs bg-white"
                                />
                                <button onClick={salvarApiKey} className="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">Salvar</button>
                            </div>
                        </div>

                        <div className="space-y-2 pt-2 border-t border-slate-100">
                            <button onClick={exportar} className="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-xl text-xs font-semibold">Exportar Backup (.json)</button>
                            <label className="block w-full text-center bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl text-xs font-semibold cursor-pointer border border-slate-200">
                                Restaurar Backup (.json)
                                <input type="file" accept=".json" onChange={importar} className="hidden" />
                            </label>
                        </div>
                        <button onClick={onClose} className="w-full text-xs text-slate-500 pt-1">Fechar</button>
                    </div>
                </div>
            );
        }

        const MONITOR_INTERVALO_MS = 30 * 60 * 1000;

        function parseCsv(texto) {
            const t = (texto || '').replace(/^\uFEFF/, '');
            const primeira = t.split(/\r?\n/)[0] || '';
            const sep = (primeira.match(/;/g) || []).length > (primeira.match(/,/g) || []).length ? ';' : ',';
            const linhas = [];
            let campo = '', linha = [], aspas = false;
            for (let i = 0; i < t.length; i++) {
                const c = t[i];
                if (aspas) {
                    if (c === '"') { if (t[i + 1] === '"') { campo += '"'; i++; } else aspas = false; }
                    else campo += c;
                } else if (c === '"') {
                    aspas = true;
                } else if (c === sep) {
                    linha.push(campo); campo = '';
                } else if (c === '\n' || c === '\r') {
                    if (c === '\r' && t[i + 1] === '\n') i++;
                    linha.push(campo); campo = '';
                    if (linha.some(x => x.trim() !== '')) linhas.push(linha);
                    linha = [];
                } else {
                    campo += c;
                }
            }
            linha.push(campo);
            if (linha.some(x => x.trim() !== '')) linhas.push(linha);
            return linhas;
        }

        function parsePreco(v) {
            let s = String(v || '').replace(/R\$|\s/g, '');
            if (!s) return NaN;
            if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
            else if (s.includes(',')) s = s.replace(',', '.');
            return parseFloat(s);
        }

        function parseDataOferta(v) {
            const s = String(v || '').trim();
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
            m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            return hojeISO();
        }

        function parseValidadeOferta(v) {
            const s = String(v || '').trim();
            if (!s) return '';
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
            m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            return '';
        }

        function nomeMercadoPadrao(nome) {
            const n = normalizar(nome);
            if (!n) return nome;
            const achado = INITIAL_ESTABLISHMENTS.find(e => e !== 'Outro' && (normalizar(e).includes(n) || n.includes(normalizar(e))));
            return achado || nome.trim();
        }

        function linhasParaOfertas(texto) {
            const linhas = parseCsv(texto);
            if (linhas.length === 0) return [];
            const nomes = linhas[0].map(c => normalizar(c));
            const temCab = nomes.includes('produto') || nomes.includes('preco') || nomes.includes('data');
            let idx;
            if (temCab) {
                const achar = (...ops) => nomes.findIndex(n => ops.includes(n));
                idx = {
                    data: achar('data'),
                    mercado: achar('supermercado', 'mercado', 'loja'),
                    produto: achar('produto', 'item', 'nome'),
                    marca: achar('marca', 'brand'),
                    preco: achar('preco', 'valor'),
                    validade: achar('validade', 'vencimento', 'expira'),
                    link: achar('link', 'url'),
                    id_item_estoque: achar('id_item_estoque', 'product_id')
                };
            } else {
                const legado5 = parsePreco(linhas[0][3]) > 0;
                idx = legado5
                    ? { data: 0, mercado: 1, produto: 2, marca: -1, preco: 3, validade: -1, link: 4, id_item_estoque: -1 }
                    : { data: 0, mercado: 1, produto: 2, marca: 3, preco: 4, validade: 5, link: 6, id_item_estoque: 7 };
            }
            const saida = [];
            (temCab ? linhas.slice(1) : linhas).forEach(l => {
                const produto = (l[idx.produto] || '').trim();
                const mercado = (l[idx.mercado] || '').trim();
                const preco = parsePreco(l[idx.preco]);
                if (!produto || !mercado || !(preco > 0)) return;
                const item = {
                    data: idx.data >= 0 ? parseDataOferta(l[idx.data]) : hojeISO(),
                    mercado: nomeMercadoPadrao(mercado),
                    produto,
                    marca: idx.marca >= 0 ? (l[idx.marca] || '').trim() : '',
                    preco,
                    validade: idx.validade >= 0 ? parseValidadeOferta(l[idx.validade]) : '',
                    link: idx.link >= 0 ? (l[idx.link] || '').trim() : '',
                    id_item_estoque: idx.id_item_estoque >= 0 ? (l[idx.id_item_estoque] || '').trim() : ''
                };
                if (ehOfertaVigente(item)) saida.push(item);
            });
            return saida;
        }

        function resolverProdutoOferta(o, prods) {
            if (o && o.id_item_estoque) {
                const pId = prods.find(p => p.id === o.id_item_estoque);
                if (pId) return pId;
            }
            return acharProdutoDaOferta(o.produto, prods);
        }

        function MonitorOfertas({ visivel, produtos, historicoPrecos, onOfertasAtualizadas, executar, mostrarToast }) {
            const [csvUrl, setCsvUrl] = useState('');
            const [desativadoManual, setDesativadoManual] = useState(false);
            const [urlInput, setUrlInput] = useState('');
            const [ofertas, setOfertas] = useState([]);
            const [status, setStatus] = useState('inativo');
            const [erro, setErro] = useState('');
            const [ultimaLeitura, setUltimaLeitura] = useState(null);
            const [filtroMercado, setFiltroMercado] = useState('Todos');
            const [soMeus, setSoMeus] = useState(false);
            const [busca, setBusca] = useState('');
            const [textoManual, setTextoManual] = useState('');
            const [cruzandoIA, setCruzandoIA] = useState(false);

            const dadosRef = React.useRef({});
            dadosRef.current = { produtos, historicoPrecos };

            const processar = async (texto, mesclar) => {
                const lista = linhasParaOfertas(texto).filter(ehOfertaVigente);
                const { produtos: prods, historicoPrecos: hist } = dadosRef.current;
                const mercadosCarregados = new Set(lista.map(o => normalizar(o.mercado)));

                const idsNovosAtivos = new Set();
                const matchedParaGravar = [];
                for (const o of [...lista].sort((a, b) => a.data.localeCompare(b.data))) {
                    const prod = resolverProdutoOferta(o, prods);
                    if (!prod) continue;
                    const id = `site_${slug(o.mercado)}_${slug(o.produto)}_${o.data}`;
                    idsNovosAtivos.add(id);
                    matchedParaGravar.push({ o, prod, id });
                }

                const paraExpirar = new Set();
                for (const h of hist) {
                    if (!h.from_site || h.expired) continue;
                    const vencida = !ehOfertaVigente(h);
                    const removidaDoMercado = mercadosCarregados.has(normalizar(h.source)) && !idsNovosAtivos.has(h.id);
                    if (vencida || removidaDoMercado) {
                        paraExpirar.add(h.id);
                        await CB.saveDoc('price_history', h.id, { expired: true });
                    }
                }

                const ultimoPreco = {};
                [...hist]
                    .filter(h => !h.expired && !paraExpirar.has(h.id) && ehOfertaVigente(h))
                    .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
                    .forEach(h => {
                        ultimoPreco[`${h.product_id}|${normalizar(h.source)}`] = Number(h.price);
                    });
                const existentesAtivos = new Set(hist.filter(h => !h.expired && !paraExpirar.has(h.id)).map(h => h.id));
                let gravados = 0;
                for (const { o, prod, id } of matchedParaGravar) {
                    const chave = `${prod.id}|${normalizar(o.mercado)}`;
                    const linkEfetivo = /^https?:\/\//i.test(o.link || '') ? o.link : (LINKS_MERCADOS[o.mercado] || '');
                    const marcaEfetiva = o.marca || prod.brand || '';
                    if (existentesAtivos.has(id)) { ultimoPreco[chave] = o.preco; continue; }
                    if (ultimoPreco[chave] === o.preco) continue;
                    await CB.saveDoc('price_history', id, {
                        product_id: prod.id,
                        product_name: prod.name,
                        brand: marcaEfetiva,
                        price: o.preco,
                        date: o.data,
                        validade: o.validade || '',
                        link: linkEfetivo,
                        source: o.mercado,
                        from_site: true,
                        expired: false,
                        is_demo: false
                    });
                    existentesAtivos.add(id);
                    ultimoPreco[chave] = o.preco;
                    gravados++;
                }
                setOfertas(prev => mesclar ? [...prev.filter(p => ehOfertaVigente(p) && !mercadosCarregados.has(normalizar(p.mercado))), ...lista] : lista);
                return { total: lista.length, gravados };
            };

            useEffect(() => {
                return CB.subscribeCollection('settings', (docs) => {
                    const d = docs.find(x => x.id === 'ofertas');
                    const url = (d && d.csv_url) || '';
                    setCsvUrl(url);
                    setDesativadoManual(!!(d && d.desativado));
                    setUrlInput(prev => prev || url);
                }, (e) => console.error(e));
            }, []);

            const urlPadraoRepo = (typeof window !== 'undefined' && /^https?:$/i.test(window.location.protocol)) ? './dados/ofertas.csv' : '';
            const urlEfetiva = desativadoManual ? '' : (csvUrl || urlPadraoRepo);

            useEffect(() => {
                if (!urlEfetiva) { setStatus('inativo'); return; }
                let cancelado = false;
                const buscar = async () => {
                    setStatus('lendo');
                    try {
                        const res = await fetch(urlEfetiva + (urlEfetiva.includes('?') ? '&' : '?') + '_=' + Date.now());
                        if (!csvUrl && res.status === 404) {
                            if (!cancelado) { setErro(''); setStatus('inativo'); }
                            return;
                        }
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const texto = await res.text();
                        if (/^\s*<(!doctype|html)/i.test(texto)) throw new Error('A resposta não é um CSV.');
                        if (cancelado) return;
                        await processar(texto, false);
                        if (cancelado) return;
                        setErro(''); setStatus('ok'); setUltimaLeitura(new Date());
                    } catch (e) {
                        if (cancelado) return;
                        console.error(e);
                        setErro(e.message || 'Falha ao ler encartes.');
                        setStatus('erro');
                    }
                };
                buscar();
                const t = setInterval(buscar, MONITOR_INTERVALO_MS);
                return () => { cancelado = true; clearInterval(t); };
            }, [urlEfetiva, csvUrl]);

            const atuais = useMemo(() => {
                const mapa = {};
                ofertas.filter(ehOfertaVigente).forEach(o => {
                    const k = `${normalizar(o.mercado)}|${normalizar(o.produto)}`;
                    if (!mapa[k] || o.data >= mapa[k].data) mapa[k] = o;
                });
                return Object.values(mapa).map(o => {
                    const prod = resolverProdutoOferta(o, produtos);
                    let vsMedia = null;
                    if (prod) {
                        const ps = historicoPrecos.filter(h => h.product_id === prod.id && !h.expired).map(h => Number(h.price)).filter(v => v > 0);
                        if (ps.length > 1) {
                            const media = ps.reduce((a, b) => a + b, 0) / ps.length;
                            vsMedia = ((media - o.preco) / media) * 100;
                        }
                    }
                    const marca = o.marca || (prod && prod.brand) || '';
                    const link = /^https?:\/\//i.test(o.link || '') ? o.link : (LINKS_MERCADOS[o.mercado] || '');
                    return { ...o, prod, vsMedia, marca, link };
                });
            }, [ofertas, produtos, historicoPrecos]);

            useEffect(() => {
                if (onOfertasAtualizadas) onOfertasAtualizadas(atuais);
            }, [atuais, onOfertasAtualizadas]);

            if (!visivel) return null;

            const salvarUrl = () => executar(async () => {
                const u = urlInput.trim();
                await CB.saveDoc('settings', 'ofertas', { csv_url: u, desativado: false });
                setDesativadoManual(false);
                mostrarToast('Link de encarte atualizado.');
            });

            const mercados = [...new Set(atuais.map(o => o.mercado))].sort();
            const t = normalizar(busca);
            const filtradas = atuais
                .filter(o => (filtroMercado === 'Todos' || o.mercado === filtroMercado)
                    && (!soMeus || o.prod)
                    && (!t || normalizar(o.produto + ' ' + (o.marca || '')).includes(t)));

            return (
                <div className="space-y-5">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                        <div className="flex justify-between items-start">
                            <div>
                                <h2 className="text-base font-bold text-slate-900">Encartes & Planilhas de Ofertas</h2>
                                <p className="text-xs text-slate-500">Monitoramento automático dos dados dos supermercados.</p>
                            </div>
                            <span className="text-[10px] font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-600">
                                {status === 'ok' ? 'Ativo' : status}
                            </span>
                        </div>
                        <div className="flex gap-2">
                            <input type="url" placeholder="URL do CSV de ofertas..." value={urlInput} onChange={e => setUrlInput(e.target.value)} className="flex-1 border rounded-xl px-3 py-1.5 text-xs" />
                            <button onClick={salvarUrl} className="bg-slate-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold">Salvar</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {filtradas.map(o => (
                            <div key={`${o.mercado}|${o.produto}`} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col justify-between">
                                <div>
                                    <span className="text-[10px] text-slate-400">{o.mercado}</span>
                                    <h4 className="text-xs sm:text-sm font-semibold text-slate-900 mt-0.5">{o.produto}</h4>
                                    {o.marca && <p className="text-[10px] text-slate-400">Marca: {o.marca}</p>}
                                </div>
                                <div className="flex justify-between items-center mt-3 pt-2 border-t border-slate-100">
                                    <span className="text-sm font-bold text-slate-900">R$ {dinheiro(o.preco)}</span>
                                    {o.link && (
                                        <a href={o.link} target="_blank" rel="noopener noreferrer" className="text-[11px] text-slate-600 hover:text-slate-900 font-medium">Ver fonte</a>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function CardapioRUView({ executar, mostrarToast }) {
            const [config, setConfig] = useState({
                unidade: 'Colemar Natal e Silva',
                titulo: '',

                fonte_pagina_url: 'https://ru-ufg.web.ufg.br/tabs/cardapio',

        function ModalBaixaChat({ produtosComEstoque, onClose, mostrarToast, executar }) {
            const [texto, setTexto] = useState('');

                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl space-y-3 border border-slate-200">
                        <div className="flex justify-between items-center">
                            <h3 className="text-sm font-bold text-slate-900">Baixa Rápida de Consumo</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-4 h-4" /></button>
                        </div>
                        <textarea
                            value={texto}
                            onChange={e => setTexto(e.target.value)}
                            rows={3}
                            placeholder="Descreva o consumo: ex. 'gastei 2 ovos e 1 caixa de leite'..."
                            className="w-full border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:ring-1 focus:ring-slate-900"
                        />
                        <button
                            onClick={() => { mostrarToast('Processando comando...'); onClose(); }}
                            className="w-full bg-slate-900 text-white py-2 rounded-xl text-xs font-semibold"
                        >
                            Confirmar Baixa
                        </button>
                    </div>
                </div>
            );
        }

        function ReceitasView({ produtosComEstoque, receitasPessoais, listaCompras, executar, mostrarToast }) {
            return (
                <div className="space-y-5">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <h2 className="text-base font-bold text-slate-900">Receitas & Sugestões</h2>
                        <p className="text-xs text-slate-500">Pratos combinados com os ingredientes disponíveis no estoque.</p>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
