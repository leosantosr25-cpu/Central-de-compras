        function ListaComprasView({ listaCompras, produtos, historicoPrecos, itensAbaixoMinimo, onComprar, onComparar, executar, mostrarToast }) {
            const [novoItem, setNovoItem] = useState('');
            const [novoPrecoPadrao, setNovoPrecoPadrao] = useState('');

            const obterPrecoSugerido = (l) => {
                if (Number(l.default_price) > 0) return Number(l.default_price);
                const prod = l.product_id ? produtos.find(p => p.id === l.product_id) : acharProdutoDaOferta(l.product_name, produtos);
                if (prod && Number(prod.default_price) > 0) return Number(prod.default_price);
                if (prod) {
                    const h = historicoPrecos.find(x => x.product_id === prod.id && Number(x.price) > 0);
                    if (h) return Number(h.price);
                }
                return 0;
            };

            const adicionarManual = (e) => {
                e.preventDefault();
                if (!novoItem.trim()) return;
                const prod = acharProdutoDaOferta(novoItem.trim(), produtos);
                const pInformado = Number(novoPrecoPadrao) || (prod && Number(prod.default_price)) || 0;
                executar(async () => {
                    await CB.saveDoc('shopping_list', `item_${Date.now()}`, {
                        product_id: prod ? prod.id : '',
                        product_name: novoItem.trim(),
                        unit: prod ? prod.unit : 'unidade',
                        quantity: 1,
                        default_price: pInformado,
                        purchased: false
                    });
                    setNovoItem('');
                    setNovoPrecoPadrao('');
                    mostrarToast('Item adicionado à lista!');
                });
            };

            const adicionarTodosCriticos = () => executar(async () => {
                let n = 0;
                for (const p of itensAbaixoMinimo) {
                    if (listaCompras.some(l => !l.purchased && l.product_id === p.id)) continue;
                    const qtd = Math.max(Number(p.default_quantity || 1), Number(p.minimum_stock || 1) - p.stockTotal);
                    const h = historicoPrecos.find(x => x.product_id === p.id && Number(x.price) > 0);
                    const precoBase = Number(p.default_price) > 0 ? Number(p.default_price) : (h ? Number(h.price) : 0);
                    await CB.saveDoc('shopping_list', `auto_${p.id}`, {
                        product_id: p.id, product_name: p.name, unit: p.unit,
                        quantity: qtd > 0 ? qtd : 1, default_price: precoBase, purchased: false
                    });
                    n++;
                }
                mostrarToast(n > 0 ? `${n} item(ns) adicionado(s) à lista!` : 'Todos já estão na lista.');
            });

            const removerComprados = () => executar(async () => {
                for (const l of listaCompras.filter(x => x.purchased)) await CB.removeDoc('shopping_list', l.id);
                mostrarToast('Itens comprados removidos.');
            });

            const atualizarCampoLista = (l, campos) => executar(async () => {
                await CB.saveDoc('shopping_list', l.id, campos);
                if (l.product_id && campos.default_price !== undefined) {
                    await CB.saveDoc('products', l.product_id, { default_price: Number(campos.default_price) || 0 });
                }
            });

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h2 className="text-lg font-bold text-slate-800">📝 Lista de compras</h2>
                            <p className="text-xs text-slate-500">Defina quantidades e preços padrões para calcular onde compensa comprar.</p>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={onComparar} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow flex items-center space-x-1.5">
                                <Icon name="scale" className="w-4 h-4" />
                                <span>Onde compensa mais</span>
                            </button>
                            <button onClick={onComprar} className="bg-violet-700 hover:bg-violet-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">Registrar compra</button>
                        </div>
                    </div>

                    <form onSubmit={adicionarManual} className="flex flex-col sm:flex-row gap-2">
                        <input type="text" placeholder="Adicionar item (ex: arroz 5kg, sabão em pó)..." value={novoItem} onChange={e => setNovoItem(e.target.value)} className="flex-1 bg-white border rounded-2xl px-4 py-3 text-xs shadow-sm" />
                        <input type="number" step="0.01" min="0" placeholder="Preço padrão R$" value={novoPrecoPadrao} onChange={e => setNovoPrecoPadrao(e.target.value)} className="w-full sm:w-40 bg-white border rounded-2xl px-4 py-3 text-xs shadow-sm" />
                        <button type="submit" className="bg-violet-700 text-white px-5 py-3 rounded-2xl text-xs font-bold">Adicionar</button>
                    </form>

                    {itensAbaixoMinimo.length > 0 && (
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-amber-200 space-y-3">
                            <div className="flex flex-wrap justify-between items-center gap-2">
                                <h3 className="text-sm font-bold text-slate-800">Recomendações do estoque ({itensAbaixoMinimo.length})</h3>
                                <button onClick={adicionarTodosCriticos} className="text-xs bg-amber-100 text-amber-900 font-bold px-3 py-1.5 rounded-xl hover:bg-amber-200">Adicionar todos à lista</button>
                            </div>
                            {itensAbaixoMinimo.map(p => (
                                <div key={p.id} className="flex justify-between items-center p-3 rounded-2xl bg-amber-50/50 border border-amber-100 text-xs">
                                    <div>
                                        <p className="font-bold text-slate-800">{p.name}</p>
                                        <p className="text-[10px] text-slate-500">Restam: {p.stockTotal} {p.unit} (mín: {p.minimum_stock})</p>
                                    </div>
                                    <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${p.stockTotal <= 0 ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-800'}`}>
                                        {p.stockTotal <= 0 ? '🔴 Acabou' : '🟡 Acabando'}
                                    </span>
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-2.5">
                        <div className="flex justify-between items-center mb-1">
                            <h3 className="text-sm font-bold text-slate-800">Minha lista ({listaCompras.length})</h3>
                            {listaCompras.some(l => l.purchased) && <button onClick={removerComprados} className="text-xs text-rose-600 font-bold hover:underline">Limpar comprados</button>}
                        </div>
                        {listaCompras.map(l => {
                            const precoPad = obterPrecoSugerido(l);
                            return (
                                <div key={l.id} className={`flex flex-wrap sm:flex-nowrap justify-between items-center gap-2 p-3.5 rounded-2xl border ${l.purchased ? 'bg-slate-100 opacity-60' : 'bg-slate-50'}`}>
                                    <label className="flex items-center space-x-3 cursor-pointer flex-1 min-w-[180px]">
                                        <input type="checkbox" checked={Boolean(l.purchased)} onChange={() => executar(() => CB.saveDoc('shopping_list', l.id, { purchased: !l.purchased }))} className="w-4 h-4 accent-violet-700 rounded" />
                                        <div>
                                            <span className={`text-xs font-bold text-slate-800 ${l.purchased ? 'line-through' : ''}`}>
                                                {l.product_name}
                                            </span>
                                            {l.unit && <span className="text-[10px] text-slate-400 ml-1.5">({l.unit})</span>}
                                        </div>
                                    </label>
                                    {!l.purchased && (
                                        <div className="flex items-center gap-2">
                                            <div className="flex items-center gap-1 bg-white border rounded-xl px-2 py-1">
                                                <span className="text-[10px] text-slate-400">Qtd:</span>
                                                <input
                                                    type="number"
                                                    step="0.5"
                                                    min="0.1"
                                                    defaultValue={l.quantity || 1}
                                                    onBlur={e => {
                                                        const v = Number(e.target.value);
                                                        if (v > 0 && v !== Number(l.quantity)) atualizarCampoLista(l, { quantity: v });
                                                    }}
                                                    className="w-12 text-xs font-bold text-slate-700 focus:outline-none"
                                                />
                                            </div>
                                            <div className="flex items-center gap-1 bg-white border rounded-xl px-2 py-1" title="Preço padrão usado quando o item não está em oferta">
                                                <span className="text-[10px] text-slate-400">Padrão R$</span>
                                                <input
                                                    type="number"
                                                    step="0.01"
                                                    min="0"
                                                    defaultValue={precoPad > 0 ? precoPad.toFixed(2) : ''}
                                                    placeholder="0.00"
                                                    onBlur={e => {
                                                        const v = Number(e.target.value || 0);
                                                        if (v >= 0 && v !== Number(l.default_price || 0)) atualizarCampoLista(l, { default_price: v });
                                                    }}
                                                    className="w-16 text-xs font-bold text-violet-800 focus:outline-none"
                                                />
                                            </div>
                                        </div>
                                    )}
                                    <button onClick={() => executar(() => CB.removeDoc('shopping_list', l.id))} className="text-rose-600 text-xs font-semibold hover:underline ml-2">Remover</button>
                                </div>
                            );
                        })}
                        {listaCompras.length === 0 && <p className="text-xs text-slate-400 py-4 text-center">Nenhum item na lista ainda.</p>}
                    </div>
                </div>
            );
        }

        function ComparativoMercadosView({ listaCompras, produtos, historicoPrecos, ofertasSiteAtivas, establishments, setAbaAtiva, onUploadNF, executar, mostrarToast }) {
            const [apenasOfertas, setApenasOfertas] = useState(false);
            const [economiaMinDivisao, setEconomiaMinDivisao] = useState(10);
            const [termometrosAbertos, setTermometrosAbertos] = useState({});

            const pendentes = useMemo(() => listaCompras.filter(l => !l.purchased), [listaCompras]);

            const mercados = useMemo(() => {
                const base = establishments.filter(e => e !== 'Outro');
                const setM = new Set(base);
                ofertasSiteAtivas.filter(ehOfertaVigente).forEach(o => { if (o.mercado) setM.add(o.mercado); });
                return Array.from(setM);
            }, [establishments, ofertasSiteAtivas]);

            const calcularTermometro = (prod, precoAtual) => {
                if (!prod || !(precoAtual > 0)) return null;
                const ps = historicoPrecos
                    .filter(h => h.product_id === prod.id && Number(h.price) > 0)
                    .map(h => Number(h.price));
                if (ps.length === 0) return null;
                const min = Math.min(...ps);
                const max = Math.max(...ps);
                const avg = ps.reduce((a, b) => a + b, 0) / ps.length;
                if (precoAtual <= min * 1.02) {
                    return { emoji: '🟢', cls: 'bg-emerald-100 text-emerald-800', label: 'No menor preço histórico', min, avg, max, count: ps.length };
                }
                if (precoAtual <= avg * 1.02) {
                    return { emoji: '🟡', cls: 'bg-amber-100 text-amber-800', label: 'Na média ou abaixo', min, avg, max, count: ps.length };
                }
                return { emoji: '🔴', cls: 'bg-rose-100 text-rose-700', label: 'Acima da média histórica', min, avg, max, count: ps.length };
            };

            const resultado = useMemo(() => {
                if (pendentes.length === 0) return { cards: [], split: null };

                const acharOfertaNoMercado = (itemLista, prod, mercado) => {
                    const mNorm = normalizar(mercado);
                    const candidatas = [];

                    ofertasSiteAtivas.filter(ehOfertaVigente).forEach(o => {
                        if (normalizar(o.mercado) !== mNorm) return;
                        let bateu = false;
                        if (prod && o.id_item_estoque && o.id_item_estoque === prod.id) bateu = true;
                        else if (prod && o.prod && o.prod.id === prod.id) bateu = true;
                        else {
                            const tItem = tokensNome(itemLista.product_name);
                            const setOf = new Set(tokensNome(o.produto));
                            if (tItem.length > 0 && tItem.every(t => setOf.has(t)) && tItem.length / Math.max(setOf.size, 1) >= 0.35) {
                                bateu = true;
                            }
                        }
                        if (bateu && Number(o.preco) > 0) {
                            candidatas.push({
                                preco: Number(o.preco),
                                nomeOferta: o.produto,
                                marca: o.marca || (prod && prod.brand) || '',
                                link: o.link || LINKS_MERCADOS[mercado] || '',
                                data: o.data
                            });
                        }
                    });

                    if (prod) {
                        historicoPrecos
                            .filter(h => h.from_site && ehOfertaVigente(h) && h.product_id === prod.id && normalizar(h.source) === mNorm && Number(h.price) > 0)
                            .forEach(h => {
                                candidatas.push({
                                    preco: Number(h.price),
                                    nomeOferta: h.product_name || prod.name,
                                    marca: h.brand || prod.brand || '',
                                    link: h.link || LINKS_MERCADOS[mercado] || '',
                                    data: h.date
                                });
                            });
                    }

                    if (candidatas.length === 0) return null;
                    candidatas.sort((a, b) => a.preco - b.preco);
                    return candidatas[0];
                };

                // Preço base por mercado: 1) última nota fiscal naquele mercado, 2) média das notas, 3) preço padrão
                const obterPrecoBaseMercado = (itemLista, prod, mercado) => {
                    const mNorm = normalizar(mercado);
                    if (prod) {
                        const notasMercado = historicoPrecos
                            .filter(h => !h.from_site && (h.from_nota || h.purchase_id) && h.product_id === prod.id && normalizar(h.source) === mNorm && Number(h.price) > 0)
                            .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                        if (notasMercado.length > 0) {
                            return { preco: Number(notasMercado[0].price), origem: 'nota_mercado', dataNota: notasMercado[0].date };
                        }
                        const notasGerais = historicoPrecos
                            .filter(h => !h.from_site && h.product_id === prod.id && Number(h.price) > 0)
                            .map(h => Number(h.price));
                        if (notasGerais.length > 0) {
                            const mediaNotas = notasGerais.reduce((a, b) => a + b, 0) / notasGerais.length;
                            return { preco: Number(mediaNotas.toFixed(2)), origem: 'media_notas' };
                        }
                    }
                    if (Number(itemLista.default_price) > 0) return { preco: Number(itemLista.default_price), origem: 'padrao' };
                    if (prod && Number(prod.default_price) > 0) return { preco: Number(prod.default_price), origem: 'padrao' };
                    return { preco: 0, origem: 'sem_preco' };
                };

                // Armazena melhor oferta/preço por item para cenário dividido
                const melhorPorItem = new Map();

                const cards = mercados.map(mercado => {
                    let somaOfertas = 0;
                    let somaBase = 0;
                    let somaReferenciaOfertas = 0;
                    const itensEmOferta = [];
                    const itensPadrao = [];
                    let itensSemPrecoBase = 0;

                    pendentes.forEach(item => {
                        const prod = item.product_id
                            ? produtos.find(p => p.id === item.product_id)
                            : acharProdutoDaOferta(item.product_name, produtos);
                        const qtd = Number(item.quantity || 1) > 0 ? Number(item.quantity) : 1;
                        const baseInfo = obterPrecoBaseMercado(item, prod, mercado);
                        const precoRefLista = Number(item.default_price) > 0 ? Number(item.default_price) : (prod && Number(prod.default_price) > 0 ? Number(prod.default_price) : baseInfo.preco);
                        const oferta = acharOfertaNoMercado(item, prod, mercado);

                        const precoEfetivo = oferta ? oferta.preco : baseInfo.preco;
                        if (precoEfetivo > 0) {
                            const atualBest = melhorPorItem.get(item.id);
                            const sub = precoEfetivo * qtd;
                            if (!atualBest || (!apenasOfertas ? sub < atualBest.subtotal : (oferta && (!atualBest.ehOferta || sub < atualBest.subtotal)))) {
                                if (!apenasOfertas || oferta) {
                                    melhorPorItem.set(item.id, {
                                        itemId: item.id,
                                        nome: oferta ? oferta.nomeOferta : item.product_name,
                                        mercado,
                                        qtd,
                                        precoUnit: precoEfetivo,
                                        subtotal: sub,
                                        ehOferta: !!oferta
                                    });
                                }
                            }
                        }

                        if (oferta) {
                            const subOferta = oferta.preco * qtd;
                            somaOfertas += subOferta;
                            if (precoRefLista > 0) somaReferenciaOfertas += precoRefLista * qtd;
                            const normInfo = calcularPrecoNormalizado(oferta.nomeOferta || item.product_name, oferta.preco, prod && prod.peso_por_unidade, prod && prod.unit);
                            const termometro = calcularTermometro(prod, oferta.preco);
                            itensEmOferta.push({
                                id: item.id,
                                prodId: prod ? prod.id : '',
                                nomeLista: item.product_name,
                                nomeOferta: oferta.nomeOferta,
                                marca: oferta.marca,
                                qtd,
                                precoOferta: oferta.preco,
                                precoBase: precoRefLista,
                                subtotal: subOferta,
                                normInfo,
                                termometro,
                                link: oferta.link
                            });
                        } else {
                            if (baseInfo.preco <= 0) itensSemPrecoBase++;
                            const subBase = baseInfo.preco * qtd;
                            somaBase += subBase;
                            itensPadrao.push({
                                id: item.id,
                                nomeLista: item.product_name,
                                qtd,
                                precoBase: baseInfo.preco,
                                origem: baseInfo.origem,
                                dataNota: baseInfo.dataNota || '',
                                subtotal: subBase
                            });
                        }
                    });

                    const totalEstimado = Number((apenasOfertas ? somaOfertas : (somaOfertas + somaBase)).toFixed(2));
                    const economiaReal = Number(Math.max(0, somaReferenciaOfertas - somaOfertas).toFixed(2));

                    return {
                        mercado,
                        linkMercado: LINKS_MERCADOS[mercado] || '',
                        totalItensLista: pendentes.length,
                        totalEmOferta: itensEmOferta.length,
                        somaOfertas: Number(somaOfertas.toFixed(2)),
                        somaBase: Number(somaBase.toFixed(2)),
                        totalEstimado,
                        economiaReal,
                        itensEmOferta,
                        itensPadrao,
                        itensSemPrecoBase
                    };
                });

                cards.sort((a, b) => {
                    if (apenasOfertas) {
                        if (b.totalEmOferta !== a.totalEmOferta) return b.totalEmOferta - a.totalEmOferta;
                        if (a.somaOfertas > 0 && b.somaOfertas > 0) return a.somaOfertas - b.somaOfertas;
                        return 0;
                    }
                    if (a.totalEstimado > 0 && b.totalEstimado > 0) return a.totalEstimado - b.totalEstimado || b.totalEmOferta - a.totalEmOferta;
                    return b.totalEmOferta - a.totalEmOferta;
                });

                // Cenário compra dividida
                const grupos = {};
                let totalDividido = 0;
                melhorPorItem.forEach(m => {
                    if (!grupos[m.mercado]) grupos[m.mercado] = [];
                    grupos[m.mercado].push(m);
                    totalDividido += m.subtotal;
                });
                const melhorUnicoCard = cards.find(c => c.totalEstimado > 0) || cards[0];
                const melhorUnicoTotal = melhorUnicoCard ? melhorUnicoCard.totalEstimado : 0;
                const economiaDivisao = Number(Math.max(0, melhorUnicoTotal - totalDividido).toFixed(2));

                return {
                    cards,
                    split: {
                        grupos,
                        qtdMercados: Object.keys(grupos).length,
                        totalDividido: Number(totalDividido.toFixed(2)),
                        melhorUnicoTotal,
                        melhorUnicoNome: melhorUnicoCard ? melhorUnicoCard.mercado : '',
                        economiaDivisao
                    }
                };
            }, [pendentes, mercados, produtos, historicoPrecos, ofertasSiteAtivas, apenasOfertas]);

            const vencedor = resultado.cards.find(r => r.totalEstimado > 0 || r.totalEmOferta > 0) || resultado.cards[0];

            const rotuloOrigem = (origem, dataNota) => {
                if (origem === 'nota_mercado') return `🧾 Nota (${dataNota ? dataNota.slice(5) : 'recente'})`;
                if (origem === 'media_notas') return '📊 Média notas';
                if (origem === 'padrao') return '📌 Padrão';
                return '⚠️ Sem preço';
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h2 className="text-lg font-bold text-slate-800">⚖️ Onde compensa mais comprar hoje</h2>
                                <p className="text-xs text-slate-500">Cruza {pendentes.length} item(ns) pendente(s) com ofertas reais + último preço pago em nota fiscal por mercado.</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {onUploadNF && (
                                    <button onClick={onUploadNF} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl shadow flex items-center gap-1.5">
                                        <Icon name="file-text" className="w-3.5 h-3.5" />
                                        <span>Nota Fiscal (Foto/PDF)</span>
                                    </button>
                                )}
                                <button onClick={() => setAbaAtiva('lista')} className="bg-violet-100 hover:bg-violet-200 text-violet-800 text-xs font-bold px-3.5 py-2 rounded-xl">
                                    Editar lista
                                </button>
                            </div>
                        </div>

                        {/* Toggle Apenas Ofertas Reais */}
                        <div className="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100">
                            <button
                                onClick={() => setApenasOfertas(v => !v)}
                                className={`px-3.5 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 border ${apenasOfertas ? 'bg-violet-700 text-white border-violet-700 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}
                            >
                                <Icon name="tag" className="w-3.5 h-3.5" />
                                <span>Apenas Ofertas Reais {apenasOfertas ? '(ATIVO)' : ''}</span>
                            </button>
                            <span className="text-[11px] text-slate-500">
                                {apenasOfertas
                                    ? 'Ignorando itens sem promoção para eliminar distorção de preços base.'
                                    : 'Usando ofertas ativas + último histórico real de nota fiscal por mercado.'}
                            </span>
                        </div>
                    </div>

                    {pendentes.length === 0 ? (
                        <div className="bg-white rounded-3xl p-8 text-center border border-slate-200 space-y-3">
                            <p className="text-sm font-bold text-slate-700">Sua lista de compras está vazia!</p>
                            <p className="text-xs text-slate-500">Adicione itens na aba Lista de Compras para calcular onde sai mais barato comprar.</p>
                            <button onClick={() => setAbaAtiva('lista')} className="bg-violet-700 text-white px-4 py-2 rounded-xl text-xs font-bold">Ir para Lista de Compras</button>
                        </div>
                    ) : (
                        <>
                            {vencedor && (
                                <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white rounded-3xl p-5 shadow-md flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div>
                                        <span className="text-[10px] font-bold uppercase tracking-wider bg-white/20 px-2.5 py-1 rounded-full">
                                            🏆 Melhor opção {apenasOfertas ? '(em ofertas)' : 'hoje'}
                                        </span>
                                        <h3 className="text-xl font-bold mt-2">{vencedor.mercado}</h3>
                                        <p className="text-xs text-emerald-100 mt-0.5">
                                            {vencedor.totalEmOferta} de {vencedor.totalItensLista} itens em oferta real
                                            {vencedor.economiaReal > 0 ? ` • Economia real nas ofertas: R$ ${dinheiro(vencedor.economiaReal)}` : ''}
                                        </p>
                                    </div>
                                    <div className="text-left sm:text-right bg-black/15 px-4 py-3 rounded-2xl">
                                        <p className="text-[11px] text-emerald-100">{apenasOfertas ? 'Total das ofertas' : 'Total estimado'}</p>
                                        <p className="text-2xl font-bold">R$ {dinheiro(vencedor.totalEstimado)}</p>
                                    </div>
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {resultado.cards.map((card, idx) => {
                                    const ehMelhor = idx === 0 && (card.totalEstimado > 0 || card.totalEmOferta > 0);
                                    const pctOferta = Math.round((card.totalEmOferta / Math.max(card.totalItensLista, 1)) * 100);
                                    return (
                                        <div key={card.mercado} className={`bg-white rounded-3xl p-5 shadow-sm border-2 flex flex-col justify-between space-y-4 ${ehMelhor ? 'border-emerald-500 ring-2 ring-emerald-100' : 'border-slate-200'}`}>
                                            <div className="space-y-3">
                                                <div className="flex justify-between items-start gap-2">
                                                    <div>
                                                        {ehMelhor && <span className="inline-block mb-1 text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full">🏆 Mais Econômico</span>}
                                                        <h3 className="text-base font-bold text-slate-800">{card.mercado}</h3>
                                                    </div>
                                                    {card.linkMercado && (
                                                        <a href={card.linkMercado} target="_blank" rel="noopener noreferrer" className="text-[11px] text-violet-700 font-bold hover:underline flex items-center gap-1">
                                                            <span>Site</span>
                                                            <Icon name="external-link" className="w-3 h-3" />
                                                        </a>
                                                    )}
                                                </div>

                                                {/* Métricas separadas (a) Qtd em oferta real, (b) Economia real, (c) Total estimado */}
                                                <div className="grid grid-cols-3 gap-2">
                                                    <div className="bg-violet-50/70 border border-violet-100 p-2.5 rounded-2xl">
                                                        <p className="text-[10px] text-slate-500 font-semibold">Em oferta real</p>
                                                        <p className="text-xs sm:text-sm font-bold text-violet-800">{card.totalEmOferta}/{card.totalItensLista} ({pctOferta}%)</p>
                                                    </div>
                                                    <div className="bg-emerald-50/70 border border-emerald-100 p-2.5 rounded-2xl">
                                                        <p className="text-[10px] text-slate-500 font-semibold">Economia ofertas</p>
                                                        <p className="text-xs sm:text-sm font-bold text-emerald-700">R$ {dinheiro(card.economiaReal)}</p>
                                                    </div>
                                                    <div className={`${ehMelhor ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'} border p-2.5 rounded-2xl`}>
                                                        <p className="text-[10px] text-slate-500 font-semibold">{apenasOfertas ? 'Total ofertas' : 'Total estimado'}</p>
                                                        <p className={`text-xs sm:text-sm font-bold ${ehMelhor ? 'text-emerald-800' : 'text-slate-800'}`}>R$ {dinheiro(card.totalEstimado)}</p>
                                                    </div>
                                                </div>

                                                {!apenasOfertas && (
                                                    <div className="text-[11px] text-slate-500 flex flex-wrap gap-x-3 gap-y-1">
                                                        <span>🏷️ Ofertas: <strong>R$ {dinheiro(card.somaOfertas)}</strong></span>
                                                        <span>🧾/📌 Base: <strong>R$ {dinheiro(card.somaBase)}</strong></span>
                                                        {card.itensSemPrecoBase > 0 && (
                                                            <span className="text-amber-700 font-semibold">⚠️ {card.itensSemPrecoBase} sem histórico</span>
                                                        )}
                                                    </div>
                                                )}

                                                <div className="space-y-1.5 pt-2 border-t">
                                                    <p className="text-xs font-bold text-slate-700">Itens em oferta neste mercado ({card.itensEmOferta.length}):</p>
                                                    {card.itensEmOferta.length > 0 ? (
                                                        <div className="space-y-1.5 max-h-56 overflow-y-auto">
                                                            {card.itensEmOferta.map(it => {
                                                                const tid = `${card.mercado}|${it.id}`;
                                                                const termoAberto = !!termometrosAbertos[tid];
                                                                return (
                                                                    <div key={it.id} className="p-2.5 bg-emerald-50/60 border border-emerald-100 rounded-xl text-xs space-y-1">
                                                                        <div className="flex justify-between items-center gap-2">
                                                                            <div className="min-w-0">
                                                                                <p className="font-bold text-slate-800 truncate">{it.qtd}x {it.nomeOferta}</p>
                                                                                <p className="text-[10px] text-slate-500 flex flex-wrap items-center gap-1.5">
                                                                                    <span>Un: R$ {dinheiro(it.precoOferta)}</span>
                                                                                    {it.normInfo && <span className="bg-white border border-emerald-200 text-emerald-800 px-1.5 py-0.5 rounded font-semibold">{it.normInfo.texto}</span>}
                                                                                    {it.marca && <span>• {it.marca}</span>}
                                                                                </p>
                                                                            </div>
                                                                            <div className="text-right shrink-0">
                                                                                <span className="font-bold text-emerald-700 block">R$ {dinheiro(it.subtotal)}</span>
                                                                                <div className="flex items-center justify-end gap-1.5">
                                                                                    {it.termometro && (
                                                                                        <button
                                                                                            type="button"
                                                                                            onClick={() => setTermometrosAbertos(prev => ({ ...prev, [tid]: !prev[tid] }))}
                                                                                            className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${it.termometro.cls}`}
                                                                                            title="Ver termômetro de preço histórico"
                                                                                        >
                                                                                            {it.termometro.emoji} Termômetro
                                                                                        </button>
                                                                                    )}
                                                                                    {it.link && (
                                                                                        <a href={it.link} target="_blank" rel="noopener noreferrer" className="text-[10px] text-violet-700 font-bold hover:underline">Fonte ↗</a>
                                                                                    )}
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                        {termoAberto && it.termometro && (
                                                                            <div className="bg-white border border-slate-200 rounded-lg px-2.5 py-1.5 text-[10px] text-slate-600 flex flex-wrap justify-between gap-2">
                                                                                <span className="font-bold">{it.termometro.emoji} {it.termometro.label}</span>
                                                                                <span>Mín: R$ {dinheiro(it.termometro.min)} • Méd: R$ {dinheiro(it.termometro.avg)} • Máx: R$ {dinheiro(it.termometro.max)} ({it.termometro.count} reg.)</span>
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    ) : (
                                                        <p className="text-[11px] text-slate-400 italic">Nenhum item da sua lista em oferta aqui hoje.</p>
                                                    )}
                                                </div>

                                                {!apenasOfertas && card.itensPadrao.length > 0 && (
                                                    <details className="text-xs">
                                                        <summary className="cursor-pointer text-[11px] font-bold text-slate-500 hover:text-violet-700">
                                                            Ver {card.itensPadrao.length} item(ns) sem oferta ativa (base nota/padrão)
                                                        </summary>
                                                        <div className="space-y-1 mt-2 max-h-36 overflow-y-auto">
                                                            {card.itensPadrao.map(it => (
                                                                <div key={it.id} className="flex justify-between items-center px-2.5 py-1.5 bg-slate-50 rounded-lg text-[11px] gap-2">
                                                                    <span className="text-slate-700 truncate flex-1">{it.qtd}x {it.nomeLista}</span>
                                                                    <span className="text-[10px] text-slate-400 shrink-0">{rotuloOrigem(it.origem, it.dataNota)}</span>
                                                                    <span className={`font-semibold shrink-0 ${it.precoBase > 0 ? 'text-slate-700' : 'text-amber-600'}`}>
                                                                        {it.precoBase > 0 ? `R$ ${dinheiro(it.subtotal)}` : 'Sem preço'}
                                                                    </span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </details>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Cenário Mercado Único vs. Compra Dividida (Recolhível) */}
                            {resultado.split && (
                                <details className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                                    <summary className="cursor-pointer flex flex-wrap items-center justify-between gap-2 text-sm font-bold text-slate-800">
                                        <span>🛣️ Cenário: Mercado Único vs. Compra Dividida</span>
                                        {resultado.split.economiaDivisao >= economiaMinDivisao && resultado.split.qtdMercados > 1 ? (
                                            <span className="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full">
                                                Compensa dividir! Economia de R$ {dinheiro(resultado.split.economiaDivisao)}
                                            </span>
                                        ) : (
                                            <span className="text-xs bg-slate-100 text-slate-600 px-3 py-1 rounded-full">
                                                Melhor ficar em mercado único
                                            </span>
                                        )}
                                    </summary>

                                    <div className="mt-4 pt-4 border-t border-slate-100 space-y-4">
                                        <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-50 p-3 rounded-2xl text-xs">
                                            <div className="space-y-0.5">
                                                <p className="font-bold text-slate-700">
                                                    Mercado único ({resultado.split.melhorUnicoNome}): R$ {dinheiro(resultado.split.melhorUnicoTotal)} • Dividida: R$ {dinheiro(resultado.split.totalDividido)}
                                                </p>
                                                <p className="text-[11px] text-slate-500">
                                                    {resultado.split.economiaDivisao >= economiaMinDivisao && resultado.split.qtdMercados > 1
                                                        ? `Rota otimizada gera R$ ${dinheiro(resultado.split.economiaDivisao)} de economia extra (acima do seu mínimo de R$ ${dinheiro(economiaMinDivisao)}).`
                                                        : `Economia de R$ ${dinheiro(resultado.split.economiaDivisao)} está abaixo do seu filtro mínimo (R$ ${dinheiro(economiaMinDivisao)}) para deslocamento.`}
                                                </p>
                                            </div>
                                            <label className="flex items-center gap-2 text-[11px] font-bold text-slate-600">
                                                <span>Economia mín. R$:</span>
                                                <input
                                                    type="number"
                                                    min="0"
                                                    step="1"
                                                    value={economiaMinDivisao}
                                                    onChange={e => setEconomiaMinDivisao(Math.max(0, Number(e.target.value) || 0))}
                                                    className="w-16 border rounded-xl px-2 py-1 text-center bg-white"
                                                />
                                            </label>
                                        </div>

                                        {resultado.split.qtdMercados > 0 && (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                {Object.entries(resultado.split.grupos).map(([merc, lista]) => (
                                                    <div key={merc} className="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-1.5">
                                                        <p className="text-xs font-bold text-violet-800">🛒 {merc} ({lista.length} item(ns))</p>
                                                        {lista.map(it => (
                                                            <div key={it.itemId} className="flex justify-between text-[11px] text-slate-600">
                                                                <span className="truncate">{it.qtd}x {it.nome} {it.ehOferta ? '🏷️' : ''}</span>
                                                                <span className="font-semibold text-slate-800 ml-2">R$ {dinheiro(it.subtotal)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </details>
                            )}
                        </>
                    )}
                </div>
            );
        }

        function OfertasView({ ofertas, ofertasSiteAtivas, produtos, onFotoAmpliada }) {
            const [mercadoFiltro, setMercadoFiltro] = useState('Todos');
            const [origemFiltro, setOrigemFiltro] = useState('todas');

            const todasOfertas = useMemo(() => {
                const mapa = new Map();

                ofertas.forEach(o => {
                    const key = `${normalizar(o.estabelecimento)}|${normalizar(o.name)}`;
                    mapa.set(key, {
                        key,
                        tipo: 'proprio',
                        nome: o.name,
                        marca: o.brand || '',
                        estabelecimento: o.estabelecimento,
                        precoAtual: o.precoAtual,
                        media: o.media,
                        desconto: o.desconto,
                        economia: o.economia,
                        data: o.dataPreco,
                        image_url: o.image_url,
                        link: o.link || LINKS_MERCADOS[o.estabelecimento] || ''
                    });
                });

                ofertasSiteAtivas.filter(ehOfertaVigente).forEach(o => {
                    const nomeRef = o.prod ? o.prod.name : o.produto;
                    const key = `${normalizar(o.mercado)}|${normalizar(nomeRef)}`;
                    if (mapa.has(key)) {
                        const existente = mapa.get(key);
                        if (!existente.marca && (o.marca || (o.prod && o.prod.brand))) {
                            existente.marca = o.marca || (o.prod && o.prod.brand) || '';
                        }
                        if (!existente.link && o.link) existente.link = o.link;
                        return;
                    }
                    mapa.set(key, {
                        key,
                        tipo: o.prod ? 'proprio' : 'site',
                        nome: o.produto,
                        marca: o.marca || (o.prod && o.prod.brand) || '',
                        estabelecimento: o.mercado,
                        precoAtual: o.preco,
                        media: null,
                        desconto: o.vsMedia && o.vsMedia > 0 ? o.vsMedia : null,
                        economia: null,
                        data: o.data,
                        image_url: o.prod ? o.prod.image_url : '',
                        link: o.link || LINKS_MERCADOS[o.mercado] || ''
                    });
                });

                return Array.from(mapa.values()).sort((a, b) => (b.desconto || 0) - (a.desconto || 0) || (b.data || '').localeCompare(a.data || ''));
            }, [ofertas, ofertasSiteAtivas]);

            const mercadosDisponiveis = useMemo(() => {
                const base = INITIAL_ESTABLISHMENTS.filter(m => m !== 'Outro');
                const setM = new Set(base);
                todasOfertas.forEach(o => { if (o.estabelecimento) setM.add(o.estabelecimento); });
                return Array.from(setM);
            }, [todasOfertas]);

            const filtradas = todasOfertas.filter(o =>
                (mercadoFiltro === 'Todos' || o.estabelecimento === mercadoFiltro) &&
                (origemFiltro === 'todas' || o.tipo === 'proprio')
            );

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                                <h2 className="text-lg font-bold text-slate-800">🏷️ Ofertas vigentes</h2>
                                <p className="text-xs text-slate-500">Apenas promoções ativas e não expiradas dos mercados e dos seus produtos.</p>
                            </div>
                            <div className="flex gap-1.5">
                                <button onClick={() => setOrigemFiltro('todas')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${origemFiltro === 'todas' ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>Todas ({todasOfertas.length})</button>
                                <button onClick={() => setOrigemFiltro('proprio')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${origemFiltro === 'proprio' ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>Só meus produtos</button>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                            <button onClick={() => setMercadoFiltro('Todos')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${mercadoFiltro === 'Todos' ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>Todos</button>
                            {mercadosDisponiveis.map(m => (
                                <button key={m} onClick={() => setMercadoFiltro(m)} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${mercadoFiltro === m ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>{m.replace('Supermercado ', '')}</button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filtradas.map(o => {
                            const tag = o.desconto >= 20 ? '🔥 GRANDE OPORTUNIDADE' : o.desconto >= 10 ? '✨ ÓTIMA OFERTA' : '🏷️ OFERTA ATIVA';
                            return (
                                <div key={o.key} className="rounded-3xl p-5 shadow-sm border border-fuchsia-200 bg-gradient-to-br from-white to-fuchsia-50/40 flex flex-col justify-between">
                                    <div>
                                        <div className="flex justify-between items-start gap-2 mb-2">
                                            <span className="text-[10px] font-bold bg-fuchsia-100 text-fuchsia-800 px-2.5 py-0.5 rounded-full">{tag}</span>
                                            {o.desconto !== null && <span className="text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded-full">-{o.desconto.toFixed(1)}%</span>}
                                        </div>
                                        <div className="flex items-center space-x-3 my-2">
                                            {o.image_url && <img onClick={() => onFotoAmpliada({ url: o.image_url, nome: o.nome })} src={o.image_url} alt="" className="w-11 h-11 rounded-xl object-cover border cursor-pointer" />}
                                            <div className="min-w-0">
                                                <h4 className="text-sm font-bold text-slate-800">{o.nome}</h4>
                                                <div className="flex flex-wrap items-center gap-1.5 mt-1">
                                                    <span className="text-[11px] font-semibold text-violet-700">{o.estabelecimento}</span>
                                                    {o.marca && (
                                                        <span className="text-[10px] font-bold bg-violet-100 text-violet-800 px-2 py-0.5 rounded-full">
                                                            Marca: {o.marca}
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-3 rounded-2xl mt-3 border grid grid-cols-2 gap-2 text-center">
                                            <div>
                                                <p className="text-[10px] text-slate-400">{o.media ? 'Média histórica' : 'Data do encarte'}</p>
                                                <p className={`text-xs font-semibold ${o.media ? 'line-through text-slate-500' : 'text-slate-600'}`}>
                                                    {o.media ? `R$ ${dinheiro(o.media)}` : (o.data || 'Recente')}

                                            <div>
                                                <p className="text-[10px] text-slate-400">Preço atual</p>
                                                <p className="text-sm font-bold text-violet-800">R$ {dinheiro(o.precoAtual)}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="mt-3 pt-2.5 border-t border-fuchsia-100 flex items-center justify-between gap-2">
                                        {o.economia > 0 ? (
                                            <p className="text-[10px] text-emerald-700 font-bold">Economia: R$ {dinheiro(o.economia)}</p>

                    </div>
                    {filtradas.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhuma oferta vigente encontrada neste filtro.</p>}
                </div>
