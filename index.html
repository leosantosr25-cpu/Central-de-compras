                        CB.saveDoc('settings', 'ia', { gemini_key: apiKey });
                    } else {
                        return;
                    }
                }

                setLendoNota(true);
                try {
                    const promptTexto = "Você lê cupons e notas fiscais de supermercados do Brasil. " +
                        "Uma compra pode estar dividida em várias fotos (partes da mesma nota fiscal ou foto dos produtos); " +
                        "unifique tudo sem duplicar itens de sobreposição entre fotos. " +
                        "Extraia o nome do supermercado, a data da compra (AAAA-MM-DD) e a lista de produtos com marca (se visível), quantidade e preço unitário. " +
                        "Responda ESTRITAMENTE em formato JSON: " +
                        '{"supermercado": "Nome do mercado", "data": "AAAA-MM-DD", "itens": [{"produto": "Nome legivel do item", "marca": "", "quantidade": 1, "preco_unitario": 10.50}]}. ' +
                        "Se não encontrar supermercado, data ou marca, use strings vazias. Não invente produtos.";

                    const partes = [{ text: promptTexto }];
                    fotosCompra.forEach(f => {
                        if (f.ocrB64) partes.push({ inline_data: { mime_type: "image/jpeg", data: f.ocrB64 } });
                    });

                    const corpoReq = {
                        contents: [{ parts: partes }],
                        generationConfig: {
                            temperature: 0,
                            responseMimeType: "application/json"
                        }
                    };

                    let resJson = null;
                    const modelos = ['gemini-3.8-flash', 'gemini-3.5-flash-lite'];
                    for (const mod of modelos) {
                        try {
                            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${mod}:generateContent?key=${apiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(corpoReq)
                            });
                            if (!res.ok) throw new Error('HTTP ' + res.status);
                            const jsonDados = await res.json();
                            const textoIA = jsonDados.candidates[0].content.parts[0].text;
                            resJson = JSON.parse(textoIA);
                            break;
                        } catch (err) {
                            console.warn(`Falha no modelo ${mod}`, err);
                        }
                    }

                    if (!resJson || !Array.isArray(resJson.itens) || resJson.itens.length === 0) {
                        throw new Error('A IA não conseguiu identificar os itens nas fotos. Tente fotos mais nítidas.');
                    }

                    if (resJson.supermercado) {
                        const achado = establishments.find(e => normalizar(e).includes(normalizar(resJson.supermercado)) || normalizar(resJson.supermercado).includes(normalizar(e)));
                        if (achado && achado !== 'Outro') {
                            setEstablishment(achado);
                            setCustomEstablishment('');
                        } else {
                            setEstablishment('Outro');
                            setCustomEstablishment(resJson.supermercado);
                        }
                    }

                    if (resJson.data && /^\d{4}-\d{2}-\d{2}$/.test(resJson.data)) {
                        setPurchaseDate(resJson.data);
                    }

                    const novosItensForm = [];
                    for (const it of resJson.itens) {
                        const nomeLimpo = (it.produto || '').trim();
                        const marcaLimpa = (it.marca || '').trim();
                        const precoUn = Number(it.preco_unitario || 0);
                        const qtd = Number(it.quantidade || 1);
                        if (!nomeLimpo || precoUn <= 0) continue;

                        let prodEncontrado = produtos.find(p => normalizar(p.name) === normalizar(nomeLimpo));
                        if (!prodEncontrado) {
                            prodEncontrado = produtos.find(p => normalizar(p.name).includes(normalizar(nomeLimpo)) || normalizar(nomeLimpo).includes(normalizar(p.name)));
                        }

                        let pId = prodEncontrado ? prodEncontrado.id : null;
                        if (!pId) {
                            pId = `prod_${Date.now()}_${Math.random().toString(36).substring(2, 6)}`;
                            await CB.saveDoc('products', pId, {
                                name: nomeLimpo, category: 'Outros', brand: marcaLimpa, unit: 'unidade',
                                default_quantity: 1, minimum_stock: 1, default_price: precoUn,
                                local_estoque: 'Itens no armário', image_url: '', notes: 'Cadastrado via Cupom Fiscal', is_demo: false
                            });
                        }

                        novosItensForm.push({
                            productId: pId,
                            quantity: qtd > 0 ? qtd : 1,
                            unitPrice: precoUn,
                            expirationDate: ''
                        });
                    }

                    if (novosItensForm.length > 0) {
                        setItens(novosItensForm);
                        mostrarToast(`${novosItensForm.length} produto(s) extraído(s) de ${fotosCompra.length} foto(s)!`);
                    } else {
                        mostrarToast('Nenhum item com preço legível foi encontrado.', 'erro');
                    }
                } catch (err) {
                    console.error(err);
                    mostrarToast(err.message || 'Erro ao processar fotos com a IA.', 'erro');
                } finally {
                    setLendoNota(false);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                const validos = itens.filter(i => i.productId && Number(i.quantity) > 0);
                if (validos.length === 0) { mostrarToast('Escolha pelo menos um produto.', 'erro'); return; }

                const nomeFinalMercado = (establishment === 'Outro' && customEstablishment.trim()) ? customEstablishment.trim() : establishment;

                setSalvando(true);
                try {
                    const compraId = editando ? compraParaEditar.id : `comp_${Date.now()}`;

                    if (editando) {
                        for (const l of lotesValidade.filter(x => x.purchase_id === compraId)) {
                            await CB.removeDoc('product_expiration', l.id);
                        }
                        for (const h of historicoPrecos.filter(x => x.purchase_id === compraId)) {
                            await CB.removeDoc('price_history', h.id);
                        }
                    }

                    const itensFormatados = validos.map(item => {
                        const prodObj = produtos.find(p => p.id === item.productId);
                        return {
                            product_id: item.productId,
                            product_name: prodObj ? prodObj.name : 'Produto',
                            quantity: Number(item.quantity),
                            unit_price: Number(item.unitPrice) || 0,
                            total_price: Number((Number(item.quantity) * (Number(item.unitPrice) || 0)).toFixed(2)),
                            expiration_date: item.expirationDate || ''
                        };
                    });
                    const total = Number(itensFormatados.reduce((a, i) => a + i.total_price, 0).toFixed(2));
                    const fotosParaSalvar = fotosCompra.map(f => f.previewUrl).filter(Boolean);

                    await CB.saveDoc('purchases', compraId, {
                        purchase_date: purchaseDate,
                        total,
                        notes: nomeFinalMercado,
                        purchase_items: itensFormatados,
                        photos: fotosParaSalvar,
                        is_demo: false
                    });

                    for (let idx = 0; idx < itensFormatados.length; idx++) {
                        const it = itensFormatados[idx];
                        const prodObj = produtos.find(p => p.id === it.product_id);
                        await CB.saveDoc('product_expiration', `lote_${compraId}_${idx}`, {
                            product_id: it.product_id, quantity: it.quantity, expiration_date: it.expiration_date,
                            local_estoque: obterLocalEstoque(prodObj, null),
                            purchase_id: compraId, is_demo: false
                        });
                        if (it.unit_price > 0) {
                            await CB.saveDoc('price_history', `ph_${compraId}_${idx}`, {
                                product_id: it.product_id, product_name: it.product_name,
                                brand: (prodObj && prodObj.brand) || '',
                                price: it.unit_price,
                                date: purchaseDate, source: nomeFinalMercado, purchase_id: compraId, is_demo: false
                            });
                        }
                    }

                    const idsComprados = new Set(itensFormatados.map(i => i.product_id));
                    for (const l of listaCompras.filter(x => !x.purchased && x.product_id && idsComprados.has(x.product_id))) {
                        await CB.saveDoc('shopping_list', l.id, { purchased: true });
                    }

                    onSalvo();
                } catch (err) {
                    console.error(err);
                    mostrarToast('Erro ao salvar a compra.', 'erro');
                } finally {
                    setSalvando(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl my-8 space-y-4">
                        <div className="flex flex-wrap justify-between items-center gap-2">
                            <h3 className="text-base font-bold text-slate-800">
                                {editando ? '✏️ Editar compra finalizada' : '🛒 Registrar nova compra'}
                            </h3>
                            <div className="flex gap-2">
                                <button type="button" onClick={onCatalogo} className="text-xs bg-violet-100 text-violet-800 font-bold px-3 py-1.5 rounded-xl">📋 Catálogo</button>
                                <button type="button" onClick={onNovoProduto} className="text-xs bg-violet-100 text-violet-800 font-bold px-3 py-1.5 rounded-xl">+ Produto</button>
                            </div>
                        </div>

                        {/* Banner de Leitura de Cupom Fiscal com IA (Múltiplas Fotos + Galeria) */}
                        <div className="bg-gradient-to-r from-violet-700 via-purple-700 to-indigo-800 text-white p-4 rounded-2xl space-y-3 shadow-sm">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                                <div className="flex items-center space-x-2.5">
                                    <span className="text-xl">🧾</span>
                                    <div>
                                        <p className="text-xs font-bold">Adicionar fotos da nota fiscal (câmera ou galeria)</p>
                                        <p className="text-[10px] text-purple-200">Envie 1 ou várias fotos (para notas longas) e a IA extrai tudo</p>
                                    </div>
                                </div>
                                <div className="flex flex-wrap gap-2">
                                    <label className="bg-white text-violet-800 hover:bg-purple-50 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer shadow transition flex items-center space-x-1.5 whitespace-nowrap">
                                        <Icon name="camera" className="w-3.5 h-3.5" />
                                        <span>Câmera</span>
                                        <input type="file" accept="image/*" capture="environment" onChange={adicionarFotosCompra} disabled={lendoNota || preparandoFotos} className="hidden" />
                                    </label>
                                    <label className="bg-violet-950/50 border border-white/30 text-white hover:bg-violet-950/70 text-xs font-bold px-3 py-2 rounded-xl cursor-pointer transition flex items-center space-x-1.5 whitespace-nowrap">
                                        <Icon name="image" className="w-3.5 h-3.5" />
                                        <span>Galeria (várias)</span>
                                        <input type="file" accept="image/*" multiple onChange={adicionarFotosCompra} disabled={lendoNota || preparandoFotos} className="hidden" />
                                    </label>
                                </div>
                            </div>

                            {fotosCompra.length > 0 && (
                                <div className="bg-white/10 rounded-xl p-2.5 space-y-2.5">
                                    <div className="flex flex-wrap gap-2">
                                        {fotosCompra.map((foto, i) => (
                                            <div key={foto.id} className="relative group w-16 h-16 rounded-xl overflow-hidden border border-white/30 bg-black/20">
                                                <img src={foto.previewUrl} alt={`Foto ${i + 1}`} className="w-full h-full object-cover" />
                                                <button
                                                    type="button"
                                                    onClick={() => removerFotoCompra(foto.id)}
                                                    className="absolute top-0.5 right-0.5 bg-rose-600 text-white w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center shadow"
                                                    title="Remover foto"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                    <button
                                        type="button"
                                        onClick={analisarFotosComIA}
                                        disabled={lendoNota || preparandoFotos}
                                        className="w-full bg-amber-400 hover:bg-amber-300 text-slate-900 font-bold text-xs py-2 rounded-xl shadow flex items-center justify-center space-x-1.5 disabled:opacity-50"
                                    >
                                        <Icon name="sparkles" className="w-4 h-4" />
                                        <span>{lendoNota ? 'Analisando fotos com IA...' : `Extrair itens com IA (${fotosCompra.length} foto${fotosCompra.length > 1 ? 's' : ''})`}</span>
                                    </button>
                                </div>
                            )}
                        </div>
                        {(lendoNota || preparandoFotos) && (
                            <p className="text-xs text-violet-700 font-bold animate-pulse text-center">
                                {preparandoFotos ? '⏳ Preparando e otimizando fotos...' : '⏳ Analisando itens e preços das fotos da nota fiscal...'}
                            </p>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Supermercado / local</label>
                                    <select value={establishment} onChange={e => setEstablishment(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs">
                                        {establishments.map(est => <option key={est} value={est}>{est}</option>)}
                                    </select>
                                    {establishment === 'Outro' && (
                                        <input
                                            type="text"
                                            placeholder="Digite o nome do supermercado..."
                                            value={customEstablishment}
                                            onChange={e => setCustomEstablishment(e.target.value)}
                                            className="w-full border border-violet-300 bg-violet-50/50 rounded-xl px-3 py-2 text-xs mt-2 font-semibold text-violet-900"
                                            required
                                        />
                                    )}
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Data da compra</label>
                                    <input type="date" value={purchaseDate} onChange={e => setPurchaseDate(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" required />
                                </div>
                            </div>

                            <div className="border-t pt-3">
                                <div className="flex justify-between items-center mb-2">
                                    <h4 className="text-xs font-bold text-slate-700">Itens da compra</h4>
                                    <span className="text-sm font-bold text-violet-800">Total: R$ {dinheiro(totalNota)}</span>
                                </div>
                                <div className="space-y-2.5 max-h-64 overflow-y-auto">
                                    {itens.map((item, idx) => (
                                        <div key={idx} className="flex flex-wrap sm:flex-nowrap gap-2 items-center bg-slate-50 p-3 rounded-2xl">
                                            <select value={item.productId} onChange={e => escolherProduto(idx, e.target.value)} className="w-full sm:flex-1 border rounded-xl px-2.5 py-2 text-xs bg-white">
                                                <option value="">Selecione o produto...</option>
                                                {produtos.map(p => <option key={p.id} value={p.id}>{p.name} ({p.unit})</option>)}
                                            </select>
                                            <input type="number" step="0.01" min="0.01" placeholder="Qtd" value={item.quantity} onChange={e => atualizar(idx, { quantity: e.target.value })} className="w-20 border rounded-xl px-2 py-2 text-xs bg-white" title="Quantidade" />
                                            <input type="number" step="0.01" min="0" placeholder="R$ un." value={item.unitPrice} onChange={e => atualizar(idx, { unitPrice: e.target.value })} className="w-24 border rounded-xl px-2 py-2 text-xs bg-white" title="Preço unitário" />
                                            <input type="date" title="Validade (opcional)" value={item.expirationDate} onChange={e => atualizar(idx, { expirationDate: e.target.value })} className="w-32 border rounded-xl px-2 py-2 text-xs bg-white" />
                                            {itens.length > 1 && <button type="button" onClick={() => setItens(itens.filter((_, i) => i !== idx))} className="text-rose-500 font-bold px-2">✕</button>}
                                        </div>
                                    ))}
                                </div>
                                <button type="button" onClick={() => setItens([...itens, itemVazio()])} className="mt-2.5 text-xs text-violet-700 font-bold hover:underline">+ Adicionar outro item</button>
                            </div>

                            <div className="flex justify-end space-x-2 pt-3 border-t">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-xs text-slate-600">Cancelar</button>
                                <button type="submit" disabled={salvando || lendoNota} className="bg-violet-700 text-white px-5 py-2 rounded-xl text-xs font-bold disabled:opacity-50">
                                    {salvando ? 'Salvando...' : editando ? 'Salvar alterações' : 'Confirmar compra'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ModalConsumo({ produto, baixarDosLotes, onClose, onSalvo, mostrarToast }) {
            const [qtdConsumir, setQtdConsumir] = useState(1);
            const [salvando, setSalvando] = useState(false);

            const handleConsumir = async (e) => {
                e.preventDefault();
                const qtd = Number(qtdConsumir);
                if (!(qtd > 0) || qtd > produto.stockTotal) {
                    mostrarToast(`Quantidade inválida. Disponível: ${produto.stockTotal} ${produto.unit}`, 'erro');
                    return;
                }
                setSalvando(true);
                try {
                    await baixarDosLotes(produto, qtd);
                    await CB.saveDoc('consumption', `cons_${Date.now()}`, {
                        product_id: produto.id, product_name: produto.name, quantity: qtd,
                        consumed_at: new Date().toISOString(), notes: 'Consumo registrado'
                    });
                    onSalvo();
                } catch (err) {
                    console.error(err);
                    mostrarToast('Erro ao registrar consumo.', 'erro');
                } finally {
                    setSalvando(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                        <h3 className="text-base font-bold text-slate-800">Registrar consumo</h3>
                        <p className="text-xs text-slate-500">{produto.name} (disponível: <strong>{produto.stockTotal} {produto.unit}</strong>)</p>
                        <form onSubmit={handleConsumir} className="space-y-3">
                            <div>
                                <label className="block text-xs font-semibold mb-1">Quantidade consumida ({produto.unit}):</label>
                                <input type="number" step="0.01" min="0.01" max={produto.stockTotal} value={qtdConsumir} onChange={e => setQtdConsumir(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-sm" required />
                            </div>

        function ModalConfig({ user, modoLocal, dados, onClose, mostrarToast }) {

                        onClose();
                    } catch (err) {
                        console.error(err);

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
                        <h3 className="text-base font-bold text-slate-800">⚙️ Configurações e backup</h3>
                        
                        <div className="bg-slate-50 border p-3.5 rounded-2xl space-y-2">

                                    type="password"
                                    placeholder="AIzaSy..."

                        {modoLocal ? (
                            <div className="bg-amber-50 border border-amber-200 p-3 rounded-2xl text-xs text-amber-800">
                                <strong>Modo local:</strong> os dados ficam apenas neste navegador. Exporte backups com frequência ou configure o Firebase para sincronizar.
                            </div>
                        ) : (
                            <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl text-xs text-emerald-800">
                                <strong>Sincronização ativa</strong>{user.email ? ` (${user.email})` : ''}: produtos, fotos, compras e lotes ficam salvos na nuvem e aparecem em todos os aparelhos autorizados.
                            </div>
                        )}
                        <div className="space-y-2 pt-2">
                            <button onClick={exportar} className="w-full bg-violet-700 hover:bg-violet-600 text-white py-2.5 rounded-xl text-xs font-bold">Exportar backup completo (.json)</button>
                            <label className="block w-full text-center bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-bold cursor-pointer">
                                Restaurar backup (.json)
                                <input type="file" accept=".json" onChange={importar} className="hidden" />

            );
        }

        const MONITOR_INTERVALO_MS = 30 * 60 * 1000;

        function parseCsv(texto) {
            const t = (texto || '').replace(/^/, '');
            const primeira = t.split(/\r?\n/)[0] || '';
            const sep = (primeira.match(/;/g) || []).length > (primeira.match(/,/g) || []).length ? ';' : ',';
            const linhas = [];
            let campo = '', linha = [], aspas = false;
            for (let i = 0; i < t.length; i++) {
                const c = t[i];
                if (aspas) {
                    if (c === '"') { if (t[i + 1] === '"') { campo += '"'; i++; } else aspas = false; }
                    else campo += c;
                } else if (c === '"') {
                    aspas = true;
                } else if (c === sep) {
                    linha.push(campo); campo = '';
                } else if (c === '\n' || c === '\r') {
                    if (c === '\r' && t[i + 1] === '\n') i++;
                    linha.push(campo); campo = '';
                    if (linha.some(x => x.trim() !== '')) linhas.push(linha);
                    linha = [];
                } else {
                    campo += c;
                }
            }
            linha.push(campo);
            if (linha.some(x => x.trim() !== '')) linhas.push(linha);
            return linhas;
        }

        function parsePreco(v) {
            let s = String(v || '').replace(/R\$|\s/g, '');
            if (!s) return NaN;
            if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
            else if (s.includes(',')) s = s.replace(',', '.');
            return parseFloat(s);
        }

        function parseDataOferta(v) {
            const s = String(v || '').trim();
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
            m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            return hojeISO();
        }

        function parseValidadeOferta(v) {
            const s = String(v || '').trim();
            if (!s) return '';
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
            m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
            return '';
        }

        function nomeMercadoPadrao(nome) {
            const n = normalizar(nome);
            if (!n) return nome;
            const achado = INITIAL_ESTABLISHMENTS.find(e => e !== 'Outro' && (normalizar(e).includes(n) || n.includes(normalizar(e))));
            return achado || nome.trim();
        }

        function linhasParaOfertas(texto) {
            const linhas = parseCsv(texto);
            if (linhas.length === 0) return [];
            const nomes = linhas[0].map(c => normalizar(c));
            const temCab = nomes.includes('produto') || nomes.includes('preco') || nomes.includes('data');
            let idx;
            if (temCab) {
                const achar = (...ops) => nomes.findIndex(n => ops.includes(n));
                idx = {
                    data: achar('data'),
                    mercado: achar('supermercado', 'mercado', 'loja'),
                    produto: achar('produto', 'item', 'nome'),
                    marca: achar('marca', 'brand'),
                    preco: achar('preco', 'valor'),
                    validade: achar('validade', 'vencimento', 'expira'),
                    link: achar('link', 'url')
                };
            } else {
                const legado5 = parsePreco(linhas[0][3]) > 0;
                idx = legado5
                    ? { data: 0, mercado: 1, produto: 2, marca: -1, preco: 3, validade: -1, link: 4 }
                    : { data: 0, mercado: 1, produto: 2, marca: 3, preco: 4, validade: 5, link: 6 };
            }
            const saida = [];
            (temCab ? linhas.slice(1) : linhas).forEach(l => {
                const produto = (l[idx.produto] || '').trim();
                const mercado = (l[idx.mercado] || '').trim();
                const preco = parsePreco(l[idx.preco]);
                if (!produto || !mercado || !(preco > 0)) return;
                const item = {
                    data: idx.data >= 0 ? parseDataOferta(l[idx.data]) : hojeISO(),
                    mercado: nomeMercadoPadrao(mercado),
                    produto,
                    marca: idx.marca >= 0 ? (l[idx.marca] || '').trim() : '',
                    preco,
                    validade: idx.validade >= 0 ? parseValidadeOferta(l[idx.validade]) : '',
                    link: idx.link >= 0 ? (l[idx.link] || '').trim() : ''
                };
                if (ehOfertaVigente(item)) saida.push(item);
            });
            return saida;
        }

        function MonitorOfertas({ visivel, produtos, historicoPrecos, onOfertasAtualizadas, executar, mostrarToast }) {
            const [csvUrl, setCsvUrl] = useState('');
            const [desativadoManual, setDesativadoManual] = useState(false);
            const [urlInput, setUrlInput] = useState('');
            const [ofertas, setOfertas] = useState([]);
            const [status, setStatus] = useState('inativo');
            const [erro, setErro] = useState('');
            const [ultimaLeitura, setUltimaLeitura] = useState(null);
            const [filtroMercado, setFiltroMercado] = useState('Todos');
            const [soMeus, setSoMeus] = useState(false);
            const [busca, setBusca] = useState('');
            const [textoManual, setTextoManual] = useState('');

            const dadosRef = React.useRef({});
            dadosRef.current = { produtos, historicoPrecos };

            const processar = async (texto, mesclar) => {
                const lista = linhasParaOfertas(texto).filter(ehOfertaVigente);
                const { produtos: prods, historicoPrecos: hist } = dadosRef.current;
                const mercadosCarregados = new Set(lista.map(o => normalizar(o.mercado)));

                const idsNovosAtivos = new Set();
                const matchedParaGravar = [];
                for (const o of [...lista].sort((a, b) => a.data.localeCompare(b.data))) {
                    const prod = acharProdutoDaOferta(o.produto, prods);
                    if (!prod) continue;
                    const id = `site_${slug(o.mercado)}_${slug(o.produto)}_${o.data}`;
                    idsNovosAtivos.add(id);
                    matchedParaGravar.push({ o, prod, id });
                }

                const paraExpirar = new Set();
                for (const h of hist) {
                    if (!h.from_site || h.expired) continue;
                    const vencida = !ehOfertaVigente(h);
                    const removidaDoMercado = mercadosCarregados.has(normalizar(h.source)) && !idsNovosAtivos.has(h.id);
                    if (vencida || removidaDoMercado) {
                        paraExpirar.add(h.id);
                        await CB.saveDoc('price_history', h.id, { expired: true });
                    }
                }

                const ultimoPreco = {};
                [...hist]
                    .filter(h => !h.expired && !paraExpirar.has(h.id) && ehOfertaVigente(h))
                    .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
                    .forEach(h => {
                        ultimoPreco[`${h.product_id}|${normalizar(h.source)}`] = Number(h.price);
                    });
                const existentesAtivos = new Set(hist.filter(h => !h.expired && !paraExpirar.has(h.id)).map(h => h.id));
                let gravados = 0;
                for (const { o, prod, id } of matchedParaGravar) {
                    const chave = `${prod.id}|${normalizar(o.mercado)}`;
                    const linkEfetivo = /^https?:\/\//i.test(o.link || '') ? o.link : (LINKS_MERCADOS[o.mercado] || '');
                    const marcaEfetiva = o.marca || prod.brand || '';
                    if (existentesAtivos.has(id)) { ultimoPreco[chave] = o.preco; continue; }
                    if (ultimoPreco[chave] === o.preco) continue;
                    await CB.saveDoc('price_history', id, {
                        product_id: prod.id,
                        product_name: prod.name,
                        brand: marcaEfetiva,
                        price: o.preco,
                        date: o.data,
                        validade: o.validade || '',
                        link: linkEfetivo,
                        source: o.mercado,
                        from_site: true,
                        expired: false,
                        is_demo: false
                    });
                    existentesAtivos.add(id);
                    ultimoPreco[chave] = o.preco;
                    gravados++;
                }
                setOfertas(prev => mesclar ? [...prev.filter(p => ehOfertaVigente(p) && !mercadosCarregados.has(normalizar(p.mercado))), ...lista] : lista);
                return { total: lista.length, gravados };
            };

            useEffect(() => {
                return CB.subscribeCollection('settings', (docs) => {
                    const d = docs.find(x => x.id === 'ofertas');
                    const url = (d && d.csv_url) || '';
                    setCsvUrl(url);
                    setDesativadoManual(!!(d && d.desativado));
                    setUrlInput(prev => prev || url);
                }, (e) => console.error(e));
            }, []);

            const urlPadraoRepo = (typeof window !== 'undefined' && /^https?:$/i.test(window.location.protocol)) ? './dados/ofertas.csv' : '';
            const urlEfetiva = desativadoManual ? '' : (csvUrl || urlPadraoRepo);

            useEffect(() => {
                if (!urlEfetiva) { setStatus('inativo'); return; }
                let cancelado = false;
                const buscar = async () => {
                    setStatus('lendo');
                    try {
                        const res = await fetch(urlEfetiva + (urlEfetiva.includes('?') ? '&' : '?') + '_=' + Date.now());
                        if (!csvUrl && res.status === 404) {
                            if (!cancelado) { setErro(''); setStatus('inativo'); }
                            return;
                        }
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const texto = await res.text();
                        if (/^\s*<(!doctype|html)/i.test(texto)) throw new Error('A resposta não é um CSV. A planilha está publicada na web?');
                        if (cancelado) return;
                        await processar(texto, false);
                        if (cancelado) return;
                        setErro(''); setStatus('ok'); setUltimaLeitura(new Date());
                    } catch (e) {
                        if (cancelado) return;
                        console.error(e);
                        setErro(e.message || 'Falha ao ler a planilha.');
                        setStatus('erro');
                    }
                };
                buscar();
                const t = setInterval(buscar, MONITOR_INTERVALO_MS);
                return () => { cancelado = true; clearInterval(t); };
            }, [urlEfetiva, csvUrl]);

            const atuais = useMemo(() => {
                const mapa = {};
                ofertas.filter(ehOfertaVigente).forEach(o => {
                    const k = `${normalizar(o.mercado)}|${normalizar(o.produto)}`;
                    if (!mapa[k] || o.data >= mapa[k].data) mapa[k] = o;
                });
                return Object.values(mapa).map(o => {
                    const prod = acharProdutoDaOferta(o.produto, produtos);
                    let vsMedia = null;
                    if (prod) {
                        const ps = historicoPrecos.filter(h => h.product_id === prod.id && !h.expired).map(h => Number(h.price)).filter(v => v > 0);
                        if (ps.length > 1) {
                            const media = ps.reduce((a, b) => a + b, 0) / ps.length;
                            vsMedia = ((media - o.preco) / media) * 100;
                        }
                    }
                    const marca = o.marca || (prod && prod.brand) || '';
                    const link = /^https?:\/\//i.test(o.link || '') ? o.link : (LINKS_MERCADOS[o.mercado] || '');
                    return { ...o, prod, vsMedia, marca, link };
                });
            }, [ofertas, produtos, historicoPrecos]);

            useEffect(() => {
                if (onOfertasAtualizadas) onOfertasAtualizadas(atuais);
            }, [atuais, onOfertasAtualizadas]);

            if (!visivel) return null;

            const salvarUrl = () => executar(async () => {
                const u = urlInput.trim();
                if (u && !/^https?:\/\//i.test(u) && !u.startsWith('./')) {
                    mostrarToast('Cole um link que comece com https:// ou use ./dados/ofertas.csv', 'erro');
                    return;
                }
                await CB.saveDoc('settings', 'ofertas', { csv_url: u, desativado: false });
                setDesativadoManual(false);
                mostrarToast(u ? 'Link salvo. Leitura automática ativada!' : 'Usando leitura automática de ./dados/ofertas.csv.');
            });

            const importarManual = () => executar(async () => {
                if (!textoManual.trim()) return;
                const r = await processar(textoManual, true);
                setUltimaLeitura(new Date());
                setTextoManual('');
                mostrarToast(`${r.total} oferta(s) lida(s); ${r.gravados} preço(s) novo(s) no histórico.`);
            });

            const cadastrar = (o) => executar(async () => {
                const id = `site_${slug(o.produto)}`;
                const linkEfetivo = /^https?:\/\//i.test(o.link || '') ? o.link : (LINKS_MERCADOS[o.mercado] || '');
                await CB.saveDoc('products', id, {
                    name: o.produto, category: 'Outros', brand: o.marca || '', unit: 'unidade',
                    default_quantity: 1, minimum_stock: 1, default_price: o.preco,
                    local_estoque: 'Itens no armário', image_url: '',
                    notes: 'Cadastrado pelo monitor de ofertas', is_demo: false
                });
                await CB.saveDoc('price_history', `site_${slug(o.mercado)}_${slug(o.produto)}_${o.data}`, {
                    product_id: id, product_name: o.produto, brand: o.marca || '', price: o.preco,
                    date: o.data, validade: o.validade || '', link: linkEfetivo,
                    source: o.mercado, from_site: true, expired: false, is_demo: false
                });
                mostrarToast('Produto cadastrado e preço registrado!');
            });

            const mercados = [...new Set(atuais.map(o => o.mercado))].sort();
            const t = normalizar(busca);
            const filtradas = atuais
                .filter(o => (filtroMercado === 'Todos' || o.mercado === filtroMercado)
                    && (!soMeus || o.prod)
                    && (!t || normalizar(o.produto + ' ' + (o.marca || '')).includes(t)))
                .sort((a, b) => (b.prod ? 1 : 0) - (a.prod ? 1 : 0)
                    || (b.vsMedia === null ? -999 : b.vsMedia) - (a.vsMedia === null ? -999 : a.vsMedia)
                    || a.produto.localeCompare(b.produto));

            const rotuloStatus = {
                inativo: { txt: 'Desativado', cls: 'bg-slate-100 text-slate-600' },
                lendo: { txt: 'Lendo...', cls: 'bg-amber-100 text-amber-800' },
                ok: { txt: 'Ativo', cls: 'bg-emerald-100 text-emerald-700' },
                erro: { txt: 'Erro', cls: 'bg-rose-100 text-rose-700' }
            }[status];

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                        <div className="flex flex-wrap justify-between items-start gap-2">
                            <div>
                                <h2 className="text-lg font-bold text-slate-800">🌐 Ofertas dos sites dos supermercados</h2>
                                <p className="text-xs text-slate-500">Lê os encartes/planilha do coletor (colunas: data, supermercado, produto, marca, preco, validade, link) ao abrir e a cada 30 min, limpando ofertas expiradas automaticamente.</p>
                            </div>
                            <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${rotuloStatus.cls}`}>{rotuloStatus.txt}</span>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-2">
                            <input type="url" placeholder={urlPadraoRepo && !desativadoManual ? 'Automático: ./dados/ofertas.csv (ou cole outra URL CSV https://...)' : 'https://docs.google.com/spreadsheets/d/e/.../pub?output=csv'} value={urlInput} onChange={e => setUrlInput(e.target.value)} className="flex-1 border rounded-xl px-3 py-2 text-xs" />
                            <button onClick={salvarUrl} className="bg-violet-700 hover:bg-violet-600 text-white px-4 py-2 rounded-xl text-xs font-bold">{urlEfetiva ? 'Atualizar link' : 'Salvar e ativar'}</button>
                            {urlEfetiva && <button onClick={() => { setUrlInput(''); executar(async () => { await CB.saveDoc('settings', 'ofertas', { csv_url: '', desativado: true }); setDesativadoManual(true); setOfertas([]); mostrarToast('Monitoramento desativado.'); }); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold">Desativar</button>}
                        </div>
                        {ultimaLeitura && <p className="text-[11px] text-slate-500">Última leitura: {ultimaLeitura.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} • {atuais.length} oferta(s) vigente(s) • {atuais.filter(o => o.prod).length} nos seus produtos</p>}
                        {erro && <p className="text-xs text-rose-600">⚠️ {erro}</p>}
                        <details className="text-xs text-slate-600">
                            <summary className="cursor-pointer font-bold text-violet-700">Testar colando linhas manualmente</summary>
                            <textarea value={textoManual} onChange={e => setTextoManual(e.target.value)} placeholder={'data,supermercado,produto,marca,preco,validade,link\n2026-11-18,Tatico,Arroz Branco 5kg,Tio João,26.90,2026-11-25,https://taticobaratotododia.com.br/gyn/tabloide/'} className="w-full h-24 border rounded-xl p-3 text-xs font-mono mt-2" />
                            <button onClick={importarManual} className="mt-2 bg-violet-100 text-violet-800 px-4 py-2 rounded-xl text-xs font-bold">Importar linhas</button>
                        </details>
                    </div>

                    {atuais.length > 0 && (
                        <div className="space-y-3">
                            <div className="flex flex-wrap gap-1.5 items-center">
                                <button onClick={() => setFiltroMercado('Todos')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${filtroMercado === 'Todos' ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>Todos</button>
                                {mercados.map(m => (
                                    <button key={m} onClick={() => setFiltroMercado(m)} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${filtroMercado === m ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>{m.replace('Supermercado ', '')}</button>
                                ))}
                                <label className="flex items-center space-x-1.5 text-xs text-slate-600 ml-2 cursor-pointer">
                                    <input type="checkbox" checked={soMeus} onChange={e => setSoMeus(e.target.checked)} className="accent-violet-700" />
                                    <span>Só meus produtos</span>
                                </label>
                            </div>
                            <input type="text" placeholder="Buscar produto ou marca nas ofertas..." value={busca} onChange={e => setBusca(e.target.value)} className="w-full bg-white border rounded-2xl px-4 py-2.5 text-xs shadow-sm" />
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filtradas.map(o => {
                            const dias = calcularDiasParaVencer(o.data);
                            const antiga = dias !== null && dias < -7;
                            return (
                                <div key={`${o.mercado}|${o.produto}`} className={`bg-white rounded-3xl p-5 shadow-sm border flex flex-col justify-between ${o.prod ? 'border-violet-200' : 'border-slate-200'} ${antiga ? 'opacity-60' : ''}`}>
                                    <div>
                                        <div className="flex justify-between items-start gap-2 mb-2">
                                            <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full">{o.mercado.replace('Supermercado ', '')}</span>
                                            {o.vsMedia !== null && o.vsMedia > 0 && <span className="text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded-full">-{o.vsMedia.toFixed(0)}% vs sua média</span>}
                                        </div>
                                        <h4 className="text-sm font-bold text-slate-800">{o.produto}</h4>
                                        {o.marca && (
                                            <span className="inline-block mt-1 text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full">🏷️ {o.marca}</span>
                                        )}
                                        <p className="text-[11px] text-slate-500 mt-1">
                                            {o.data}{o.validade ? ` • válido até ${o.validade}` : ''}{antiga ? ' • possivelmente desatualizada' : ''}
                                        </p>
                                        {o.prod && <p className="text-[11px] text-violet-700 font-semibold mt-1">✅ Seu produto: {o.prod.name}</p>}
                                    </div>
                                    <div className="flex justify-between items-center mt-3 pt-3 border-t">
                                        <span className="text-base font-bold text-violet-800">R$ {dinheiro(o.preco)}</span>
                                        <div className="flex gap-2 items-center">
                                            {/^https?:\/\//i.test(o.link) && (
                                                <a href={o.link} target="_blank" rel="noopener noreferrer" className="text-[11px] text-violet-700 font-bold hover:underline inline-flex items-center gap-1">
                                                    <Icon name="external-link" className="w-3 h-3" />
                                                    <span>Conferir na fonte</span>
                                                </a>
                                            )}
                                            {!o.prod && <button onClick={() => cadastrar(o)} className="text-[11px] bg-violet-100 text-violet-800 font-bold px-2.5 py-1 rounded-lg hover:bg-violet-200">+ Monitorar</button>}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {atuais.length === 0 && (
                        <p className="text-xs text-slate-400 text-center py-8">{urlEfetiva ? 'Nenhuma oferta vigente lida ainda. Confira se o arquivo CSV tem ofertas válidas.' : 'Cole acima o link CSV da planilha do coletor ou ative ./dados/ofertas.csv para começar.'}</p>
                    )}
                    {atuais.length > 0 && filtradas.length === 0 && <p className="text-xs text-slate-400 text-center py-6">Nenhuma oferta neste filtro.</p>}
                </div>
            );
        }

        function CardapioRUView({ executar, mostrarToast }) {
            const [config, setConfig] = useState({
                unidade: 'Colemar Natal e Silva',
                titulo: '',
                dias: [],
                fonte_pagina_url: 'https://ru-ufg.web.ufg.br/tabs/cardapio',
                atualizado_em: '',
                palavras_chave: [
                    { termo: 'strogonoff', ativo: true },
                    { termo: 'lasanha', ativo: true },
                    { termo: 'feijoada', ativo: false },
                    { termo: 'frango assado', ativo: true }
                ]
            });
            const [novoTermo, setNovoTermo] = useState('');

            useEffect(() => {
                return CB.subscribeCollection('settings', (docs) => {
                    const doc = docs.find(d => d.id === 'cardapio_ru');
                    if (doc) {
                        setConfig(prev => ({
                            ...prev,
                            ...doc,
                            fonte_pagina_url: doc.fonte_pagina_url || prev.fonte_pagina_url,
                            palavras_chave: Array.isArray(doc.palavras_chave) ? doc.palavras_chave : prev.palavras_chave,
                            dias: Array.isArray(doc.dias) ? doc.dias : []
                        }));
                    }
                });
            }, []);

            const salvarConfig = (parcial) => executar(async () => {
                const proximo = { ...config, ...parcial };
                setConfig(proximo);
                await CB.saveDoc('settings', 'cardapio_ru', {
                    unidade: proximo.unidade,
                    palavras_chave: proximo.palavras_chave
                });
            });

            const adicionarTermo = (e) => {
                e.preventDefault();
                const termo = novoTermo.trim();
                if (!termo) return;
                if (config.palavras_chave.some(p => normalizar(p.termo) === normalizar(termo))) {
                    mostrarToast('Esse item já está na lista.', 'erro');
                    return;
                }
                const lista = [...config.palavras_chave, { termo, ativo: true }];
                setNovoTermo('');
                salvarConfig({ palavras_chave: lista });
                mostrarToast('Alerta adicionado!');
            };

            const alternarTermo = (idx) => {
                const lista = config.palavras_chave.map((p, i) => i === idx ? { ...p, ativo: !p.ativo } : p);
                salvarConfig({ palavras_chave: lista });
            };

            const removerTermo = (idx) => {
                const lista = config.palavras_chave.filter((_, i) => i !== idx);
                salvarConfig({ palavras_chave: lista });
            };

            const diasSemanaNomes = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
            const hojeNome = diasSemanaNomes[new Date().getDay()];
            const termosAtivos = config.palavras_chave.filter(p => p.ativo).map(p => normalizar(p.termo)).filter(Boolean);

            const temFavorito = (ref) => {
                if (!ref || termosAtivos.length === 0) return false;
                const texto = normalizar(typeof ref === 'string' ? ref : Object.values(ref).join(' '));
                return termosAtivos.some(t => texto.includes(t));
            };

            const renderRefeicao = (titulo, ref) => {
                if (!ref || (typeof ref === 'object' && !Object.values(ref).some(v => String(v || '').trim()))) {
                    return <p className="text-[11px] text-slate-400 italic">Sem {titulo.toLowerCase()}</p>;
                }
                const destaque = temFavorito(ref);
                const campos = typeof ref === 'string'
                    ? [['Cardápio', ref]]
                    : [
                        ['Principal', ref.principal],
                        ['Vegetariano', ref.vegetariano],
                        ['Vegano', ref.vegano],
                        ['Guarnição', ref.guarnicao],
                        ['Acompanhamentos', ref.acompanhamentos],
                        ['Salada', ref.salada],
                        ['Sobremesa', ref.sobremesa],
                        ['Suco', ref.suco]
                    ].filter(([, v]) => String(v || '').trim());

                return (
                    <div className={`rounded-2xl p-3 border ${destaque ? 'bg-amber-50 border-amber-300' : 'bg-slate-50 border-slate-100'}`}>
                        <div className="flex items-center justify-between mb-1.5">
                            <span className="text-xs font-bold text-slate-800">{titulo}</span>
                            {destaque && <span className="text-[10px] font-bold bg-amber-200 text-amber-900 px-2 py-0.5 rounded-full">⭐ Tem item favorito!</span>}
                        </div>
                        <div className="space-y-1">
                            {campos.map(([rotulo, valor]) => (
                                <p key={rotulo} className="text-[11px] text-slate-600 leading-snug">
                                    <strong className="text-slate-700">{rotulo}:</strong> {valor}
                                </p>
                            ))}
                        </div>
                    </div>
                );
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-4">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                                <h2 className="text-base font-bold text-slate-800">🍽️ Cardápio RU — UFG</h2>
                                <p className="text-xs text-slate-500">
                                    {config.titulo || 'Aguardando primeira coleta semanal do App RU pela Action'}
                                    {config.atualizado_em ? ` • Atualizado em ${config.atualizado_em.slice(0, 10)}` : ''}
                                </p>
                            </div>
                            <div className="flex flex-wrap items-center gap-2">
                                <select
                                    value={config.unidade}
                                    onChange={e => salvarConfig({ unidade: e.target.value })}
                                    className="border rounded-xl px-3 py-1.5 text-xs bg-slate-50 font-semibold text-slate-700"
                                >
                                    <option value="Colemar Natal e Silva">RU Colemar Natal e Silva</option>
                                    <option value="Samambaia">RU Samambaia</option>
                                </select>
                                <a href={config.fonte_pagina_url || 'https://ru-ufg.web.ufg.br/tabs/cardapio'} target="_blank" rel="noopener noreferrer" className="text-xs bg-violet-50 text-violet-700 font-bold px-3 py-1.5 rounded-xl hover:bg-violet-100 inline-flex items-center gap-1">
                                    <Icon name="external-link" className="w-3.5 h-3.5" />
                                    <span>Abrir App RU (UFG)</span>
                                </a>
                            </div>
                        </div>

                        <div className="border-t pt-4 space-y-3">
                            <div>
                                <h3 className="text-xs font-bold text-slate-800">🔔 Avisos no WhatsApp (só no dia que tiver o item)</h3>
                                <p className="text-[11px] text-slate-500">Marque ou desmarque abaixo os pratos que você quer receber aviso às 07h30 no dia em que forem servidos.</p>
                            </div>

                            <form onSubmit={adicionarTermo} className="flex gap-2">
                                <input
                                    type="text"
                                    placeholder="Ex.: strogonoff, lasanha, frango assado, peixe..."
                                    value={novoTermo}
                                    onChange={e => setNovoTermo(e.target.value)}
                                    className="flex-1 border rounded-xl px-3 py-2 text-xs bg-slate-50"
                                />
                                <button type="submit" className="bg-violet-700 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-violet-800">
                                    + Adicionar
                                </button>
                            </form>

                            <div className="flex flex-wrap gap-2">
                                {config.palavras_chave.map((item, idx) => (
                                    <div
                                        key={`${item.termo}-${idx}`}
                                        className={`flex items-center gap-2 px-3 py-1.5 rounded-full border text-xs transition ${item.ativo ? 'bg-violet-50 border-violet-300 text-violet-900 font-semibold' : 'bg-slate-50 border-slate-200 text-slate-400'}`}
                                    >
                                        <label className="flex items-center gap-1.5 cursor-pointer select-none">
                                            <input
                                                type="checkbox"
                                                checked={!!item.ativo}
                                                onChange={() => alternarTermo(idx)}
                                                className="accent-violet-700 w-3.5 h-3.5"
                                            />
                                            <span>{item.termo}</span>
                                        </label>
                                        <button type="button" onClick={() => removerTermo(idx)} className="text-slate-400 hover:text-rose-600 font-bold ml-1" title="Remover">✕</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {config.dias.length === 0 ? (
                        <div className="bg-white rounded-3xl p-8 text-center border border-slate-200 text-xs text-slate-500">
                            Nenhum cardápio carregado ainda. Assim que você configurar as Secrets e rodar a Action <strong>Notificações Diárias (Vencimentos + Cardápio RU)</strong> no GitHub, a semana inteira aparecerá aqui automaticamente.
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {config.dias.map((d, idx) => {
                                const ehHoje = normalizar(d.dia_semana) === normalizar(hojeNome);
                                return (
                                    <div key={idx} className={`bg-white rounded-3xl p-5 shadow-sm border space-y-3 ${ehHoje ? 'border-violet-500 ring-2 ring-violet-100' : 'border-slate-200'}`}>
                                        <div className="flex items-center justify-between">
                                            <h3 className="text-sm font-bold text-slate-800">{d.dia_semana}</h3>
                                            <div className="flex items-center gap-1.5">
                                                {d.data && <span className="text-[11px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full">{d.data}</span>}
                                                {ehHoje && <span className="text-[10px] font-bold bg-violet-700 text-white px-2 py-0.5 rounded-full">HOJE</span>}
                                            </div>
                                        </div>
                                        {d.cafe_manha && renderRefeicao('Café da Manhã', d.cafe_manha)}
                                        {renderRefeicao('Almoço', d.almoco)}
                                        {renderRefeicao('Jantar', d.jantar)}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
