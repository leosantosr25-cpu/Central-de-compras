        (function () {
            var firebaseConfig = {
                apiKey: "AIzaSyA0pd5yT4zc7e36kqww4iFdOFg0qbAL4ao",

            };

            var cloudOk = !!firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('COLE') !== 0;
            var limpar = function (obj) { return JSON.parse(JSON.stringify(obj)); };

            if (cloudOk) {
                try {
                    firebase.initializeApp(firebaseConfig);
                    var auth = firebase.auth();
                    var db = firebase.firestore();
                    var col = function (nome) { return db.collection('casas').doc('familia').collection(nome); };

                    window.CloudBackend = {
                        mode: 'nuvem',
                        onAuthChange: function (cb) { return auth.onAuthStateChanged(cb); },
                        signIn: async function () {
                            var provider = new firebase.auth.GoogleAuthProvider();
                            try {
                                await auth.signInWithPopup(provider);
                            } catch (e) {
                                if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
                                    return auth.signInWithRedirect(provider);
                                }
                                if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') throw e;
                            }
                        },
                        signOut: function () { return auth.signOut(); },
                        subscribeCollection: function (nome, onData, onErr) {
                            return col(nome).onSnapshot(function (snap) {
                                onData(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
                            }, onErr);
                        },
                        saveDoc: function (nome, id, data) { return col(nome).doc(String(id)).set(limpar(data), { merge: true }); },
                        removeDoc: function (nome, id) { return col(nome).doc(String(id)).delete(); }
                    };
                } catch (e) {
                    console.error('Erro ao iniciar o Firebase', e);
                    cloudOk = false;
                }
            }

            if (!cloudOk) {
                var listeners = {};
                var ler = function (nome) { try { return JSON.parse(localStorage.getItem('cc2_' + nome) || '{}'); } catch (e) { return {}; } };
                var gravar = function (nome, obj) {
                    try { localStorage.setItem('cc2_' + nome, JSON.stringify(obj)); }
                    catch (e) { alert('Armazenamento do navegador cheio. Remova fotos ou exporte um backup.'); }
                };
                var lista = function (nome) {
                    var o = ler(nome);
                    return Object.keys(o).map(function (id) { return Object.assign({ id: id }, o[id]); });
                };
                var emitir = function (nome) {
                    (listeners[nome] || []).forEach(function (fn) { fn(lista(nome)); });
                };
                window.addEventListener('storage', function (e) {
                    if (e.key && e.key.indexOf('cc2_') === 0) emitir(e.key.replace('cc2_', ''));
                });

                window.CloudBackend = {
                    mode: 'local',
                    onAuthChange: function (cb) { setTimeout(function () { cb({ uid: 'local', email: '' }); }, 0); return function () {}; },
                    signIn: async function () {},
                    signOut: async function () {},
                    subscribeCollection: function (nome, onData) {
                        listeners[nome] = listeners[nome] || [];
                        listeners[nome].push(onData);
                        setTimeout(function () { onData(lista(nome)); }, 0);
                        return function () { listeners[nome] = listeners[nome].filter(function (f) { return f !== onData; }); };
                    },
                    saveDoc: async function (nome, id, data) {
                        var o = ler(nome);
                        o[String(id)] = Object.assign({}, o[String(id)] || {}, limpar(data));
                        gravar(nome, o);
                        emitir(nome);
                    },
                    removeDoc: async function (nome, id) {
                        var o = ler(nome);
                        delete o[String(id)];
                        gravar(nome, o);
                        emitir(nome);
                    }
                };
            }
        })();
    </script>

            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);

                        }

                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function calcularDiasParaVencer(dataStr) {
            if (!dataStr) return null;
            const [ano, mes, dia] = dataStr.split('-').map(Number);
            if (!ano || !mes || !dia) return null;
            const dataVal = new Date(ano, mes - 1, dia);
            const agora = new Date();
            const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
            return Math.round((dataVal - hoje) / (1000 * 60 * 60 * 24));
        }

        const LOCAIS_ESTOQUE = [
            { id: 'Itens no congelador', label: 'Itens no congelador', icon: '❄️', badgeCls: 'bg-sky-100 text-sky-800 border-sky-200' },
            { id: 'Itens no armário', label: 'Itens no armário', icon: '🗄️', badgeCls: 'bg-amber-100 text-amber-800 border-amber-200' },
            { id: 'Itens de higiene', label: 'Itens de higiene', icon: '🧴', badgeCls: 'bg-teal-100 text-teal-800 border-teal-200' }
        ];

        const LINKS_MERCADOS = {
            'Supermercado Tatico': 'https://taticobaratotododia.com.br/gyn/tabloide/',
            'Supermercado Pro Brazilian': 'https://www.probrazilian.com.br/ofertas',
            'Supermercado Assaí Independência': 'https://www.assai.com.br/ofertas/goias/assai-independencia',
            'Supermercado Costa Atacadão': 'https://costaatacadao.com.br/ofertas/'
        };

        function inferirLocalCategoria(categoria) {
            const c = normalizar(categoria);
            if (c.includes('congelad') || c.includes('carne')) return 'Itens no congelador';
            if (c.includes('higiene') || c.includes('limpeza')) return 'Itens de higiene';
            return 'Itens no armário';
        }

        function obterLocalEstoque(prod, lote) {
            const loc = (lote && lote.local_estoque) || (prod && prod.local_estoque);
            if (loc && LOCAIS_ESTOQUE.some(x => x.id === loc)) return loc;
            return inferirLocalCategoria(prod && prod.category);
        }

        const MONITOR_STOP = new Set(['de', 'da', 'do', 'com', 'sem', 'para', 'em', 'e', 'a', 'o', 'un', 'und', 'unidade', 'pacote', 'pct', 'kg', 'g', 'l', 'ml', 'lata', 'caixa']);
        function tokensNome(s) {
            return normalizar(s)
                .replace(/(\d)\s+(kg|g|ml|l)\b/g, '$1$2')
                .split(/[^a-z0-9]+/)
                .filter(t => t && !MONITOR_STOP.has(t));
        }

        function acharProdutoDaOferta(nomeOferta, produtos) {
            const tOf = tokensNome(nomeOferta);
            const setOf = new Set(tOf);
            let melhor = null, melhorN = 0;
            for (const p of produtos) {
                const tp = tokensNome(p.name);
                if (tp.length === 0 || !tp.every(t => setOf.has(t))) continue;
                if (tp.length / Math.max(tOf.length, 1) < 0.4) continue;
                if (tp.length > melhorN) { melhor = p; melhorN = tp.length; }
            }
            return melhor;
        }

        function ehOfertaVigente(item) {
            if (!item) return false;
            if (item.expired) return false;
            const hoje = hojeISO();
            if (item.validade && /^\d{4}-\d{2}-\d{2}$/.test(item.validade) && item.validade < hoje) return false;
            const dataRef = item.data || item.date;
            if (dataRef) {
                const d = calcularDiasParaVencer(dataRef);
                if (d !== null && d < -7) return false;
            }
            return true;
        }

        const COLECOES_BACKUP = [
            ['produtos', 'products'],
            ['lotesValidade', 'product_expiration'],
            ['compras', 'purchases'],
            ['historicoPrecos', 'price_history'],
            ['consumos', 'consumption'],
            ['listaCompras', 'shopping_list']
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [authPronto, setAuthPronto] = useState(false);
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('conectando');
            const [erroNuvem, setErroNuvem] = useState('');
            const [erroLogin, setErroLogin] = useState('');

            const [produtos, setProdutos] = useState([]);
            const [compras, setCompras] = useState([]);
            const [lotesValidade, setLotesValidade] = useState([]);
            const [historicoPrecos, setHistoricoPrecos] = useState([]);
            const [consumos, setConsumos] = useState([]);
            const [listaCompras, setListaCompras] = useState([]);

            const [abaAtiva, setAbaAtiva] = useState('inicio');
            const [ofertasSiteAtivas, setOfertasSiteAtivas] = useState([]);
            const [modalProduto, setModalProduto] = useState(null);
            const [modalCatalogo, setModalCatalogo] = useState(false);
            const [modalCompra, setModalCompra] = useState(null); // null, true (nova compra), ou objeto (compra para editar)
            const [modalConsumo, setModalConsumo] = useState(null);
            const [modalDetalheCompra, setModalDetalheCompra] = useState(null);
            const [modalBuscaGlobal, setModalBuscaGlobal] = useState(false);
            const [modalConfig, setModalConfig] = useState(false);
            const [fotoAmpliada, setFotoAmpliada] = useState(null);
            const [toast, setToast] = useState(null);

            const uid = user ? user.uid : null;

            const mostrarToast = (msg, tipo = 'sucesso') => {
                setToast({ msg, tipo });
                setTimeout(() => setToast(null), 3500);
            };

            useEffect(() => {
                return CB.onAuthChange((u) => {
                    setUser(u || null);
                    setAuthPronto(true);
                    if (!u) { setLoading(true); setErroNuvem(''); }
                });
            }, []);

            useEffect(() => {
                if (!uid) return;
                setLoading(true);
                setSyncStatus('sincronizando');
                setErroNuvem('');
                const carregados = new Set();
                const marcar = (nome) => {
                    carregados.add(nome);
                    if (carregados.size === 6) { setLoading(false); setSyncStatus('online'); }
                };
                const falha = (err) => {
                    console.error(err);
                    setSyncStatus('erro');
                    setErroNuvem(err && err.code === 'permission-denied'
                        ? 'Este e-mail não tem permissão para acessar os dados. Confira as regras do Firestore.'
                        : 'Erro de sincronização: ' + ((err && err.message) || 'desconhecido'));
                    setLoading(false);
                };
                const assinar = (nome, setter, ordenar) => CB.subscribeCollection(nome, (d) => {
                    setter(ordenar ? d.sort(ordenar) : d);
                    marcar(nome);
                }, falha);

                const unsubs = [
                    assinar('products', setProdutos, (a, b) => (a.name || '').localeCompare(b.name || '')),
                    assinar('purchases', setCompras, (a, b) => (b.purchase_date || '').localeCompare(a.purchase_date || '')),
                    assinar('product_expiration', setLotesValidade, (a, b) => (a.expiration_date || '9999').localeCompare(b.expiration_date || '9999')),
                    assinar('price_history', setHistoricoPrecos, (a, b) => (b.date || '').localeCompare(a.date || '')),
                    assinar('consumption', setConsumos, (a, b) => (b.consumed_at || '').localeCompare(a.consumed_at || '')),
                    assinar('shopping_list', setListaCompras, null)
                ];
                return () => unsubs.forEach(u => u());
            }, [uid]);

            const produtosComEstoque = useMemo(() => {
                return produtos.map(p => {
                    const lotes = lotesValidade.filter(l => l.product_id === p.id);
                    const stockTotal = Number(lotes.reduce((acc, l) => acc + Number(l.quantity || 0), 0).toFixed(3));
                    return { ...p, stockTotal, lotes };
                });
            }, [produtos, lotesValidade]);

            const itensAbaixoMinimo = useMemo(() => {
                return produtosComEstoque.filter(p => p.stockTotal <= Number(p.minimum_stock || 0));
            }, [produtosComEstoque]);

            const pendentesLista = useMemo(() => {
                const manuais = listaCompras.filter(l => !l.purchased).length;
                const sugeridosNovos = itensAbaixoMinimo.filter(p => !listaCompras.some(l => !l.purchased && l.product_id === p.id)).length;
                return manuais + sugeridosNovos;
            }, [listaCompras, itensAbaixoMinimo]);

            const metricasGasto = useMemo(() => {
                const agora = new Date();
                const hojeZero = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                const inicioSemana = new Date(hojeZero);
                inicioSemana.setDate(hojeZero.getDate() - 6);
                let semana = 0, mes = 0;
                compras.forEach(c => {
                    if (!c.purchase_date) return;
                    const [y, m, d] = c.purchase_date.split('-').map(Number);
                    const dt = new Date(y, m - 1, d);
                    const val = Number(c.total || 0);
                    if (dt >= inicioSemana && dt <= agora) semana += val;
                    if (dt.getMonth() === agora.getMonth() && dt.getFullYear() === agora.getFullYear()) mes += val;
                });
                return { semana, mes };
            }, [compras]);

            const ofertasEncontradas = useMemo(() => {
                return produtos.map(p => {
                    const histValido = historicoPrecos.filter(h => h.product_id === p.id && Number(h.price) > 0 && (!h.from_site || ehOfertaVigente(h)));
                    const histTodos = historicoPrecos.filter(h => h.product_id === p.id && Number(h.price) > 0);
                    if (histValido.length === 0 || histTodos.length < 2) return null;
                    const precos = histTodos.map(h => Number(h.price));
                    const media = precos.reduce((a, b) => a + b, 0) / precos.length;
                    const menor = Math.min(...precos);
                    const atualReg = histValido[0];
                    const precoAtual = Number(atualReg.price);
                    if (precoAtual < media) {
                        const estabelecimento = atualReg.source || 'Supermercado';
                        return {
                            ...p,
                            brand: atualReg.brand || p.brand || '',
                            precoAtual, media, menor,
                            desconto: ((media - precoAtual) / media) * 100,
                            economia: media - precoAtual,
                            estabelecimento,
                            dataPreco: atualReg.date,
                            link: atualReg.link || LINKS_MERCADOS[estabelecimento] || ''
                        };
                    }
                    return null;
                }).filter(Boolean).sort((a, b) => b.desconto - a.desconto);
            }, [produtos, historicoPrecos]);

            const estimativaProximaSemana = useMemo(() => {
                let total = 0, itensBase = 0;
                itensAbaixoMinimo.forEach(p => {
                    const hist = historicoPrecos.find(h => h.product_id === p.id && Number(h.price) > 0);
                    if (hist) {
                        const qtd = Math.max(Number(p.default_quantity || 1), Number(p.minimum_stock || 1) - p.stockTotal);
                        total += Number(hist.price) * (qtd > 0 ? qtd : 1);
                        itensBase++;
                    }
                });
                return { total, itensBase };
            }, [itensAbaixoMinimo, historicoPrecos]);

            const executar = async (fn, erroMsg = 'Não foi possível concluir a operação.') => {
                try { await fn(); return true; }
                catch (err) { console.error(err); mostrarToast(erroMsg, 'erro'); return false; }
            };

            const baixarDosLotes = async (prod, qtd) => {
                let restante = qtd;
                const ordenados = [...prod.lotes].sort((a, b) => (a.expiration_date || '9999').localeCompare(b.expiration_date || '9999'));
                for (const lote of ordenados) {
                    if (restante <= 0) break;
                    const q = Number(lote.quantity);
                    if (q <= restante) {
                        restante = Number((restante - q).toFixed(3));
                        await CB.removeDoc('product_expiration', lote.id);
                    } else {
                        await CB.saveDoc('product_expiration', lote.id, { quantity: Number((q - restante).toFixed(3)) });
                        restante = 0;
                    }
                }
            };

            const ajustarEstoqueRapido = (prod, delta) => executar(async () => {
                if (delta < 0) {
                    const qtd = Math.abs(delta);
                    if (prod.stockTotal < qtd) { mostrarToast('Estoque insuficiente.', 'erro'); return; }
                    await baixarDosLotes(prod, qtd);
                    await CB.saveDoc('consumption', `cons_${Date.now()}`, {
                        product_id: prod.id, product_name: prod.name, quantity: qtd,
                        consumed_at: new Date().toISOString(), notes: 'Consumo rápido (-1)'
                    });
                    mostrarToast(`-1 ${prod.unit} de ${prod.name}`);
                } else {
                    const semData = prod.lotes.find(l => !l.expiration_date);
                    if (semData) {
                        await CB.saveDoc('product_expiration', semData.id, { quantity: Number((Number(semData.quantity) + delta).toFixed(3)) });
                    } else {
                        await CB.saveDoc('product_expiration', `lote_${Date.now()}`, {
                            product_id: prod.id, quantity: delta, expiration_date: '',
                            local_estoque: obterLocalEstoque(prod, null)
                        });
                    }
                    mostrarToast(`+1 ${prod.unit} em ${prod.name}`);
                }
            });

            const excluirProduto = async (prod) => {
                if (!confirm(`Excluir "${prod.name}"? O estoque e os itens da lista ligados a ele também serão removidos.`)) return;
                await executar(async () => {
                    for (const l of lotesValidade.filter(x => x.product_id === prod.id)) await CB.removeDoc('product_expiration', l.id);
                    for (const l of listaCompras.filter(x => x.product_id === prod.id)) await CB.removeDoc('shopping_list', l.id);
                    await CB.removeDoc('products', prod.id);
                    mostrarToast('Produto excluído.');
                });
            };

            const excluirCompra = async (compra) => {
                if (!confirm('Excluir esta compra? O que restar em estoque dela e os preços registrados nela serão removidos.')) return;
                await executar(async () => {
                    for (const l of lotesValidade.filter(x => x.purchase_id === compra.id)) await CB.removeDoc('product_expiration', l.id);
                    for (const h of historicoPrecos.filter(x => x.purchase_id === compra.id)) await CB.removeDoc('price_history', h.id);
                    await CB.removeDoc('purchases', compra.id);
                    setModalDetalheCompra(null);
                    mostrarToast('Compra excluída.');
                });
            };

            const adicionarDoCatalogo = async (itens, jaTenho) => {
                await executar(async () => {
                    await Promise.all(itens.map(async (it) => {
                        const id = `cat_${slug(it.nome)}`;
                        const localCat = inferirLocalCategoria(it.categoria);
                        await CB.saveDoc('products', id, {
                            name: it.nome, category: it.categoria, brand: '', unit: it.unidade,
                            default_quantity: it.qtd, minimum_stock: it.min, default_price: 0,
                            local_estoque: localCat, image_url: '', notes: '', is_demo: false
                        });
                        if (jaTenho) {
                            await CB.saveDoc('product_expiration', `lote_${id}_ini`, {
                                product_id: id, quantity: it.qtd, expiration_date: '',
                                local_estoque: localCat, is_demo: false
                            });
                        }
                    }));
                    mostrarToast(`${itens.length} produto(s) adicionado(s)!`);
                    setModalCatalogo(false);
                }, 'Erro ao adicionar itens do catálogo.');
            };

            const sair = () => { if (confirm('Sair da sua conta neste aparelho?')) CB.signOut(); };

            if (!authPronto) return <div className="min-h-screen flex items-center justify-center text-sm text-slate-500">Carregando...</div>;

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                        <div className="bg-white rounded-3xl shadow-lg p-8 max-w-sm w-full text-center space-y-4 border border-slate-200">
                            <div className="mx-auto bg-violet-700 w-14 h-14 rounded-2xl flex items-center justify-center text-2xl">🛒</div>
                            <h1 className="text-xl font-bold text-violet-800">Central de Compras da Casa</h1>
                            <p className="text-xs text-slate-500">Entre com a conta Google autorizada para sincronizar seus dados em todos os aparelhos.</p>
                            {erroLogin && <p className="text-xs text-rose-600">{erroLogin}</p>}
                            <button onClick={async () => { try { setErroLogin(''); await CB.signIn(); } catch (e) { setErroLogin('Erro ao entrar: ' + e.message); } }} className="w-full bg-violet-700 hover:bg-violet-600 text-white py-3 rounded-xl text-sm font-bold shadow">
                                Entrar com Google
                            </button>
                        </div>
                    </div>
                );
            }

            if (erroNuvem) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                        <div className="bg-white rounded-3xl shadow-lg p-8 max-w-sm w-full text-center space-y-4 border border-rose-200">
                            <h1 className="text-lg font-bold text-rose-700">Não foi possível sincronizar</h1>
                            <p className="text-xs text-slate-600">{erroNuvem}</p>
                            {user.email && <p className="text-[11px] text-slate-400">Conectado como {user.email}</p>}
                            <button onClick={() => CB.signOut()} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl text-sm font-bold">Sair e trocar de conta</button>
                            <button onClick={() => window.location.reload()} className="w-full text-xs text-violet-700 font-bold">Tentar novamente</button>
                        </div>
                    </div>
                );
            }

            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 p-6">
                        <div className="w-12 h-12 border-4 border-violet-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p className="text-sm font-bold text-slate-700">Conectando à Central de Compras...</p>
                        <p className="text-xs text-slate-400 mt-1">Sincronizando dados</p>
                    </div>
                );
            }

            const modoLocal = CB.mode === 'local';
            const saudacao = (() => { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; })();

            return (
                <div className="min-h-screen pb-24 md:pb-12 bg-slate-50">
                    {toast && (
                        <div className={`fixed top-4 right-4 z-[60] text-white px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-2 ${toast.tipo === 'erro' ? 'bg-rose-600' : 'bg-violet-700'}`}>
                            <Icon name={toast.tipo === 'erro' ? 'alert-circle' : 'check-circle'} className="w-5 h-5" />
                            <span className="font-medium text-xs sm:text-sm">{toast.msg}</span>
                        </div>
                    )}

                    <header className="bg-gradient-to-r from-violet-800 via-purple-800 to-indigo-900 text-white shadow-lg sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-white/15 p-2.5 rounded-2xl border border-white/20">
                                    <Icon name="shopping-cart" className="w-6 h-6 text-purple-100" />
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <h1 className="text-base sm:text-lg font-bold tracking-tight">Central de Compras</h1>
                                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold ${modoLocal ? 'bg-amber-500/25 text-amber-200' : 'bg-emerald-500/25 text-emerald-200'}`}>
                                            {modoLocal ? '💾 Modo local' : '☁️ Nuvem ativa'}
                                        </span>
                                    </div>
                                    <p className="text-[11px] text-purple-200">Tatico • Pro Brazilian • Assaí • Costa{user.email ? ` • ${user.email}` : ''}</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-2">
                                <button onClick={() => setModalBuscaGlobal(true)} className="bg-white/15 hover:bg-white/25 p-2.5 rounded-xl transition" title="Pesquisa global">
                                    <Icon name="search" className="w-4 h-4" />
                                </button>
                                <button onClick={() => setModalConfig(true)} className="bg-white/15 hover:bg-white/25 p-2.5 rounded-xl transition" title="Configurações e backup">
                                    <Icon name="settings" className="w-4 h-4" />
                                </button>
                                <button onClick={() => setModalCompra(true)} className="bg-white text-violet-800 hover:bg-purple-50 text-xs sm:text-sm px-3.5 py-2 rounded-xl font-bold flex items-center space-x-1.5 shadow-md transition">
                                    <Icon name="plus" className="w-4 h-4" />
                                    <span className="hidden sm:inline">Nova Compra</span>
                                    <span className="sm:hidden">Compra</span>
                                </button>
                                {!modoLocal && (
                                    <button onClick={sair} className="bg-white/15 hover:bg-white/25 p-2.5 rounded-xl transition" title="Sair">
                                        <Icon name="log-out" className="w-4 h-4" />
                                    </button>
                                )}
                            </div>
                        </div>

                        <div className="hidden md:block bg-black/15 border-t border-white/10">
                            <div className="max-w-6xl mx-auto px-4 flex space-x-1 py-1.5 overflow-x-auto no-scrollbar">
                                <DesktopNavBtn ativo={abaAtiva === 'inicio'} onClick={() => setAbaAtiva('inicio')} icon="home" label="Início" />
                                <DesktopNavBtn ativo={abaAtiva === 'produtos'} onClick={() => setAbaAtiva('produtos')} icon="package" label="Produtos" />
                                <DesktopNavBtn ativo={abaAtiva === 'estoque'} onClick={() => setAbaAtiva('estoque')} icon="layers" label="Estoque & Validade" />
                                <DesktopNavBtn ativo={abaAtiva === 'compras'} onClick={() => setAbaAtiva('compras')} icon="shopping-bag" label="Compras" />
                                <DesktopNavBtn ativo={abaAtiva === 'lista'} onClick={() => setAbaAtiva('lista')} icon="list-checks" label="Lista de Compras" badge={pendentesLista} />
                                <DesktopNavBtn ativo={abaAtiva === 'comparativo'} onClick={() => setAbaAtiva('comparativo')} icon="scale" label="Onde Compensa" />
                                <DesktopNavBtn ativo={abaAtiva === 'ofertas'} onClick={() => setAbaAtiva('ofertas')} icon="tag" label="Ofertas" />
                                <DesktopNavBtn ativo={abaAtiva === 'monitor'} onClick={() => setAbaAtiva('monitor')} icon="globe" label="Sites dos mercados" />
                                <DesktopNavBtn ativo={abaAtiva === 'ru'} onClick={() => setAbaAtiva('ru')} icon="utensils" label="Cardápio RU" />
                                <DesktopNavBtn ativo={abaAtiva === 'precos'} onClick={() => setAbaAtiva('precos')} icon="trending-up" label="Preços" />
                                <DesktopNavBtn ativo={abaAtiva === 'gastos'} onClick={() => setAbaAtiva('gastos')} icon="wallet" label="Gastos" />
                                <DesktopNavBtn ativo={abaAtiva === 'relatorios'} onClick={() => setAbaAtiva('relatorios')} icon="bar-chart-3" label="Relatórios" />
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-6">
                        {abaAtiva === 'inicio' && (
                            <Dashboard
                                saudacao={saudacao}
                                produtosComEstoque={produtosComEstoque}
                                itensAbaixoMinimo={itensAbaixoMinimo}
                                metricasGasto={metricasGasto}
                                estimativaProximaSemana={estimativaProximaSemana}
                                ofertas={ofertasEncontradas}
                                pendentesLista={pendentesLista}
                                setAbaAtiva={setAbaAtiva}
                                onNovaCompra={() => setModalCompra(true)}
                                onNovoProduto={() => setModalProduto(true)}
                                onConsumir={(p) => setModalConsumo(p)}
                                onFotoAmpliada={setFotoAmpliada}
                            />
                        )}
                        {abaAtiva === 'produtos' && (
                            <ProdutosView
                                produtosComEstoque={produtosComEstoque}
                                onNovoProduto={() => setModalProduto(true)}
                                onCatalogo={() => setModalCatalogo(true)}
                                onEditarProduto={(p) => setModalProduto(p)}
                                onExcluirProduto={excluirProduto}
                                onFotoAmpliada={setFotoAmpliada}
                            />
                        )}
                        {abaAtiva === 'estoque' && (
                            <EstoqueView
                                produtosComEstoque={produtosComEstoque}
                                onConsumir={(p) => setModalConsumo(p)}
                                onAjusteRapido={ajustarEstoqueRapido}
                                onAdicionarLote={(prodId, qtd, validade, localEstoque) => executar(async () => {
                                    await CB.saveDoc('product_expiration', `lote_${Date.now()}`, {
                                        product_id: prodId, quantity: Number(qtd), expiration_date: validade || '',
                                        local_estoque: localEstoque || 'Itens no armário'
                                    });
                                    mostrarToast('Lote adicionado ao estoque!');
                                })}
                                onAlterarLocalProduto={(prod, novoLocal) => executar(async () => {
                                    await CB.saveDoc('products', prod.id, { local_estoque: novoLocal });
                                    for (const l of prod.lotes) {
                                        await CB.saveDoc('product_expiration', l.id, { local_estoque: novoLocal });
                                    }
                                    mostrarToast(`Movido para ${novoLocal}!`);
                                })}
                                onDescartarVencido={async (lote, prod) => {
                                    if (!confirm(`Descartar ${lote.quantity} ${prod.unit} de ${prod.name}?`)) return;
                                    await executar(async () => {
                                        await CB.removeDoc('product_expiration', lote.id);
                                        await CB.saveDoc('consumption', `desc_${Date.now()}`, {
                                            product_id: prod.id, product_name: prod.name, quantity: Number(lote.quantity),
                                            consumed_at: new Date().toISOString(), notes: 'Descarte por vencimento'
                                        });
                                        mostrarToast('Item vencido descartado.');
                                    });
                                }}
                                onFotoAmpliada={setFotoAmpliada}
                            />
                        )}
                        {abaAtiva === 'compras' && (
                            <ComprasView compras={compras} onNovaCompra={() => setModalCompra(true)} onVerDetalhes={(c) => setModalDetalheCompra(c)} />
                        )}
                        {abaAtiva === 'lista' && (
                            <ListaComprasView
                                listaCompras={listaCompras}
                                produtos={produtos}
                                historicoPrecos={historicoPrecos}
                                itensAbaixoMinimo={itensAbaixoMinimo}
                                onComprar={() => setModalCompra(true)}
                                onComparar={() => setAbaAtiva('comparativo')}
                                executar={executar}
                                mostrarToast={mostrarToast}
                            />
                        )}
                        {abaAtiva === 'comparativo' && (
                            <ComparativoMercadosView
                                listaCompras={listaCompras}
                                produtos={produtos}
                                historicoPrecos={historicoPrecos}
                                ofertasSiteAtivas={ofertasSiteAtivas}
                                establishments={INITIAL_ESTABLISHMENTS}
                                setAbaAtiva={setAbaAtiva}
                                executar={executar}
                                mostrarToast={mostrarToast}
                            />
                        )}
                        {abaAtiva === 'ofertas' && (
                            <OfertasView
                                ofertas={ofertasEncontradas}
                                ofertasSiteAtivas={ofertasSiteAtivas}
                                produtos={produtos}
                                onFotoAmpliada={setFotoAmpliada}
                            />
                        )}
                        <MonitorOfertas
                            visivel={abaAtiva === 'monitor'}
                            produtos={produtos}
                            historicoPrecos={historicoPrecos}
                            onOfertasAtualizadas={setOfertasSiteAtivas}
                            executar={executar}
                            mostrarToast={mostrarToast}
                        />
                        {abaAtiva === 'ru' && <CardapioRUView executar={executar} mostrarToast={mostrarToast} />}
                        {abaAtiva === 'precos' && <PrecosView historicoPrecos={historicoPrecos} />}
                        {abaAtiva === 'gastos' && <GastosView compras={compras} metricasGasto={metricasGasto} estimativaProximaSemana={estimativaProximaSemana} />}
                        {abaAtiva === 'relatorios' && <RelatoriosView produtosComEstoque={produtosComEstoque} consumos={consumos} />}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-1 shadow-lg z-30 md:hidden overflow-x-auto no-scrollbar">
                        <div className="flex justify-around items-center min-w-max px-2 space-x-1">
                            <NavBtn ativo={abaAtiva === 'inicio'} onClick={() => setAbaAtiva('inicio')} icon="home" label="Início" />
                            <NavBtn ativo={abaAtiva === 'produtos'} onClick={() => setAbaAtiva('produtos')} icon="package" label="Produtos" />
                            <NavBtn ativo={abaAtiva === 'estoque'} onClick={() => setAbaAtiva('estoque')} icon="layers" label="Estoque" />
                            <NavBtn ativo={abaAtiva === 'compras'} onClick={() => setAbaAtiva('compras')} icon="shopping-bag" label="Compras" />
                            <NavBtn ativo={abaAtiva === 'lista'} onClick={() => setAbaAtiva('lista')} icon="list-checks" label="Lista" badge={pendentesLista} />
                            <NavBtn ativo={abaAtiva === 'comparativo'} onClick={() => setAbaAtiva('comparativo')} icon="scale" label="Compensa" />
                            <NavBtn ativo={abaAtiva === 'ofertas'} onClick={() => setAbaAtiva('ofertas')} icon="tag" label="Ofertas" />
                            <NavBtn ativo={abaAtiva === 'monitor'} onClick={() => setAbaAtiva('monitor')} icon="globe" label="Sites" />
                            <NavBtn ativo={abaAtiva === 'ru'} onClick={() => setAbaAtiva('ru')} icon="utensils" label="RU" />
                            <NavBtn ativo={abaAtiva === 'precos'} onClick={() => setAbaAtiva('precos')} icon="trending-up" label="Preços" />
                            <NavBtn ativo={abaAtiva === 'gastos'} onClick={() => setAbaAtiva('gastos')} icon="wallet" label="Gastos" />
                            <NavBtn ativo={abaAtiva === 'relatorios'} onClick={() => setAbaAtiva('relatorios')} icon="bar-chart-3" label="Relatórios" />
                        </div>
                    </nav>

                    {modalCompra && (
                        <ModalCompra
                            compraParaEditar={typeof modalCompra === 'object' ? modalCompra : null}
                            produtos={produtos}
                            lotesValidade={lotesValidade}
                            historicoPrecos={historicoPrecos}
                            listaCompras={listaCompras}
                            establishments={INITIAL_ESTABLISHMENTS}
                            onClose={() => setModalCompra(null)}
                            onSalvo={() => {
                                const editando = typeof modalCompra === 'object';
                                setModalCompra(null);
                                mostrarToast(editando ? 'Compra atualizada com sucesso!' : 'Compra salva e estoque atualizado!');
                            }}
                            onNovoProduto={() => setModalProduto(true)}
                            onCatalogo={() => setModalCatalogo(true)}
                            mostrarToast={mostrarToast}
                        />
                    )}

                    {modalConsumo && (
                        <ModalConsumo
                            produto={modalConsumo}
                            baixarDosLotes={baixarDosLotes}
                            onClose={() => setModalConsumo(null)}
                            onSalvo={() => { setModalConsumo(null); mostrarToast('Consumo registrado!'); }}
                            mostrarToast={mostrarToast}
                        />
                    )}

                    {modalDetalheCompra && (
                        <ModalDetalheCompra
                            compra={modalDetalheCompra}
                            onClose={() => setModalDetalheCompra(null)}
                            onExcluir={() => excluirCompra(modalDetalheCompra)}
                            onEditar={(c) => {
                                setModalDetalheCompra(null);
                                setModalCompra(c);
                            }}
                            onFotoAmpliada={setFotoAmpliada}
                        />
                    )}

                    {modalBuscaGlobal && (
                        <ModalBuscaGlobal produtosComEstoque={produtosComEstoque} historicoPrecos={historicoPrecos} onClose={() => setModalBuscaGlobal(false)} />
                    )}

                    {modalConfig && (
                        <ModalConfig
                            user={user}
                            modoLocal={modoLocal}
                            dados={{ produtos, lotesValidade, compras, historicoPrecos, consumos, listaCompras }}
                            onClose={() => setModalConfig(false)}
                            mostrarToast={mostrarToast}
                        />
                    )}

                    {modalProduto !== null && (
                        <ModalProduto
                            produto={typeof modalProduto === 'object' ? modalProduto : null}
                            categories={INITIAL_CATEGORIES}
                            onClose={() => setModalProduto(null)}
                            onSalvo={() => { setModalProduto(null); mostrarToast('Produto salvo!'); }}
                            mostrarToast={mostrarToast}
                        />
                    )}

                    {modalCatalogo && (
                        <ModalCatalogo produtos={produtos} onClose={() => setModalCatalogo(false)} onAdicionar={adicionarDoCatalogo} />
                    )}

                    {fotoAmpliada && (
                        <div onClick={() => setFotoAmpliada(null)} className="fixed inset-0 bg-black/80 flex items-center justify-center z-[70] p-4 cursor-pointer">
                            <div className="max-w-md w-full bg-white p-3 rounded-3xl shadow-2xl">
                                <img src={fotoAmpliada.url} alt={fotoAmpliada.nome} className="w-full h-auto rounded-2xl object-contain max-h-[75vh]" />
                                <p className="text-center text-xs font-bold text-slate-700 mt-2">{fotoAmpliada.nome}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function NavBtn({ ativo, onClick, icon, label, badge }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center relative py-1.5 px-2.5 rounded-xl transition ${ativo ? 'text-violet-700 font-bold' : 'text-slate-400 hover:text-slate-600'}`}>
                    <Icon name={icon} className="w-5 h-5 mb-0.5" />
                    <span className="text-[10px] whitespace-nowrap">{label}</span>
                    {badge > 0 && <span className="absolute top-0 right-1 bg-rose-500 text-white text-[9px] font-bold px-1.5 rounded-full">{badge}</span>}
                </button>
            );
        }

        function DesktopNavBtn({ ativo, onClick, icon, label, badge }) {
            return (
                <button onClick={onClick} className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold transition whitespace-nowrap ${ativo ? 'bg-white text-violet-900 shadow-sm' : 'text-purple-100 hover:bg-white/10'}`}>
                    <Icon name={icon} className="w-3.5 h-3.5" />
                    <span>{label}</span>
                    {badge > 0 && <span className="bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">{badge}</span>}
                </button>
            );
        }

        function Dashboard({ saudacao, produtosComEstoque, itensAbaixoMinimo, metricasGasto, estimativaProximaSemana, ofertas, pendentesLista, setAbaAtiva, onNovaCompra, onNovoProduto, onConsumir, onFotoAmpliada }) {
            const qtdAcabando = itensAbaixoMinimo.filter(p => p.stockTotal > 0).length;
            const qtdAcabados = itensAbaixoMinimo.filter(p => p.stockTotal <= 0).length;
            const lotesProximos = produtosComEstoque.flatMap(p => p.lotes).filter(l => {
                const d = calcularDiasParaVencer(l.expiration_date);
                return d !== null && d <= 7;
            });

            return (
                <div className="space-y-6">
                    <div className="bg-gradient-to-r from-violet-800 via-purple-800 to-indigo-900 text-white p-5 rounded-3xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center space-y-3 md:space-y-0">
                        <div>
                            <h2 className="font-bold text-base flex items-center space-x-2">
                                <Icon name="sparkles" className="w-5 h-5 text-purple-300" />
                                <span>{saudacao}! Resumo da casa</span>
                            </h2>
                            <p className="text-xs text-purple-100 max-w-xl mt-1 leading-relaxed">
                                Você tem <strong className="text-amber-300">{qtdAcabando} acabando</strong>, <strong className="text-rose-300">{qtdAcabados} acabados</strong> e <strong className="text-violet-200">{lotesProximos.length} vencidos ou perto de vencer</strong>.
                            </p>
                        </div>
                        <div className="flex space-x-2 w-full md:w-auto">
                            <button onClick={onNovoProduto} className="flex-1 md:flex-initial bg-white/15 hover:bg-white/25 text-white px-3.5 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5">
                                <Icon name="camera" className="w-4 h-4" />
                                <span>+ Produto</span>
                            </button>
                            <button onClick={onNovaCompra} className="flex-1 md:flex-initial bg-white text-violet-800 hover:bg-purple-50 px-4 py-2.5 rounded-xl text-xs font-bold shadow transition flex items-center justify-center space-x-1.5">
                                <Icon name="plus-circle" className="w-4 h-4" />
                                <span>Nova Compra</span>
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
                        <CardInd titulo="Em estoque" valor={produtosComEstoque.filter(p => p.stockTotal > 0).length} sub={`De ${produtosComEstoque.length} cadastrados`} cor="border-violet-300" icone="package" corIcone="text-violet-600" onClick={() => setAbaAtiva('estoque')} />
                        <CardInd titulo="Acabando" valor={qtdAcabando} sub="Abaixo do mínimo" cor="border-amber-300" icone="alert-triangle" corIcone="text-amber-600" onClick={() => setAbaAtiva('estoque')} />
                        <CardInd titulo="Acabados" valor={qtdAcabados} sub="Estoque zerado" cor="border-rose-300" icone="x-circle" corIcone="text-rose-600" onClick={() => setAbaAtiva('lista')} />
                        <CardInd titulo="Validade" valor={lotesProximos.length} sub="Vencidos ou em até 7d" cor="border-purple-300" icone="clock" corIcone="text-purple-600" onClick={() => setAbaAtiva('estoque')} />
                        <CardInd titulo="Gasto semana" valor={`R$ ${dinheiro(metricasGasto.semana)}`} sub="Últimos 7 dias" cor="border-indigo-300" icone="wallet" corIcone="text-indigo-600" onClick={() => setAbaAtiva('gastos')} />
                        <CardInd titulo="Estimativa próx." valor={estimativaProximaSemana.itensBase > 0 ? `R$ ${dinheiro(estimativaProximaSemana.total)}` : 'Sem dados'} sub={estimativaProximaSemana.itensBase > 0 ? 'Reposição prevista' : 'Registre compras'} cor="border-emerald-300" icone="trending-up" corIcone="text-emerald-600" onClick={() => setAbaAtiva('gastos')} />
                        <CardInd titulo="Ofertas" valor={ofertas.length} sub="Abaixo da média" cor="border-fuchsia-300" icone="tag" corIcone="text-fuchsia-600" onClick={() => setAbaAtiva('ofertas')} />
                        <CardInd titulo="Lista de compras" valor={pendentesLista} sub="Itens pendentes" cor="border-violet-500" icone="list-checks" corIcone="text-violet-700" onClick={() => setAbaAtiva('lista')} />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-sm font-bold text-slate-800 flex items-center space-x-2">
                                    <Icon name="alert-triangle" className="w-4 h-4 text-amber-500" />
                                    <span>Atenção imediata</span>
                                </h3>
                                <button onClick={() => setAbaAtiva('estoque')} className="text-xs text-violet-700 font-bold hover:underline">Ver estoque</button>
                            </div>
                            <div className="space-y-2.5">
                                {itensAbaixoMinimo.slice(0, 4).map(p => (
                                    <div key={p.id} className="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-100">
                                        <div className="flex items-center space-x-3 min-w-0">
                                            {p.image_url ? (
                                                <img onClick={() => onFotoAmpliada({ url: p.image_url, nome: p.name })} src={p.image_url} alt="" className="w-10 h-10 object-cover rounded-xl cursor-pointer border" />
                                            ) : (
                                                <div className="w-10 h-10 bg-violet-100 text-violet-700 rounded-xl flex items-center justify-center text-xs">📦</div>
                                            )}
                                            <div className="min-w-0">
                                                <p className="text-xs font-bold text-slate-800 truncate">{p.name}</p>
                                                <p className="text-[10px] text-slate-500">Atual: <strong className={p.stockTotal <= 0 ? 'text-rose-600' : 'text-amber-600'}>{p.stockTotal} {p.unit}</strong> (mín: {p.minimum_stock})</p>
                                            </div>
                                        </div>
                                        {p.stockTotal > 0 ? (
                                            <button onClick={() => onConsumir(p)} className="bg-white border text-xs px-3 py-1.5 rounded-xl font-semibold text-slate-700 hover:bg-slate-50">Consumir</button>
                                        ) : (
                                            <span className="text-[10px] font-bold bg-rose-100 text-rose-700 px-2.5 py-1 rounded-full whitespace-nowrap">🔴 Acabou</span>
                                        )}
                                    </div>
                                ))}
                                {itensAbaixoMinimo.length === 0 && <p className="text-xs text-slate-400 py-4 text-center">Nenhum item abaixo do mínimo! 🟢</p>}
                            </div>
                        </div>

                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="text-sm font-bold text-slate-800 flex items-center space-x-2">
                                    <Icon name="tag" className="w-4 h-4 text-fuchsia-600" />
                                    <span>Melhores ofertas</span>
                                </h3>
                                <button onClick={() => setAbaAtiva('ofertas')} className="text-xs text-violet-700 font-bold hover:underline">Ver todas</button>
                            </div>
                            <div className="space-y-2.5">
                                {ofertas.slice(0, 4).map(o => (
                                    <div key={o.id} className="flex items-center justify-between p-3 rounded-2xl bg-fuchsia-50/50 border border-fuchsia-100">
                                        <div>
                                            <p className="text-xs font-bold text-slate-800">{o.name}</p>
                                            <p className="text-[10px] text-slate-500">{o.estabelecimento} — média: <span className="line-through">R$ {dinheiro(o.media)}</span></p>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-xs font-bold text-violet-700">R$ {dinheiro(o.precoAtual)}</span>
                                            <span className="block text-[10px] bg-fuchsia-100 text-fuchsia-800 font-bold px-1.5 py-0.5 rounded-full">-{o.desconto.toFixed(0)}%</span>
                                        </div>
                                    </div>
                                ))}
                                {ofertas.length === 0 && <p className="text-xs text-slate-400 py-4 text-center">Registre 2 ou mais compras do mesmo item para detectar quedas de preço.</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CardInd({ titulo, valor, sub, cor, icone, corIcone, onClick }) {
            return (
                <div onClick={onClick} className={`bg-white rounded-3xl p-4 shadow-sm border-2 ${cor} cursor-pointer hover:shadow-md transition flex flex-col justify-between`}>
                    <div className="flex justify-between items-start mb-2">
                        <span className="text-xs font-semibold text-slate-500">{titulo}</span>
                        <div className={`p-2 rounded-xl bg-slate-50 ${corIcone}`}><Icon name={icone} className="w-4 h-4" /></div>
                    </div>
                    <div>
                        <h4 className="text-base sm:text-lg font-bold text-slate-800">{valor}</h4>
                        <p className="text-[10px] text-slate-400 mt-0.5">{sub}</p>
                    </div>
                </div>
            );
        }

        function ProdutosView({ produtosComEstoque, onNovoProduto, onCatalogo, onEditarProduto, onExcluirProduto, onFotoAmpliada }) {
            const [busca, setBusca] = useState('');
            const [catFiltro, setCatFiltro] = useState('Todas');

            const filtrados = produtosComEstoque.filter(p => {
                const b = normalizar(busca);
                const matchBusca = normalizar(p.name).includes(b) || normalizar(p.brand).includes(b);
                return matchBusca && (catFiltro === 'Todas' || p.category === catFiltro);
            });

            return (
                <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                        <div>
                            <h2 className="text-lg font-bold text-slate-800">📦 Produtos da casa</h2>
                            <p className="text-xs text-slate-500">Cadastre produtos com foto ou use o catálogo de itens básicos.</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={onCatalogo} className="bg-violet-100 hover:bg-violet-200 text-violet-800 text-xs font-bold px-4 py-2.5 rounded-xl transition">📋 Catálogo básico</button>
                            <button onClick={onNovoProduto} className="bg-violet-700 hover:bg-violet-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow transition flex items-center space-x-1.5">
                                <Icon name="camera" className="w-4 h-4" />
                                <span>+ Produto</span>
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-col sm:flex-row gap-3">
                        <div className="relative flex-1">
                            <span className="text-slate-400 absolute left-3.5 top-3"><Icon name="search" className="w-4 h-4" /></span>
                            <input type="text" placeholder="Buscar por nome ou marca..." value={busca} onChange={e => setBusca(e.target.value)} className="w-full bg-white border rounded-2xl pl-10 pr-4 py-2.5 text-xs shadow-sm" />
                        </div>
                        <select value={catFiltro} onChange={e => setCatFiltro(e.target.value)} className="bg-white border rounded-2xl px-4 py-2.5 text-xs font-medium shadow-sm">
                            <option value="Todas">Todas as categorias</option>
                            {INITIAL_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filtrados.map(p => {
                            const locInfo = LOCAIS_ESTOQUE.find(x => x.id === obterLocalEstoque(p, null)) || LOCAIS_ESTOQUE[1];
                            return (
                                <div key={p.id} className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between">
                                    <div className="flex items-start space-x-4 mb-4">
                                        {p.image_url ? (
                                            <img onClick={() => onFotoAmpliada({ url: p.image_url, nome: p.name })} src={p.image_url} alt={p.name} className="w-16 h-16 object-cover rounded-2xl border cursor-pointer hover:opacity-90" />
                                        ) : (
                                            <div className="w-16 h-16 bg-violet-50 text-violet-600 rounded-2xl flex items-center justify-center border border-violet-100">
                                                <Icon name="package" className="w-7 h-7" />
                                            </div>
                                        )}
                                        <div className="flex-1 min-w-0">
                                            <div className="flex flex-wrap gap-1 items-center">
                                                <span className="text-[10px] font-bold uppercase bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md">{p.category}</span>
                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md border ${locInfo.badgeCls}`}>{locInfo.icon} {locInfo.label.replace('Itens ', '')}</span>
                                            </div>
                                            <h4 className="text-sm font-bold text-slate-800 mt-1 truncate">{p.name}</h4>
                                            <p className="text-[11px] text-slate-500">
                                                {p.brand ? `${p.brand} • ` : ''}
                                                Mín: {p.minimum_stock} {p.unit}
                                                {Number(p.default_price) > 0 ? ` • Padrão: R$ ${dinheiro(p.default_price)}` : ''}
                                            </p>
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 p-3 rounded-2xl flex justify-between items-center mb-3">
                                        <span className="text-xs text-slate-500">Estoque atual:</span>
                                        <span className={`text-sm font-bold ${p.stockTotal <= 0 ? 'text-rose-600' : p.stockTotal <= p.minimum_stock ? 'text-amber-600' : 'text-emerald-700'}`}>{p.stockTotal} {p.unit}</span>
                                    </div>
                                    <div className="flex space-x-2 pt-2 border-t">
                                        <button onClick={() => onEditarProduto(p)} className="flex-1 text-xs text-violet-700 font-bold py-1.5 bg-violet-50 rounded-xl hover:bg-violet-100">Editar / Foto</button>
                                        <button onClick={() => onExcluirProduto(p)} className="px-3 text-xs text-rose-600 font-bold py-1.5 bg-rose-50 rounded-xl hover:bg-rose-100">Excluir</button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {filtrados.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhum produto encontrado.</p>}
                </div>
            );
        }

        function EstoqueView({ produtosComEstoque, onConsumir, onAjusteRapido, onAdicionarLote, onAlterarLocalProduto, onDescartarVencido, onFotoAmpliada }) {
            const [abaLocal, setAbaLocal] = useState('geral');
            const [filtro, setFiltro] = useState('todos');
            const [modalLoteProd, setModalLoteProd] = useState(null);
            const [qtdLote, setQtdLote] = useState(1);
            const [validadeLote, setValidadeLote] = useState('');
            const [localLote, setLocalLote] = useState('Itens no armário');

            const contagensLocais = useMemo(() => {
                const map = { geral: produtosComEstoque.length };
                LOCAIS_ESTOQUE.forEach(loc => {
                    map[loc.id] = produtosComEstoque.filter(p =>
                        obterLocalEstoque(p, null) === loc.id || p.lotes.some(l => obterLocalEstoque(p, l) === loc.id)
                    ).length;
                });
                return map;
            }, [produtosComEstoque]);

            const filtrados = produtosComEstoque.filter(p => {
                if (abaLocal !== 'geral') {
                    const pertenceLocal = obterLocalEstoque(p, null) === abaLocal || p.lotes.some(l => obterLocalEstoque(p, l) === abaLocal);
                    if (!pertenceLocal) return false;
                }
                if (filtro === 'acabando') return p.stockTotal > 0 && p.stockTotal <= p.minimum_stock;
                if (filtro === 'acabou') return p.stockTotal <= 0;
                if (filtro === 'vencendo') return p.lotes.some(l => { const d = calcularDiasParaVencer(l.expiration_date); return d !== null && d <= 7; });
                return true;
            });

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-4">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h2 className="text-lg font-bold text-slate-800">📦 Estoque & validade</h2>
                                <p className="text-xs text-slate-500">Alterne entre o Estoque Geral e os agrupamentos por local. Sai primeiro o que vence antes.</p>
                            </div>
                            <div className="flex flex-wrap gap-1.5">
                                <button onClick={() => setFiltro('todos')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${filtro === 'todos' ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>Todos</button>
                                <button onClick={() => setFiltro('acabando')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${filtro === 'acabando' ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600'}`}>🟡 Acabando</button>
                                <button onClick={() => setFiltro('acabou')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${filtro === 'acabou' ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600'}`}>🔴 Acabou</button>
                                <button onClick={() => setFiltro('vencendo')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${filtro === 'vencendo' ? 'bg-purple-700 text-white' : 'bg-slate-100 text-slate-600'}`}>⏰ Validade</button>
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-2 pt-3 border-t border-slate-100">
                            <button
                                onClick={() => setAbaLocal('geral')}
                                className={`px-3.5 py-2 rounded-2xl text-xs font-bold border transition ${abaLocal === 'geral' ? 'bg-violet-700 text-white border-violet-700 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}
                            >
                                📦 Estoque Geral ({contagensLocais.geral || 0})
                            </button>
                            {LOCAIS_ESTOQUE.map(loc => (
                                <button
                                    key={loc.id}
                                    onClick={() => setAbaLocal(loc.id)}
                                    className={`px-3.5 py-2 rounded-2xl text-xs font-bold border transition ${abaLocal === loc.id ? 'bg-violet-700 text-white border-violet-700 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}
                                >
                                    {loc.icon} {loc.label} ({contagensLocais[loc.id] || 0})
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {filtrados.map(p => {
                            const statusBadge = p.stockTotal <= 0
                                ? { text: '🔴 ACABOU', cls: 'bg-rose-100 text-rose-700' }
                                : p.stockTotal <= p.minimum_stock
                                ? { text: '🟡 ESTÁ ACABANDO', cls: 'bg-amber-100 text-amber-800' }
                                : { text: '🟢 NORMAL', cls: 'bg-emerald-100 text-emerald-700' };
                            const localProd = obterLocalEstoque(p, null);
                            const locInfo = LOCAIS_ESTOQUE.find(x => x.id === localProd) || LOCAIS_ESTOQUE[1];

                            return (
                                <div key={p.id} className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 flex flex-col justify-between">
                                    <div>
                                        <div className="flex justify-between items-start mb-3 gap-2">
                                            <div className="flex items-center space-x-3">
                                                {p.image_url && <img onClick={() => onFotoAmpliada({ url: p.image_url, nome: p.name })} src={p.image_url} alt="" className="w-11 h-11 object-cover rounded-xl border cursor-pointer" />}
                                                <div>
                                                    <h4 className="text-sm font-bold text-slate-800">{p.name}</h4>
                                                    <div className="flex flex-wrap items-center gap-1.5 mt-1">
                                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${statusBadge.cls}`}>{statusBadge.text}</span>
                                                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${locInfo.badgeCls}`}>{locInfo.icon} {locInfo.label}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="text-right shrink-0">
                                                <span className="text-sm font-bold text-violet-800">{p.stockTotal} {p.unit}</span>
                                                <p className="text-[10px] text-slate-400">Mín: {p.minimum_stock}</p>
                                            </div>
                                        </div>

                                        <div className="flex items-center justify-between gap-2 mb-3 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100">
                                            <span className="text-[10px] font-semibold text-slate-500">Guardado em:</span>
                                            <select
                                                value={localProd}
                                                onChange={e => onAlterarLocalProduto(p, e.target.value)}
                                                className="text-[11px] font-bold text-violet-800 bg-transparent border-none focus:outline-none cursor-pointer"
                                            >
                                                {LOCAIS_ESTOQUE.map(loc => <option key={loc.id} value={loc.id}>{loc.icon} {loc.label}</option>)}
                                            </select>
                                        </div>

                                        <div className="space-y-1.5 mb-4">
                                            {p.lotes.map(l => {
                                                const dias = calcularDiasParaVencer(l.expiration_date);
                                                const vencido = dias !== null && dias < 0;
                                                const localLoteAtual = obterLocalEstoque(p, l);
                                                return (
                                                    <div key={l.id} className="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl text-xs gap-2">
                                                        <div>
                                                            <span className="font-semibold text-slate-700">{l.quantity} {p.unit}</span>
                                                            <span className="text-[10px] text-slate-500 ml-2">Val: {l.expiration_date || 'sem data'}</span>
                                                            {localLoteAtual !== localProd && (
                                                                <span className="text-[10px] text-violet-700 font-semibold ml-2">• {localLoteAtual}</span>
                                                            )}
                                                        </div>
                                                        <div className="flex items-center space-x-2">
                                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${vencido ? 'bg-slate-800 text-white' : dias !== null && dias <= 6 ? 'bg-rose-100 text-rose-700' : dias !== null && dias <= 14 ? 'bg-orange-100 text-orange-700' : 'bg-emerald-100 text-emerald-700'}`}>
                                                                {dias !== null ? (vencido ? `⚫ Vencido (${Math.abs(dias)}d)` : `${dias}d`) : '🟢 OK'}
                                                            </span>
                                                            {vencido && <button onClick={() => onDescartarVencido(l, p)} className="text-[10px] bg-rose-600 text-white px-2 py-0.5 rounded-lg font-bold">Descartar</button>}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                            {p.lotes.length === 0 && <p className="text-xs text-slate-400 py-1">Nenhum lote em estoque.</p>}
                                        </div>
                                    </div>

                                    <div className="flex items-center space-x-2 pt-2 border-t">
                                        <button onClick={() => onAjusteRapido(p, -1)} disabled={p.stockTotal < 1} className="bg-rose-50 hover:bg-rose-100 disabled:opacity-40 text-rose-700 px-3 py-2 rounded-xl text-xs font-bold">-1</button>
                                        <button onClick={() => onAjusteRapido(p, 1)} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-2 rounded-xl text-xs font-bold">+1</button>
                                        <button onClick={() => onConsumir(p)} disabled={p.stockTotal <= 0} className="flex-1 bg-violet-700 hover:bg-violet-600 disabled:opacity-40 text-white py-2 rounded-xl text-xs font-bold">Consumir</button>
                                        <button onClick={() => { setQtdLote(1); setValidadeLote(''); setLocalLote(obterLocalEstoque(p, null)); setModalLoteProd(p); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold">+ Lote</button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {filtrados.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhum item neste agrupamento ou filtro.</p>}

                    {modalLoteProd && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4">
                                <h3 className="text-base font-bold text-slate-800">+ Lote: {modalLoteProd.name}</h3>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Quantidade ({modalLoteProd.unit}):</label>
                                    <input type="number" step="0.01" min="0.01" value={qtdLote} onChange={e => setQtdLote(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Local de armazenamento:</label>
                                    <select value={localLote} onChange={e => setLocalLote(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs bg-white">
                                        {LOCAIS_ESTOQUE.map(loc => <option key={loc.id} value={loc.id}>{loc.icon} {loc.label}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Data de validade (opcional):</label>
                                    <input type="date" value={validadeLote} onChange={e => setValidadeLote(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                                </div>
                                <div className="flex justify-end space-x-2 pt-2">
                                    <button onClick={() => setModalLoteProd(null)} className="px-4 py-2 text-xs text-slate-600">Cancelar</button>
                                    <button onClick={() => {
                                        if (!(Number(qtdLote) > 0)) return;
                                        onAdicionarLote(modalLoteProd.id, qtdLote, validadeLote, localLote);
                                        setModalLoteProd(null);
                                    }} className="bg-violet-700 text-white px-4 py-2 rounded-xl text-xs font-bold">Salvar lote</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ComprasView({ compras, onNovaCompra, onVerDetalhes }) {
            return (
