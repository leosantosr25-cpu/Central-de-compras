            var cloudOk = !!firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('COLE') !== 0;
            var limpar = function (obj) { return JSON.parse(JSON.stringify(obj)); };

            if (cloudOk) {
                try {
                    firebase.initializeApp(firebaseConfig);
                    var auth = firebase.auth();
                    var db = firebase.firestore();
                    var col = function (nome) { return db.collection('casas').doc('familia').collection(nome); };

                    window.CloudBackend = {
                        mode: 'nuvem',
                        onAuthChange: function (cb) { return auth.onAuthStateChanged(cb); },
                        signIn: async function () {
                            var provider = new firebase.auth.GoogleAuthProvider();
                            try {
                                await auth.signInWithPopup(provider);
                            } catch (e) {
                                if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
                                    return auth.signInWithRedirect(provider);
                                }
                                if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') throw e;
                            }
                        },
                        signOut: function () { return auth.signOut(); },
                        subscribeCollection: function (nome, onData, onErr) {
                            return col(nome).onSnapshot(function (snap) {
                                onData(snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }));
                            }, onErr);
                        },
                        saveDoc: function (nome, id, data) { return col(nome).doc(String(id)).set(limpar(data), { merge: true }); },
                        removeDoc: function (nome, id) { return col(nome).doc(String(id)).delete(); },
                        batchOps: async function (ops) {
                            var lista = ops || [];
                            for (var i = 0; i < lista.length; i += 450) {
                                var batch = db.batch();
                                lista.slice(i, i + 450).forEach(function (op) {
                                    var ref = col(op.col).doc(String(op.id));
                                    if (op.type === 'delete') batch.delete(ref);
                                    else batch.set(ref, limpar(op.data), { merge: true });
                                });
                                await batch.commit();
                            }
                        }
                    };
                } catch (e) {
                    console.error('Erro ao iniciar o Firebase', e);
                    cloudOk = false;
                }
            }

            if (!cloudOk) {
                var listeners = {};
                var ler = function (nome) { try { return JSON.parse(localStorage.getItem('cc2_' + nome) || '{}'); } catch (e) { return {}; } };
                var gravar = function (nome, obj) {
                    try { localStorage.setItem('cc2_' + nome, JSON.stringify(obj)); }
                    catch (e) { alert('Armazenamento do navegador cheio. Remova fotos ou exporte um backup.'); }
                };
                var lista = function (nome) {
                    var o = ler(nome);
                    return Object.keys(o).map(function (id) { return Object.assign({ id: id }, o[id]); });
                };
                var emitir = function (nome) {
                    (listeners[nome] || []).forEach(function (fn) { fn(lista(nome)); });
                };
                window.addEventListener('storage', function (e) {
                    if (e.key && e.key.indexOf('cc2_') === 0) emitir(e.key.replace('cc2_', ''));
                });

                window.CloudBackend = {
                    mode: 'local',
                    onAuthChange: function (cb) { setTimeout(function () { cb({ uid: 'local', email: '' }); }, 0); return function () {}; },
                    signIn: async function () {},
                    signOut: async function () {},
                    subscribeCollection: function (nome, onData) {
                        listeners[nome] = listeners[nome] || [];
                        listeners[nome].push(onData);
                        setTimeout(function () { onData(lista(nome)); }, 0);
                        return function () { listeners[nome] = listeners[nome].filter(function (f) { return f !== onData; }); };
                    },
                    saveDoc: async function (nome, id, data) {
                        var o = ler(nome);
                        o[String(id)] = Object.assign({}, o[String(id)] || {}, limpar(data));
                        gravar(nome, o);
                        emitir(nome);
                    },
                    removeDoc: async function (nome, id) {
                        var o = ler(nome);
                        delete o[String(id)];
                        gravar(nome, o);
                        emitir(nome);
                    },
                    batchOps: async function (ops) {
                        var cols = {};
                        (ops || []).forEach(function (op) {
                            var o = ler(op.col);
                            if (op.type === 'delete') delete o[String(op.id)];
                            else o[String(op.id)] = Object.assign({}, o[String(op.id)] || {}, limpar(op.data));
                            gravar(op.col, o);
                            cols[op.col] = true;
                        });
                        Object.keys(cols).forEach(emitir);
                    }
                };
            }
        })();
    </script>

        function comprimirImagem(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = event.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function calcularDiasParaVencer(dataStr) {
            if (!dataStr) return null;
            const [ano, mes, dia] = dataStr.split('-').map(Number);
            if (!ano || !mes || !dia) return null;
            const dataVal = new Date(ano, mes - 1, dia);
            const agora = new Date();
            const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
            return Math.round((dataVal - hoje) / (1000 * 60 * 60 * 24));
        }

        function gerarOpsBaixaLotes(prod, qtd) {
            let restante = Number(qtd) || 0;
            const ops = [];
            const ordenados = [...(prod.lotes || [])].sort((a, b) => (a.expiration_date || '9999').localeCompare(b.expiration_date || '9999'));
            for (const lote of ordenados) {
                if (restante <= 0) break;
                const q = Number(lote.quantity);
                if (q <= restante) {
                    restante = Number((restante - q).toFixed(3));
                    ops.push({ type: 'delete', col: 'product_expiration', id: lote.id });
                } else {
                    ops.push({ type: 'set', col: 'product_expiration', id: lote.id, data: { quantity: Number((q - restante).toFixed(3)) } });
                    restante = 0;
                }
            }
            return ops;
        }

        function calcularPrecoNormalizado(nome, preco, pesoPorUnidadeG, unit) {
            const p = Number(preco);
            if (!(p > 0)) return null;
            const m = String(nome || '').match(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l)\b/i);
            let gramasOuMl = 0;
            let tipo = 'kg';
            if (m) {
                const num = parseFloat(m[1].replace(',', '.'));
                const un = m[2].toLowerCase();
                if (un === 'kg') { gramasOuMl = num * 1000; tipo = 'kg'; }
                else if (un === 'g') { gramasOuMl = num; tipo = 'kg'; }
                else if (un === 'l') { gramasOuMl = num * 1000; tipo = 'L'; }
                else if (un === 'ml') { gramasOuMl = num; tipo = 'L'; }
            } else if (Number(pesoPorUnidadeG) > 0) {
                gramasOuMl = Number(pesoPorUnidadeG);
                const uNorm = normalizar(unit || '');
                tipo = (uNorm === 'l' || uNorm === 'litro' || uNorm === 'litros' || uNorm === 'ml') ? 'L' : 'kg';
            }
            if (!(gramasOuMl > 0)) return null;
            const valorPorUnidadeBase = p / (gramasOuMl / 1000);
            return { valor: valorPorUnidadeBase, unidade: tipo, texto: `R$ ${dinheiro(valorPorUnidadeBase)}/${tipo}` };
        }

        async function chamarGeminiJSON(apiKey, parts, opts = {}) {
            const chave = (apiKey || localStorage.getItem('gemini_api_key') || '').trim();
            if (!chave) throw new Error('Chave GEMINI_API_KEY não configurada nas Configurações.');
            const modelos = ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-3.8-flash', 'gemini-3.5-flash-lite'];
            let ultimoErro = null;
            for (const mod of modelos) {
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${mod}:generateContent?key=${encodeURIComponent(chave)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts }],
                            generationConfig: {
                                temperature: opts.temperature !== undefined ? opts.temperature : 0.1,
                                responseMimeType: 'application/json'
                            }
                        })
                    });
                    if (!res.ok) {
                        const txtErr = await res.text().catch(() => '');
                        throw new Error(`HTTP ${res.status}${txtErr ? ': ' + txtErr.slice(0, 120) : ''}`);
                    }
                    const dados = await res.json();
                    const textoIA = (dados?.candidates?.[0]?.content?.parts?.[0]?.text || '').trim();
                    if (!textoIA) throw new Error('Resposta vazia da IA');
                    const limpo = textoIA.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```$/g, '').trim();
                    return JSON.parse(limpo);
                } catch (err) {
                    console.warn(`Falha Gemini (${mod}):`, err);
                    ultimoErro = err;
                }
            }
            throw ultimoErro || new Error('Não foi possível obter resposta da Gemini API.');
        }

        const MONITOR_STOP = new Set(['de', 'da', 'do', 'com', 'sem', 'para', 'em', 'e', 'a', 'o', 'un', 'und', 'unidade', 'pacote', 'pct', 'kg', 'g', 'l', 'ml', 'lata', 'caixa']);
        function tokensNome(s) {
            return normalizar(s)
                .replace(/(\d)\s+(kg|g|ml|l)\b/g, '$1$2')
                .split(/[^a-z0-9]+/)
                .filter(t => t && !MONITOR_STOP.has(t));
        }

        function acharProdutoDaOferta(nomeOferta, produtos) {
            const tOf = tokensNome(nomeOferta);
            const setOf = new Set(tOf);
            let melhor = null, melhorN = 0;
            for (const p of produtos) {
                const tp = tokensNome(p.name);
                if (tp.length === 0 || !tp.every(t => setOf.has(t))) continue;
                if (tp.length / Math.max(tOf.length, 1) < 0.4) continue;
                if (tp.length > melhorN) { melhor = p; melhorN = tp.length; }
            }
            return melhor;
        }

        function ehOfertaVigente(item) {
            if (!item) return false;
            if (item.expired) return false;
            const hoje = hojeISO();
            if (item.validade && /^\d{4}-\d{2}-\d{2}$/.test(item.validade) && item.validade < hoje) return false;
            const dataRef = item.data || item.date;
            if (dataRef) {
                const d = calcularDiasParaVencer(dataRef);
                if (d !== null && d < -7) return false;
            }
            return true;
        }

                return manuais + sugeridosNovos;

            const metricasGasto = useMemo(() => {
                const agora = new Date();
                const hojeZero = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
                const inicioSemana = new Date(hojeZero);
                inicioSemana.setDate(hojeZero.getDate() - 6);
                let semana = 0, mes = 0;
                compras.forEach(c => {
                    if (!c.purchase_date) return;
                    const [y, m, d] = c.purchase_date.split('-').map(Number);
                    const dt = new Date(y, m - 1, d);
                    const val = Number(c.total || 0);
                    if (dt >= inicioSemana && dt <= agora) semana += val;
                    if (dt.getMonth() === agora.getMonth() && dt.getFullYear() === agora.getFullYear()) mes += val;
                });
                return { semana, mes };
            }, [compras]);

            const ofertasEncontradas = useMemo(() => {
                return produtos.map(p => {
                    const histValido = historicoPrecos.filter(h => h.product_id === p.id && Number(h.price) > 0 && (!h.from_site || ehOfertaVigente(h)));
                    const histTodos = historicoPrecos.filter(h => h.product_id === p.id && Number(h.price) > 0);
                    if (histValido.length === 0 || histTodos.length < 2) return null;
                    const precos = histTodos.map(h => Number(h.price));
                    const media = precos.reduce((a, b) => a + b, 0) / precos.length;
                    const menor = Math.min(...precos);
                    const atualReg = histValido[0];
                    const precoAtual = Number(atualReg.price);
                    if (precoAtual < media) {
                        const estabelecimento = atualReg.source || 'Supermercado';
                        return {
                            ...p,
                            brand: atualReg.brand || p.brand || '',
                            precoAtual, media, menor,
                            desconto: ((media - precoAtual) / media) * 100,
                            economia: media - precoAtual,
                            estabelecimento,
                            dataPreco: atualReg.date,
                            link: atualReg.link || LINKS_MERCADOS[estabelecimento] || ''

                    mostrarToast(`${itens.length} produto(s) adicionado(s)!`);
                    setModalCatalogo(false);
                }, 'Erro ao adicionar itens do catálogo.');
            };

            const sair = () => { if (confirm('Sair da sua conta neste aparelho?')) CB.signOut(); };

            if (!authPronto) return <div className="min-h-screen flex items-center justify-center text-xs font-medium text-slate-500">Carregando aplicação...</div>;

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                        <div className="bg-white rounded-2xl shadow-sm p-8 max-w-sm w-full text-center space-y-4 border border-slate-200">
                            <div className="mx-auto bg-slate-900 text-white w-12 h-12 rounded-xl flex items-center justify-center">
                                <Icon name="shopping-bag" className="w-6 h-6" />
                            </div>
                            <div>
                                <h1 className="text-base font-bold text-slate-900">Central de Compras</h1>
                                <p className="text-xs text-slate-500 mt-1">Acesse sua conta para sincronizar estoque, listas e ofertas.</p>
                            </div>
                            {erroLogin && <p className="text-xs text-rose-600 bg-rose-50 p-2 rounded-lg border border-rose-100">{erroLogin}</p>}
                            <button onClick={async () => { try { setErroLogin(''); await CB.signIn(); } catch (e) { setErroLogin('Erro ao entrar: ' + e.message); } }} className="w-full bg-slate-900 hover:bg-slate-800 text-white py-2.5 rounded-xl text-xs font-semibold shadow-sm transition">
                                Entrar com Google
                            </button>
                        </div>
                    </div>
                );
            }

            if (erroNuvem) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-50">
                        <div className="bg-white rounded-2xl shadow-sm p-8 max-w-sm w-full text-center space-y-4 border border-rose-200">
                            <h1 className="text-base font-bold text-rose-700">Erro de Sincronização</h1>
                            <p className="text-xs text-slate-600">{erroNuvem}</p>
                            {user.email && <p className="text-[11px] text-slate-400">Conectado como {user.email}</p>}
                            <div className="space-y-2 pt-2">
                                <button onClick={() => CB.signOut()} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-xs font-medium transition">Trocar de conta</button>
                                <button onClick={() => window.location.reload()} className="w-full text-xs text-slate-900 font-semibold hover:underline">Tentar novamente</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 p-6">
                        <div className="w-8 h-8 border-2 border-slate-900 border-t-transparent rounded-full animate-spin mb-3"></div>
                        <p className="text-xs font-semibold text-slate-700">Carregando dados da casa...</p>
                    </div>
                );
            }

            const modoLocal = CB.mode === 'local';
            const saudacao = (() => { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; })();

            return (
                <div className="min-h-screen pb-24 md:pb-12 bg-slate-50">
                    {toast && (
                        <div className={`fixed top-4 right-4 z-[60] text-white px-4 py-2.5 rounded-xl shadow-lg flex items-center space-x-2 text-xs font-medium transition-all ${toast.tipo === 'erro' ? 'bg-rose-600' : 'bg-slate-900'}`}>
                            <Icon name={toast.tipo === 'erro' ? 'alert-circle' : 'check-circle'} className="w-4 h-4" />
                            <span>{toast.msg}</span>
                        </div>
                    )}

                    {/* Header Minimalista (Linear style) */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-3">
                                <div className="bg-slate-900 text-white p-2 rounded-xl">
                                    <Icon name="shopping-bag" className="w-5 h-5" />
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <h1 className="text-sm sm:text-base font-semibold tracking-tight text-slate-900">Central de Compras</h1>
                                        <span className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${modoLocal ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200'}`}>
                                            {modoLocal ? 'Local' : 'Online'}
                                        </span>
                                    </div>
                                    <p className="text-[11px] text-slate-400">Tatico • Pro Brazilian • Assaí • Costa{user.email ? ` • ${user.email}` : ''}</p>
                                </div>
                            </div>
                            <div className="flex items-center space-x-2">
                                <button onClick={() => setModalBuscaGlobal(true)} className="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition" title="Pesquisar">
                                    <Icon name="search" className="w-4 h-4" />
                                </button>
                                <button onClick={() => setModalConfig(true)} className="p-2 text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition" title="Configurações">
                                    <Icon name="settings" className="w-4 h-4" />
                                </button>
                                <button onClick={() => setModalCompra(true)} className="bg-slate-900 hover:bg-slate-800 text-white text-xs px-3.5 py-2 rounded-lg font-medium flex items-center space-x-1.5 shadow-sm transition">
                                    <Icon name="plus" className="w-3.5 h-3.5" />
                                    <span>Nova Compra</span>
                                </button>
                                {!modoLocal && (
                                    <button onClick={sair} className="p-2 text-slate-400 hover:text-rose-600 hover:bg-slate-100 rounded-lg transition" title="Sair">
                                        <Icon name="log-out" className="w-4 h-4" />
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Navegação Desktop */}
                        <div className="hidden md:block bg-slate-50 border-t border-slate-100">
                            <div className="max-w-6xl mx-auto px-4 flex space-x-1 py-1.5 overflow-x-auto no-scrollbar">
                                <DesktopNavBtn ativo={abaAtiva === 'inicio'} onClick={() => setAbaAtiva('inicio')} icon="home" label="Início" />
                                <DesktopNavBtn ativo={abaAtiva === 'estoque'} onClick={() => setAbaAtiva('estoque')} icon="layers" label="Estoque" />
                                <DesktopNavBtn ativo={abaAtiva === 'compras'} onClick={() => setAbaAtiva('compras')} icon="shopping-bag" label="Compras" />
                                <DesktopNavBtn ativo={abaAtiva === 'lista'} onClick={() => setAbaAtiva('lista')} icon="list-checks" label="Lista de Compras" badge={pendentesLista} />
                                <DesktopNavBtn ativo={abaAtiva === 'comparativo'} onClick={() => setAbaAtiva('comparativo')} icon="scale" label="Onde Compensa" />
                                <DesktopNavBtn ativo={abaAtiva === 'receitas'} onClick={() => setAbaAtiva('receitas')} icon="chef-hat" label="Receitas" />
                                <DesktopNavBtn ativo={abaAtiva === 'ofertas'} onClick={() => setAbaAtiva('ofertas')} icon="tag" label="Ofertas" />
                                <DesktopNavBtn ativo={abaAtiva === 'monitor'} onClick={() => setAbaAtiva('monitor')} icon="globe" label="Encartes" />
                                <DesktopNavBtn ativo={abaAtiva === 'ru'} onClick={() => setAbaAtiva('ru')} icon="utensils" label="Cardápio RU" />
                                <DesktopNavBtn ativo={abaAtiva === 'precos'} onClick={() => setAbaAtiva('precos')} icon="trending-up" label="Preços" />
                                <DesktopNavBtn ativo={abaAtiva === 'gastos'} onClick={() => setAbaAtiva('gastos')} icon="wallet" label="Gastos" />
                                <DesktopNavBtn ativo={abaAtiva === 'relatorios'} onClick={() => setAbaAtiva('relatorios')} icon="bar-chart-3" label="Relatórios" />
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 py-6">
                        {abaAtiva === 'inicio' && (
                            <Dashboard
                                saudacao={saudacao}
                                produtosComEstoque={produtosComEstoque}
                                itensAbaixoMinimo={itensAbaixoMinimo}
                                metricasGasto={metricasGasto}
                                estimativaProximaSemana={estimativaProximaSemana}
                                ofertas={ofertasEncontradas}
                                pendentesLista={pendentesLista}
                                setAbaAtiva={setAbaAtiva}
                                onNovaCompra={() => setModalCompra(true)}
                                onNovoProduto={() => setModalProduto(true)}
                                onConsumir={(p) => setModalConsumo(p)}
                                onFotoAmpliada={setFotoAmpliada}
                            />
                        )}
                        {abaAtiva === 'estoque' && (
                            <EstoqueView
                                produtosComEstoque={produtosComEstoque}
                                onConsumir={(p) => setModalConsumo(p)}
                                onBaixaChat={() => setModalBaixaChat(true)}
                                onAjusteRapido={ajustarEstoqueRapido}
                                onNovoProduto={() => setModalProduto(true)}
                                onCatalogo={() => setModalCatalogo(true)}
                                onEditarProduto={(p) => setModalProduto(p)}
                                onExcluirProduto={excluirProduto}
                                onAdicionarLote={(prodId, qtd, validade, localEstoque) => executar(async () => {
                                    await CB.saveDoc('product_expiration', `lote_${Date.now()}`, {
                                        product_id: prodId, quantity: Number(qtd), expiration_date: validade || '',
                                        local_estoque: localEstoque || 'despensa'
                                    });
                                    mostrarToast('Lote adicionado com sucesso!');
                                })}
                                onAlterarLocalProduto={(prod, novoLocal) => executar(async () => {
                                    const ops = [{ type: 'set', col: 'products', id: prod.id, data: { local_estoque: novoLocal } }];
                                    prod.lotes.forEach(l => ops.push({ type: 'set', col: 'product_expiration', id: l.id, data: { local_estoque: novoLocal } }));
                                    await CB.batchOps(ops);
                                    mostrarToast(`Movido para ${LOCAIS_ESTOQUE.find(x => x.id === novoLocal)?.label || novoLocal}`);
                                })}
                                onToggleEssencial={(prod) => executar(async () => {
                                    const novoVal = !prod.essencial;
                                    await CB.saveDoc('products', prod.id, { essencial: novoVal });
                                    mostrarToast(novoVal ? `${prod.name} marcado como essencial` : `${prod.name} desmarcado`);
                                })}
                                onDescartarVencido={async (lote, prod) => {
                                    if (!confirm(`Descartar ${lote.quantity} ${prod.unit} de ${prod.name}?`)) return;
                                    await executar(async () => {
                                        await CB.batchOps([
                                            { type: 'delete', col: 'product_expiration', id: lote.id },
                                            { type: 'set', col: 'consumption', id: `desc_${Date.now()}`, data: {
                                                product_id: prod.id, product_name: prod.name, quantity: Number(lote.quantity),
                                                consumed_at: new Date().toISOString(), notes: 'Descarte por vencimento'
                                            } }
                                        ]);
                                        mostrarToast('Item descartado do estoque.');
                                    });
                                }}
                                onFotoAmpliada={setFotoAmpliada}
                            />
                        )}
                        {abaAtiva === 'compras' && (
                            <ComprasView compras={compras} onNovaCompra={() => setModalCompra(true)} onUploadNF={() => setModalCompra('nf')} onVerDetalhes={(c) => setModalDetalheCompra(c)} />
                        )}
                        {abaAtiva === 'lista' && (
                            <ListaComprasView
                                listaCompras={listaCompras}
                                produtos={produtos}
                                historicoPrecos={historicoPrecos}
                                itensAbaixoMinimo={itensAbaixoMinimo}
                                onComprar={() => setModalCompra(true)}
                                onComparar={() => setAbaAtiva('comparativo')}
                                executar={executar}
                                mostrarToast={mostrarToast}
                            />
                        )}
                        {abaAtiva === 'comparativo' && (
                            <ComparativoMercadosView
                                listaCompras={listaCompras}
                                produtos={produtos}
                                historicoPrecos={historicoPrecos}
                                ofertasSiteAtivas={ofertasSiteAtivas}
                                establishments={INITIAL_ESTABLISHMENTS}
                                setAbaAtiva={setAbaAtiva}
                                onUploadNF={() => setModalCompra('nf')}
                                executar={executar}
                                mostrarToast={mostrarToast}
                            />
                        )}
                        {abaAtiva === 'receitas' && (
                            <ReceitasView
                                produtosComEstoque={produtosComEstoque}
                                receitasPessoais={receitasPessoais}
                                listaCompras={listaCompras}
                                executar={executar}
                                mostrarToast={mostrarToast}
                            />
                        )}
                        {abaAtiva === 'ofertas' && (
                            <OfertasView
                                ofertas={ofertasEncontradas}
                                ofertasSiteAtivas={ofertasSiteAtivas}
                                produtos={produtos}
                                onFotoAmpliada={setFotoAmpliada}
                            />
                        )}
                        <MonitorOfertas
                            visivel={abaAtiva === 'monitor'}
                            produtos={produtos}
                            historicoPrecos={historicoPrecos}
                            onOfertasAtualizadas={setOfertasSiteAtivas}
                            executar={executar}
                            mostrarToast={mostrarToast}
                        />
                        {abaAtiva === 'ru' && <CardapioRUView executar={executar} mostrarToast={mostrarToast} />}
                        {abaAtiva === 'precos' && <PrecosView historicoPrecos={historicoPrecos} />}
                        {abaAtiva === 'gastos' && <GastosView compras={compras} metricasGasto={metricasGasto} estimativaProximaSemana={estimativaProximaSemana} />}
                        {abaAtiva === 'relatorios' && <RelatoriosView produtosComEstoque={produtosComEstoque} consumos={consumos} />}
                    </main>

                    {(abaAtiva === 'estoque' || abaAtiva === 'inicio') && (
                        <button
                            onClick={() => setModalBaixaChat(true)}
                            className="fixed bottom-20 md:bottom-6 right-4 z-30 bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 transition"
                            title="Registrar consumo por voz ou texto"
                        >
                            <Icon name="mic" className="w-4 h-4 text-slate-300" />
                            <span className="text-xs font-semibold hidden sm:inline">Baixa Rápida</span>
                        </button>
                    )}

                    {/* Bottom Navigation Mobile */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-1.5 px-2 shadow-sm z-30 md:hidden overflow-x-auto no-scrollbar">
                        <div className="flex justify-around items-center min-w-max space-x-1">
                            <NavBtn ativo={abaAtiva === 'inicio'} onClick={() => setAbaAtiva('inicio')} icon="home" label="Início" />
                            <NavBtn ativo={abaAtiva === 'estoque'} onClick={() => setAbaAtiva('estoque')} icon="layers" label="Estoque" />
                            <NavBtn ativo={abaAtiva === 'compras'} onClick={() => setAbaAtiva('compras')} icon="shopping-bag" label="Compras" />
                            <NavBtn ativo={abaAtiva === 'lista'} onClick={() => setAbaAtiva('lista')} icon="list-checks" label="Lista" badge={pendentesLista} />
                            <NavBtn ativo={abaAtiva === 'comparativo'} onClick={() => setAbaAtiva('comparativo')} icon="scale" label="Compensa" />
                            <NavBtn ativo={abaAtiva === 'receitas'} onClick={() => setAbaAtiva('receitas')} icon="chef-hat" label="Receitas" />
                            <NavBtn ativo={abaAtiva === 'ofertas'} onClick={() => setAbaAtiva('ofertas')} icon="tag" label="Ofertas" />
                            <NavBtn ativo={abaAtiva === 'monitor'} onClick={() => setAbaAtiva('monitor')} icon="globe" label="Encartes" />
                            <NavBtn ativo={abaAtiva === 'ru'} onClick={() => setAbaAtiva('ru')} icon="utensils" label="RU" />
                            <NavBtn ativo={abaAtiva === 'precos'} onClick={() => setAbaAtiva('precos')} icon="trending-up" label="Preços" />
                            <NavBtn ativo={abaAtiva === 'gastos'} onClick={() => setAbaAtiva('gastos')} icon="wallet" label="Gastos" />
                            <NavBtn ativo={abaAtiva === 'relatorios'} onClick={() => setAbaAtiva('relatorios')} icon="bar-chart-3" label="Relatórios" />
                        </div>
                    </nav>

                    {modalCompra && (
                        <ModalCompra
                            compraParaEditar={modalCompra && typeof modalCompra === 'object' ? modalCompra : null}
                            focoNF={modalCompra === 'nf'}
                            produtos={produtos}
                            lotesValidade={lotesValidade}
                            historicoPrecos={historicoPrecos}
                            listaCompras={listaCompras}
                            establishments={INITIAL_ESTABLISHMENTS}
                            onClose={() => setModalCompra(null)}
                            onSalvo={() => {
                                const editando = modalCompra && typeof modalCompra === 'object';
                                setModalCompra(null);
                                mostrarToast(editando ? 'Compra atualizada com sucesso!' : 'Compra registrada e estoque atualizado.');
                            }}
                            onNovoProduto={() => setModalProduto(true)}
                            onCatalogo={() => setModalCatalogo(true)}
                            mostrarToast={mostrarToast}
                        />
                    )}

                    {modalBaixaChat && (
                        <ModalBaixaChat
                            produtosComEstoque={produtosComEstoque}
                            onClose={() => setModalBaixaChat(false)}
                            executar={executar}
                            mostrarToast={mostrarToast}
                        />
                    )}

                    {modalConsumo && (
                        <ModalConsumo
                            produto={modalConsumo}
                            baixarDosLotes={baixarDosLotes}
                            onClose={() => setModalConsumo(null)}
                            onSalvo={() => { setModalConsumo(null); mostrarToast('Consumo registrado.'); }}
                            mostrarToast={mostrarToast}
                        />
                    )}

                    {modalDetalheCompra && (
                        <ModalDetalheCompra
                            compra={modalDetalheCompra}
                            onClose={() => setModalDetalheCompra(null)}
                            onExcluir={() => excluirCompra(modalDetalheCompra)}
                            onEditar={(c) => {
                                setModalDetalheCompra(null);
                                setModalCompra(c);
                            }}
                            onFotoAmpliada={setFotoAmpliada}
                        />
                    )}

                    {modalBuscaGlobal && (
                        <ModalBuscaGlobal produtosComEstoque={produtosComEstoque} historicoPrecos={historicoPrecos} onClose={() => setModalBuscaGlobal(false)} />
                    )}

                    {modalConfig && (
                        <ModalConfig
                            user={user}
                            modoLocal={modoLocal}
                            dados={{ produtos, lotesValidade, compras, historicoPrecos, consumos, listaCompras, receitasPessoais }}
                            onClose={() => setModalConfig(false)}
                            mostrarToast={mostrarToast}
                        />
                    )}

                    {modalProduto !== null && (
                        <ModalProduto
                            produto={typeof modalProduto === 'object' ? modalProduto : null}
                            produtosComEstoque={produtosComEstoque}
                            categories={INITIAL_CATEGORIES}
                            onClose={() => setModalProduto(null)}
                            onSalvo={() => { setModalProduto(null); mostrarToast('Produto salvo.'); }}
                            mostrarToast={mostrarToast}
                        />
                    )}

                    {modalCatalogo && (
                        <ModalCatalogo produtos={produtos} onClose={() => setModalCatalogo(false)} onAdicionar={adicionarDoCatalogo} />
                    )}

                    {fotoAmpliada && (
                        <div onClick={() => setFotoAmpliada(null)} className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-[70] p-4 cursor-pointer">
                            <div className="max-w-md w-full bg-white p-3 rounded-2xl shadow-xl">
                                <img src={fotoAmpliada.url} alt={fotoAmpliada.nome} className="w-full h-auto rounded-xl object-contain max-h-[75vh]" />
                                <p className="text-center text-xs font-semibold text-slate-800 mt-2">{fotoAmpliada.nome}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function NavBtn({ ativo, onClick, icon, label, badge }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center relative py-1.5 px-3 rounded-lg transition ${ativo ? 'text-slate-900 font-semibold' : 'text-slate-400 hover:text-slate-600'}`}>
                    <Icon name={icon} className="w-4 h-4 mb-0.5" />
                    <span className="text-[10px] whitespace-nowrap">{label}</span>
                    {badge > 0 && <span className="absolute top-0 right-1 bg-slate-900 text-white text-[9px] font-bold px-1.5 rounded-full">{badge}</span>}
                </button>
            );
        }

        function DesktopNavBtn({ ativo, onClick, icon, label, badge }) {
            return (
                <button onClick={onClick} className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition whitespace-nowrap ${ativo ? 'bg-white text-slate-900 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'}`}>
                    <Icon name={icon} className="w-3.5 h-3.5 text-slate-500" />
                    <span>{label}</span>
                    {badge > 0 && <span className="bg-slate-900 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">{badge}</span>}
                </button>
            );
        }

        function Dashboard({ saudacao, produtosComEstoque, itensAbaixoMinimo, metricasGasto, estimativaProximaSemana, ofertas, pendentesLista, setAbaAtiva, onNovaCompra, onNovoProduto, onConsumir, onFotoAmpliada }) {
            const qtdAcabando = itensAbaixoMinimo.filter(p => p.stockTotal > 0).length;
            const qtdAcabados = itensAbaixoMinimo.filter(p => p.stockTotal <= 0).length;
            const lotesProximos = produtosComEstoque.flatMap(p => p.lotes).filter(l => {
                const d = calcularDiasParaVencer(l.expiration_date);
                return d !== null && d <= 7;
            });

            return (
                <div className="space-y-6">
                    {/* Banner Resumo Neutro */}
                    <div className="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="font-semibold text-sm sm:text-base text-slate-900 flex items-center space-x-2">
                                <span>{saudacao}, visão geral da casa</span>
                            </h2>
                            <p className="text-xs text-slate-500 max-w-xl mt-1">
                                {qtdAcabando} item(ns) acabando, {qtdAcabados} esgotado(s) e {lotesProximos.length} com validade próxima.
                            </p>
                        </div>
                        <div className="flex space-x-2 w-full md:w-auto">
                            <button onClick={onNovoProduto} className="flex-1 md:flex-initial bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center justify-center space-x-1.5 border border-slate-200">
                                <Icon name="plus" className="w-3.5 h-3.5" />
                                <span>Item</span>
                            </button>
                            <button onClick={onNovaCompra} className="flex-1 md:flex-initial bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-sm transition flex items-center justify-center space-x-1.5">
                                <Icon name="shopping-bag" className="w-3.5 h-3.5" />
                                <span>Nova Compra</span>
                            </button>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
                        <CardInd titulo="Em estoque" valor={produtosComEstoque.filter(p => p.stockTotal > 0).length} sub={`De ${produtosComEstoque.length} cadastrados`} icone="package" onClick={() => setAbaAtiva('estoque')} />
                        <CardInd titulo="Acabando" valor={qtdAcabando} sub="Abaixo do mínimo" icone="alert-triangle" destaque={qtdAcabando > 0} onClick={() => setAbaAtiva('estoque')} />
                        <CardInd titulo="Acabados" valor={qtdAcabados} sub="Estoque zerado" icone="x-circle" destaque={qtdAcabados > 0} onClick={() => setAbaAtiva('lista')} />
                        <CardInd titulo="Validade" valor={lotesProximos.length} sub="Até 7 dias" icone="clock" onClick={() => setAbaAtiva('estoque')} />
                        <CardInd titulo="Gasto 7 dias" valor={`R$ ${dinheiro(metricasGasto.semana)}`} sub="Última semana" icone="wallet" onClick={() => setAbaAtiva('gastos')} />
                        <CardInd titulo="Estimativa próx." valor={estimativaProximaSemana.itensBase > 0 ? `R$ ${dinheiro(estimativaProximaSemana.total)}` : 'Sem dados'} sub="Reposição essencial" icone="trending-up" onClick={() => setAbaAtiva('gastos')} />
                        <CardInd titulo="Ofertas ativas" valor={ofertas.length} sub="Abaixo da média" icone="tag" onClick={() => setAbaAtiva('ofertas')} />
                        <CardInd titulo="Lista de compras" valor={pendentesLista} sub="Itens pendentes" icone="list-checks" onClick={() => setAbaAtiva('lista')} />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500">Reposição Prioritária</h3>
                                <button onClick={() => setAbaAtiva('estoque')} className="text-xs text-slate-600 hover:text-slate-900 font-semibold hover:underline">Ver estoque</button>
                            </div>
                            <div className="space-y-2">
                                {itensAbaixoMinimo.slice(0, 4).map(p => (
                                    <div key={p.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100">
                                        <div className="flex items-center space-x-3 min-w-0">
                                            {p.image_url ? (
                                                <img onClick={() => onFotoAmpliada({ url: p.image_url, nome: p.name })} src={p.image_url} alt="" className="w-9 h-9 object-cover rounded-lg cursor-pointer border border-slate-200" />
                                            ) : (
                                                <div className="w-9 h-9 bg-slate-200 text-slate-600 rounded-lg flex items-center justify-center text-xs">
                                                    <Icon name="package" className="w-4 h-4" />
                                                </div>
                                            )}
                                            <div className="min-w-0">
                                                <p className="text-xs font-semibold text-slate-800 truncate">{p.name}</p>
                                                <p className="text-[11px] text-slate-500">Saldo: <strong>{p.stockTotal} {p.unit}</strong> (mín: {p.minimum_stock})</p>
                                            </div>
                                        </div>
                                        {p.stockTotal > 0 ? (
                                            <button onClick={() => onConsumir(p)} className="bg-white border border-slate-200 text-xs px-2.5 py-1 rounded-lg font-medium text-slate-700 hover:bg-slate-50">Consumir</button>
                                        ) : (
                                            <span className="text-[10px] font-semibold bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-md">Esgotado</span>
                                        )}
                                    </div>
                                ))}
                                {itensAbaixoMinimo.length === 0 && <p className="text-xs text-slate-400 py-4 text-center">Nenhum item abaixo do estoque mínimo.</p>}
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                            <div className="flex justify-between items-center mb-3">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500">Principais Ofertas</h3>
                                <button onClick={() => setAbaAtiva('ofertas')} className="text-xs text-slate-600 hover:text-slate-900 font-semibold hover:underline">Ver todas</button>
                            </div>
                            <div className="space-y-2">
                                {ofertas.slice(0, 4).map(o => (
                                    <div key={o.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100">
                                        <div className="min-w-0">
                                            <p className="text-xs font-semibold text-slate-800 truncate">{o.name}</p>
                                            <p className="text-[11px] text-slate-500">{o.estabelecimento} • Média: R$ {dinheiro(o.media)}</p>
                                        </div>
                                        <div className="text-right shrink-0">
                                            <span className="text-xs font-bold text-slate-900">R$ {dinheiro(o.precoAtual)}</span>
                                            <span className="block text-[10px] text-emerald-700 font-semibold">-{o.desconto.toFixed(0)}%</span>
                                        </div>
                                    </div>
                                ))}
                                {ofertas.length === 0 && <p className="text-xs text-slate-400 py-4 text-center">Cadastre compras repetidas para detecção de ofertas.</p>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CardInd({ titulo, valor, sub, icone, destaque, onClick }) {
            return (
                <div onClick={onClick} className={`bg-white rounded-2xl p-4 shadow-sm border cursor-pointer hover:border-slate-300 transition flex flex-col justify-between ${destaque ? 'border-amber-200 bg-amber-50/20' : 'border-slate-200'}`}>
                    <div className="flex justify-between items-start mb-2">
                        <span className="text-xs font-medium text-slate-500">{titulo}</span>
                        <div className="text-slate-400"><Icon name={icone} className="w-4 h-4" /></div>
                    </div>
                    <div>
                        <h4 className="text-base sm:text-lg font-bold text-slate-900">{valor}</h4>
                        <p className="text-[11px] text-slate-400 mt-0.5">{sub}</p>
                    </div>
                </div>
            );
        }

        // ---------- View: Estoque Unificado ----------
        function EstoqueView({ produtosComEstoque, onConsumir, onBaixaChat, onAjusteRapido, onNovoProduto, onCatalogo, onEditarProduto, onExcluirProduto, onAdicionarLote, onAlterarLocalProduto, onToggleEssencial, onDescartarVencido, onFotoAmpliada }) {
            const [abaLocal, setAbaLocal] = useState('geral');
            const [filtro, setFiltro] = useState('todos');
            const [busca, setBusca] = useState('');
            const [expandidos, setExpandidos] = useState(new Set());
            const [modalLoteProd, setModalLoteProd] = useState(null);
            const [qtdLote, setQtdLote] = useState(1);
            const [validadeLote, setValidadeLote] = useState('');
            const [localLote, setLocalLote] = useState('despensa');

            const todosLocais = useMemo(() => obterTodosLocais(produtosComEstoque), [produtosComEstoque]);

            const toggleExpandir = (id) => setExpandidos(prev => {
                const next = new Set(prev);
                next.has(id) ? next.delete(id) : next.add(id);
                return next;
            });

            const contagensLocais = useMemo(() => {
                const map = { geral: produtosComEstoque.length };
                todosLocais.forEach(loc => {
                    map[loc.id] = produtosComEstoque.filter(p =>
                        obterLocalEstoque(p, null) === loc.id || p.lotes.some(l => obterLocalEstoque(p, l) === loc.id)
                    ).length;
                });
                return map;
            }, [produtosComEstoque, todosLocais]);

            const selecionarOuCriarLocal = (valor, callback) => {
                if (valor === '__outro__') {
                    const novo = (prompt('Nome do novo departamento/local:') || '').trim();
                    if (novo) callback(novo);
                } else {
                    callback(valor);
                }
            };

            const filtrados = produtosComEstoque.filter(p => {
                if (busca) {
                    const b = normalizar(busca);
                    if (!normalizar(p.name).includes(b) && !normalizar(p.brand || '').includes(b)) return false;
                }
                if (abaLocal !== 'geral') {
                    const pertenceLocal = obterLocalEstoque(p, null) === abaLocal || p.lotes.some(l => obterLocalEstoque(p, l) === abaLocal);
                    if (!pertenceLocal) return false;
                }
                if (filtro === 'acabando') return p.stockTotal > 0 && p.stockTotal <= p.minimum_stock;
                if (filtro === 'acabou') return p.stockTotal <= 0;
                if (filtro === 'vencendo') return p.lotes.some(l => { const d = calcularDiasParaVencer(l.expiration_date); return d !== null && d <= 7; });
                if (filtro === 'essenciais') return p.essencial;
                return true;
            });

            return (
                <div className="space-y-5">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h2 className="text-base font-bold text-slate-900">Controle de Estoque</h2>
                                <p className="text-xs text-slate-500">Gerencie todos os itens físicos cadastrados na residência.</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {onBaixaChat && (
                                    <button onClick={onBaixaChat} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-xl transition flex items-center space-x-1.5 border border-slate-200">
                                        <Icon name="mic" className="w-3.5 h-3.5 text-slate-500" />
                                        <span>Baixa por Voz</span>
                                    </button>
                                )}
                                <button onClick={onCatalogo} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-xl transition border border-slate-200">
                                    Catálogo Rápido
                                </button>
                                <button onClick={onNovoProduto} className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-sm transition flex items-center space-x-1.5">
                                    <Icon name="plus" className="w-3.5 h-3.5" />
                                    <span>Novo Item</span>
                                </button>
                            </div>
                        </div>

                        <div className="relative">
                            <span className="text-slate-400 absolute left-3.5 top-2.5"><Icon name="search" className="w-4 h-4" /></span>
                            <input type="text" placeholder="Filtrar por nome ou marca..." value={busca} onChange={e => setBusca(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2 text-xs focus:bg-white focus:outline-none focus:ring-1 focus:ring-slate-900 transition" />
                            {busca && <button onClick={() => setBusca('')} className="absolute right-3.5 top-2 text-slate-400 hover:text-slate-600"><Icon name="x" className="w-4 h-4" /></button>}
                        </div>

                        <div className="flex flex-wrap gap-1.5">
                            {[
                                ['todos', 'Todos'],
                                ['acabando', 'Acabando'],
                                ['acabou', 'Esgotados'],
                                ['vencendo', 'Validade Próxima'],
                                ['essenciais', 'Essenciais']
                            ].map(([key, label]) => (
                                <button key={key} onClick={() => setFiltro(key)} className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${filtro === key ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                    {label}
                                </button>
                            ))}
                        </div>

                        <div className="flex flex-wrap gap-2 pt-3 border-t border-slate-100">
                            <button
                                onClick={() => setAbaLocal('geral')}
                                className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition ${abaLocal === 'geral' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}
                            >
                                Geral ({contagensLocais.geral || 0})
                            </button>
                            {todosLocais.map(loc => (
                                <button
                                    key={loc.id}
                                    onClick={() => setAbaLocal(loc.id)}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition ${abaLocal === loc.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}
                                >
                                    {loc.label} ({contagensLocais[loc.id] || 0})
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {filtrados.map(p => {
                            const statusBadge = p.stockTotal <= 0
                                ? { text: 'Esgotado', cls: 'bg-rose-50 text-rose-700 border-rose-200' }
                                : p.stockTotal <= p.minimum_stock
                                ? { text: 'Baixo', cls: 'bg-amber-50 text-amber-700 border-amber-200' }
                                : { text: 'Normal', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
                            const localProd = obterLocalEstoque(p, null);
                            const locInfo = todosLocais.find(x => x.id === localProd) || LOCAIS_ESTOQUE[3];
                            const expandido = expandidos.has(p.id);
                            const diasMinValidade = p.lotes.reduce((acc, l) => {
                                const d = calcularDiasParaVencer(l.expiration_date);
                                return d === null ? acc : (acc === null ? d : Math.min(acc, d));
                            }, null);
                            const vencendoBreve = diasMinValidade !== null && diasMinValidade <= 7;

                            return (
                                <div key={p.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between overflow-hidden">
                                    <div className="p-4 pb-3">
                                        <div className="flex justify-between items-start gap-3">
                                            <div className="flex items-center space-x-3 min-w-0 flex-1">
                                                {p.image_url ? (
                                                    <img onClick={() => onFotoAmpliada({ url: p.image_url, nome: p.name })} src={p.image_url} alt="" className="w-10 h-10 object-cover rounded-xl border border-slate-200 cursor-pointer shrink-0" />
                                                ) : (
                                                    <div className="w-10 h-10 bg-slate-100 text-slate-500 rounded-xl flex items-center justify-center border border-slate-200 shrink-0">
                                                        <Icon name="package" className="w-4 h-4" />
                                                    </div>
                                                )}
                                                <div className="min-w-0 flex-1">
                                                    <div className="flex items-center gap-1.5">
                                                        <h4 className="text-xs sm:text-sm font-semibold text-slate-900 truncate">{p.name}</h4>
                                                        <button onClick={() => onToggleEssencial(p)} className={`shrink-0 text-xs transition ${p.essencial ? 'text-amber-500' : 'text-slate-300 hover:text-slate-400'}`} title="Marcar essencial">★</button>
                                                    </div>
                                                    <div className="flex flex-wrap items-center gap-1.5 mt-1">
                                                        <span className={`text-[10px] font-medium px-2 py-0.5 rounded border ${statusBadge.cls}`}>{statusBadge.text}</span>
                                                        <span className="text-[10px] font-medium px-2 py-0.5 rounded border border-slate-200 bg-slate-50 text-slate-600">{locInfo.label}</span>
                                                        {vencendoBreve && (
                                                            <span className={`text-[10px] font-medium px-2 py-0.5 rounded border ${diasMinValidade < 0 ? 'bg-slate-900 text-white' : 'bg-rose-50 text-rose-700 border-rose-200'}`}>
                                                                {diasMinValidade < 0 ? 'Vencido' : diasMinValidade === 0 ? 'Vence hoje' : `${diasMinValidade}d para vencer`}
                                                            </span>
                                                        )}
                                                        {p.brand && <span className="text-[10px] text-slate-400">{p.brand}</span>}
                                                    </div>
                                                </div>
                                            </div>
                                            <div className="text-right shrink-0">
                                                <span className="text-sm font-bold text-slate-900">{p.stockTotal}</span>
                                                <span className="text-[11px] text-slate-500 ml-0.5">{p.unit}</span>
                                                <p className="text-[10px] text-slate-400">mín: {p.minimum_stock}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex items-center gap-1.5 px-4 pb-3">
                                        <button onClick={() => onAjusteRapido(p, -1)} disabled={p.stockTotal < 1} className="bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-semibold">-1</button>
                                        <button onClick={() => onAjusteRapido(p, 1)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-semibold">+1</button>
                                        <button onClick={() => onConsumir(p)} disabled={p.stockTotal <= 0} className="flex-1 bg-slate-900 hover:bg-slate-800 disabled:opacity-40 text-white py-1.5 rounded-lg text-xs font-semibold transition">Consumir</button>
                                        <button onClick={() => { setQtdLote(1); setValidadeLote(''); setLocalLote(localProd); setModalLoteProd(p); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg text-xs font-semibold">+ Lote</button>
                                        <button onClick={() => toggleExpandir(p.id)} className={`bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-1.5 rounded-lg text-xs transition ${expandido ? 'bg-slate-200 text-slate-900' : ''}`} title="Detalhes">
                                            <Icon name={expandido ? 'chevron-up' : 'chevron-down'} className="w-3.5 h-3.5" />
                                        </button>
                                    </div>

                                    {expandido && (
                                        <div className="border-t border-slate-100 px-4 py-3 space-y-3 bg-slate-50">
                                            <div className="flex flex-wrap gap-x-4 gap-y-1 text-[11px] text-slate-500">
                                                <span>Categoria: <strong className="text-slate-700">{p.category}</strong></span>
                                                {Number(p.default_price) > 0 && <span>Preço ref: <strong className="text-slate-700">R$ {dinheiro(p.default_price)}</strong></span>}
                                                {Number(p.peso_por_unidade) > 0 && <span>Peso/un: <strong className="text-slate-700">{p.peso_por_unidade}g</strong></span>}
                                            </div>

                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] font-semibold text-slate-500">Mover para:</span>
                                                <select
                                                    value={localProd}
                                                    onChange={e => selecionarOuCriarLocal(e.target.value, novoLoc => onAlterarLocalProduto(p, novoLoc))}
                                                    className="text-[11px] font-medium text-slate-800 bg-white border border-slate-200 rounded-lg px-2 py-1 cursor-pointer"
                                                >
                                                    {todosLocais.map(loc => <option key={loc.id} value={loc.id}>{loc.label}</option>)}
                                                    <option value="__outro__">+ Criar outro departamento...</option>
                                                </select>
                                            </div>

                                            {p.lotes.length > 0 && (
                                                <div className="space-y-1">
                                                    <span className="text-[10px] font-semibold uppercase text-slate-400">Lotes registrados</span>
                                                    {p.lotes.map(l => {
                                                        const dias = calcularDiasParaVencer(l.expiration_date);
                                                        const vencido = dias !== null && dias < 0;
                                                        return (
                                                            <div key={l.id} className="flex justify-between items-center p-2 bg-white rounded-lg text-xs gap-2 border border-slate-200">
                                                                <div>
                                                                    <span className="font-semibold text-slate-800">{l.quantity} {p.unit}</span>
                                                                    <span className="text-[10px] text-slate-400 ml-2">Validade: {l.expiration_date || 'sem data'}</span>
                                                                </div>
                                                                <div className="flex items-center space-x-2">
                                                                    <span className={`text-[10px] font-medium px-2 py-0.5 rounded ${vencido ? 'bg-slate-900 text-white' : dias !== null && dias <= 7 ? 'bg-rose-50 text-rose-700' : 'bg-slate-100 text-slate-600'}`}>
                                                                        {dias !== null ? (vencido ? `Venceu há ${Math.abs(dias)}d` : `${dias}d restantes`) : 'Sem data'}
                                                                    </span>
                                                                    {vencido && <button onClick={() => onDescartarVencido(l, p)} className="text-[10px] bg-rose-600 text-white px-2 py-0.5 rounded font-medium">Descartar</button>}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            )}

                                            <div className="flex gap-2 pt-1">
                                                <button onClick={() => onEditarProduto(p)} className="flex-1 text-xs text-slate-700 font-medium py-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-50">Editar</button>
                                                <button onClick={() => onExcluirProduto(p)} className="px-3 text-xs text-rose-600 font-medium py-1.5 bg-white border border-slate-200 rounded-lg hover:bg-rose-50">Excluir</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    {filtrados.length === 0 && <p className="text-xs text-slate-400 text-center py-8">{busca ? 'Nenhum item localizado.' : 'Nenhum item cadastrado com este filtro.'}</p>}

                    {modalLoteProd && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4 border border-slate-200">
                                <h3 className="text-sm font-bold text-slate-900">Adicionar Lote: {modalLoteProd.name}</h3>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Quantidade ({modalLoteProd.unit}):</label>
                                    <input type="number" step="0.01" min="0.01" value={qtdLote} onChange={e => setQtdLote(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Local de guarda:</label>
                                    <select value={localLote} onChange={e => selecionarOuCriarLocal(e.target.value, setLocalLote)} className="w-full border rounded-xl px-3 py-2 text-xs bg-white">
                                        {todosLocais.map(loc => <option key={loc.id} value={loc.id}>{loc.label}</option>)}
                                        {localLote && !todosLocais.some(x => x.id === localLote) && <option value={localLote}>{localLote}</option>}
                                        <option value="__outro__">+ Criar outro...</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Data de validade (opcional):</label>
                                    <input type="date" value={validadeLote} onChange={e => setValidadeLote(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                                </div>
                                <div className="flex justify-end space-x-2 pt-2">
                                    <button onClick={() => setModalLoteProd(null)} className="px-3 py-2 text-xs text-slate-500 font-medium">Cancelar</button>
                                    <button onClick={() => {
                                        if (!(Number(qtdLote) > 0)) return;
                                        onAdicionarLote(modalLoteProd.id, qtdLote, validadeLote, localLote);
                                        setModalLoteProd(null);
                                    }} className="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-semibold">Salvar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ComprasView({ compras, onNovaCompra, onUploadNF, onVerDetalhes }) {
            return (
                <div className="space-y-5">
                    <div className="flex flex-wrap justify-between items-center gap-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <div>
                            <h2 className="text-base font-bold text-slate-900">Histórico de Compras</h2>
                            <p className="text-xs text-slate-500">Notas fiscais e registros de reposição.</p>
                        </div>
                        <div className="flex gap-2">
                            {onUploadNF && (
                                <button onClick={onUploadNF} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-xl transition flex items-center gap-1.5 border border-slate-200">
                                    <Icon name="file-text" className="w-3.5 h-3.5 text-slate-500" />
                                    <span>Nota Fiscal (Foto/PDF)</span>
                                </button>
                            )}
                            <button onClick={onNovaCompra} className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-sm transition">+ Nova Compra</button>
                        </div>
                    </div>
                    <div className="space-y-2">
                        {compras.map(c => (
                            <div key={c.id} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex justify-between items-center gap-3">
                                <div>
                                    <div className="flex flex-wrap items-center gap-2 mb-1">
                                        <span className="text-xs font-semibold text-slate-900 bg-slate-100 px-2 py-0.5 rounded">{c.purchase_date}</span>
                                        <span className="text-xs font-medium text-slate-700">{c.notes || 'Supermercado'}</span>
                                        {Array.isArray(c.photos) && c.photos.length > 0 && (
                                            <span className="text-[10px] text-slate-500 bg-slate-50 border px-1.5 py-0.5 rounded">Nota anexada</span>
                                        )}
                                    </div>
                                    <p className="text-[11px] text-slate-500">{(c.purchase_items || []).length} produto(s) registrados</p>
                                </div>
                                <div className="flex items-center space-x-3">
                                    <span className="text-xs sm:text-sm font-bold text-slate-900">R$ {dinheiro(c.total)}</span>
                                    <button onClick={() => onVerDetalhes(c)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium">Ver detalhes</button>
                                </div>
                            </div>
                        ))}
                        {compras.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhuma compra salva até o momento.</p>}
                    </div>
                </div>
            );
        }

        function ListaComprasView({ listaCompras, produtos, historicoPrecos, itensAbaixoMinimo, onComprar, onComparar, executar, mostrarToast }) {
            const [novoItem, setNovoItem] = useState('');
            const [novoPrecoPadrao, setNovoPrecoPadrao] = useState('');

            const obterPrecoSugerido = (l) => {
                if (Number(l.default_price) > 0) return Number(l.default_price);
                const prod = l.product_id ? produtos.find(p => p.id === l.product_id) : acharProdutoDaOferta(l.product_name, produtos);
                if (prod && Number(prod.default_price) > 0) return Number(prod.default_price);
                if (prod) {
                    const h = historicoPrecos.find(x => x.product_id === prod.id && Number(x.price) > 0);
                    if (h) return Number(h.price);
                }
                return 0;
