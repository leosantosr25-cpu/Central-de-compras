            const [soMeus, setSoMeus] = useState(false);
            const [busca, setBusca] = useState('');
            const [textoManual, setTextoManual] = useState('');
            const [cruzandoIA, setCruzandoIA] = useState(false);

            const dadosRef = React.useRef({});
            dadosRef.current = { produtos, historicoPrecos };

            const processar = async (texto, mesclar) => {
                const lista = linhasParaOfertas(texto).filter(ehOfertaVigente);
                const { produtos: prods, historicoPrecos: hist } = dadosRef.current;
                const mercadosCarregados = new Set(lista.map(o => normalizar(o.mercado)));

                const idsNovosAtivos = new Set();
                const matchedParaGravar = [];
                for (const o of [...lista].sort((a, b) => a.data.localeCompare(b.data))) {
                    const prod = resolverProdutoOferta(o, prods);
                    if (!prod) continue;
                    const id = `site_${slug(o.mercado)}_${slug(o.produto)}_${o.data}`;
                    idsNovosAtivos.add(id);
                    matchedParaGravar.push({ o, prod, id });
                }

                const paraExpirar = new Set();
                for (const h of hist) {
                    if (!h.from_site || h.expired) continue;
                    const vencida = !ehOfertaVigente(h);
                    const removidaDoMercado = mercadosCarregados.has(normalizar(h.source)) && !idsNovosAtivos.has(h.id);
                    if (vencida || removidaDoMercado) {
                        paraExpirar.add(h.id);
                        await CB.saveDoc('price_history', h.id, { expired: true });
                    }
                }

                const ultimoPreco = {};
                [...hist]
                    .filter(h => !h.expired && !paraExpirar.has(h.id) && ehOfertaVigente(h))
                    .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
                    .forEach(h => {
                        ultimoPreco[`${h.product_id}|${normalizar(h.source)}`] = Number(h.price);
                    });
                const existentesAtivos = new Set(hist.filter(h => !h.expired && !paraExpirar.has(h.id)).map(h => h.id));
                let gravados = 0;
                for (const { o, prod, id } of matchedParaGravar) {
                    const chave = `${prod.id}|${normalizar(o.mercado)}`;
                    const linkEfetivo = /^https?:\/\//i.test(o.link || '') ? o.link : (LINKS_MERCADOS[o.mercado] || '');
                    const marcaEfetiva = o.marca || prod.brand || '';
                    if (existentesAtivos.has(id)) { ultimoPreco[chave] = o.preco; continue; }
                    if (ultimoPreco[chave] === o.preco) continue;
                    await CB.saveDoc('price_history', id, {
                        product_id: prod.id,
                        product_name: prod.name,
                        brand: marcaEfetiva,
                        price: o.preco,
                        date: o.data,
                        validade: o.validade || '',
                        link: linkEfetivo,
                        source: o.mercado,
                        from_site: true,
                        expired: false,
                        is_demo: false
                    });
                    existentesAtivos.add(id);
                    ultimoPreco[chave] = o.preco;
                    gravados++;
                }
                setOfertas(prev => mesclar ? [...prev.filter(p => ehOfertaVigente(p) && !mercadosCarregados.has(normalizar(p.mercado))), ...lista] : lista);
                return { total: lista.length, gravados };
            };

            useEffect(() => {
                return CB.subscribeCollection('settings', (docs) => {
                    const d = docs.find(x => x.id === 'ofertas');
                    const url = (d && d.csv_url) || '';
                    setCsvUrl(url);
                    setDesativadoManual(!!(d && d.desativado));
                    setUrlInput(prev => prev || url);
                }, (e) => console.error(e));
            }, []);

            const urlPadraoRepo = (typeof window !== 'undefined' && /^https?:$/i.test(window.location.protocol)) ? './dados/ofertas.csv' : '';
            const urlEfetiva = desativadoManual ? '' : (csvUrl || urlPadraoRepo);

            useEffect(() => {
                if (!urlEfetiva) { setStatus('inativo'); return; }
                let cancelado = false;
                const buscar = async () => {
                    setStatus('lendo');
                    try {
                        const res = await fetch(urlEfetiva + (urlEfetiva.includes('?') ? '&' : '?') + '_=' + Date.now());
                        if (!csvUrl && res.status === 404) {
                            if (!cancelado) { setErro(''); setStatus('inativo'); }
                            return;
                        }
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const texto = await res.text();
                        if (/^\s*<(!doctype|html)/i.test(texto)) throw new Error('A resposta não é um CSV. A planilha está publicada na web?');
                        if (cancelado) return;
                        await processar(texto, false);
                        if (cancelado) return;
                        setErro(''); setStatus('ok'); setUltimaLeitura(new Date());
                    } catch (e) {
                        if (cancelado) return;
                        console.error(e);
                        setErro(e.message || 'Falha ao ler a planilha.');
                        setStatus('erro');
                    }
                };
                buscar();
                const t = setInterval(buscar, MONITOR_INTERVALO_MS);
                return () => { cancelado = true; clearInterval(t); };
            }, [urlEfetiva, csvUrl]);

            const atuais = useMemo(() => {
                const mapa = {};
                ofertas.filter(ehOfertaVigente).forEach(o => {
                    const k = `${normalizar(o.mercado)}|${normalizar(o.produto)}`;
                    if (!mapa[k] || o.data >= mapa[k].data) mapa[k] = o;
                });
                return Object.values(mapa).map(o => {
                    const prod = resolverProdutoOferta(o, produtos);
                    let vsMedia = null;
                    if (prod) {
                        const ps = historicoPrecos.filter(h => h.product_id === prod.id && !h.expired).map(h => Number(h.price)).filter(v => v > 0);
                        if (ps.length > 1) {
                            const media = ps.reduce((a, b) => a + b, 0) / ps.length;
                            vsMedia = ((media - o.preco) / media) * 100;
                        }
                    }
                    const marca = o.marca || (prod && prod.brand) || '';
                    const link = /^https?:\/\//i.test(o.link || '') ? o.link : (LINKS_MERCADOS[o.mercado] || '');
                    return { ...o, prod, vsMedia, marca, link };
                });
            }, [ofertas, produtos, historicoPrecos]);

            useEffect(() => {
                if (onOfertasAtualizadas) onOfertasAtualizadas(atuais);
            }, [atuais, onOfertasAtualizadas]);

            const cruzarOfertasComIA = async () => {
                const semMatch = atuais.filter(o => !o.prod);
                if (semMatch.length === 0) {
                    mostrarToast('Todas as ofertas ativas já estão vinculadas ao seu estoque!');
                    return;
                }
                if (produtos.length === 0) {
                    mostrarToast('Cadastre itens no estoque primeiro para cruzar com as ofertas.', 'erro');
                    return;
                }
                const apiKey = localStorage.getItem('gemini_api_key') || '';
                setCruzandoIA(true);
                try {
                    const itensEst = produtos.map(p => ({ id: p.id, nome: p.name }));
                    const nomesOf = [...new Set(semMatch.slice(0, 80).map(o => o.produto))];
                    const prompt = 'Vincule nomes abreviados de ofertas de supermercado aos itens do estoque doméstico.\n\n' +
                        'ESTOQUE (id e nome):\n' + JSON.stringify(itensEst) + '\n\n' +
                        'OFERTAS SEM VÍNCULO:\n' + JSON.stringify(nomesOf) + '\n\n' +
                        'Responda JSON: {"matches": [{"produto_oferta": "...", "id_item_estoque": "id ou string vazia"}]}';
                    const res = await chamarGeminiJSON(apiKey, [{ text: prompt }], { temperature: 0 });
                    const matches = Array.isArray(res?.matches) ? res.matches : (Array.isArray(res) ? res : []);
                    const validIds = new Set(produtos.map(p => p.id));
                    const mapa = new Map();
                    matches.forEach(m => {
                        if (m && m.produto_oferta && m.id_item_estoque && validIds.has(m.id_item_estoque)) {
                            mapa.set(m.produto_oferta, m.id_item_estoque);
                        }
                    });
                    if (mapa.size === 0) {
                        mostrarToast('Nenhuma nova correspondência encontrada pela IA.');
                        return;
                    }
                    const ops = [];
                    semMatch.forEach(o => {
                        const prodId = mapa.get(o.produto);
                        const prod = prodId ? produtos.find(p => p.id === prodId) : null;
                        if (!prod) return;
                        const id = `site_${slug(o.mercado)}_${slug(o.produto)}_${o.data}`;
                        const linkEfetivo = /^https?:\/\//i.test(o.link || '') ? o.link : (LINKS_MERCADOS[o.mercado] || '');
                        ops.push({
                            type: 'set', col: 'price_history', id,
                            data: {
                                product_id: prod.id, product_name: prod.name, brand: o.marca || prod.brand || '',
                                price: o.preco, date: o.data, validade: o.validade || '', link: linkEfetivo,
                                source: o.mercado, from_site: true, expired: false, is_demo: false
                            }
                        });
                    });
                    if (ops.length > 0) await CB.batchOps(ops);
                    setOfertas(prev => prev.map(o => mapa.has(o.produto) ? { ...o, id_item_estoque: mapa.get(o.produto) } : o));
                    mostrarToast(`${mapa.size} oferta(s) vinculada(s) ao estoque com IA!`);
                } catch (err) {
                    console.error(err);
                    mostrarToast(err.message || 'Erro ao cruzar ofertas com IA.', 'erro');
                } finally {
                    setCruzandoIA(false);
                }
            };

            if (!visivel) return null;

            const salvarUrl = () => executar(async () => {
                const u = urlInput.trim();
                if (u && !/^https?:\/\//i.test(u) && !u.startsWith('./')) {
                    mostrarToast('Cole um link que comece com https:// ou use ./dados/ofertas.csv', 'erro');
                    return;
                }
                await CB.saveDoc('settings', 'ofertas', { csv_url: u, desativado: false });
                setDesativadoManual(false);
                mostrarToast(u ? 'Link salvo. Leitura automática ativada!' : 'Usando leitura automática de ./dados/ofertas.csv.');
            });

            const importarManual = () => executar(async () => {
                if (!textoManual.trim()) return;
                const r = await processar(textoManual, true);
                setUltimaLeitura(new Date());
                setTextoManual('');
                mostrarToast(`${r.total} oferta(s) lida(s); ${r.gravados} preço(s) novo(s) no histórico.`);
            });

            const cadastrar = (o) => executar(async () => {
                const id = `site_${slug(o.produto)}`;
                const linkEfetivo = /^https?:\/\//i.test(o.link || '') ? o.link : (LINKS_MERCADOS[o.mercado] || '');
                await CB.saveDoc('products', id, {
                    name: o.produto, category: 'Outros', brand: o.marca || '', unit: 'unidade',
                    default_quantity: 1, minimum_stock: 1, default_price: o.preco,
                    local_estoque: 'Itens no armário', image_url: '',
                    notes: 'Cadastrado pelo monitor de ofertas', is_demo: false
                });
                await CB.saveDoc('price_history', `site_${slug(o.mercado)}_${slug(o.produto)}_${o.data}`, {
                    product_id: id, product_name: o.produto, brand: o.marca || '', price: o.preco,
                    date: o.data, validade: o.validade || '', link: linkEfetivo,
                    source: o.mercado, from_site: true, expired: false, is_demo: false
                });
                mostrarToast('Produto cadastrado e preço registrado!');
            });

            const mercados = [...new Set(atuais.map(o => o.mercado))].sort();
            const t = normalizar(busca);
            const filtradas = atuais
                .filter(o => (filtroMercado === 'Todos' || o.mercado === filtroMercado)
                    && (!soMeus || o.prod)
                    && (!t || normalizar(o.produto + ' ' + (o.marca || '')).includes(t)))
                .sort((a, b) => (b.prod ? 1 : 0) - (a.prod ? 1 : 0)
                    || (b.vsMedia === null ? -999 : b.vsMedia) - (a.vsMedia === null ? -999 : a.vsMedia)
                    || a.produto.localeCompare(b.produto));

            const rotuloStatus = {
                inativo: { txt: 'Desativado', cls: 'bg-slate-100 text-slate-600' },
                lendo: { txt: 'Lendo...', cls: 'bg-amber-100 text-amber-800' },
                ok: { txt: 'Ativo', cls: 'bg-emerald-100 text-emerald-700' },
                erro: { txt: 'Erro', cls: 'bg-rose-100 text-rose-700' }
            }[status];

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                        <div className="flex flex-wrap justify-between items-start gap-2">
                            <div>
                                <h2 className="text-lg font-bold text-slate-800">🌐 Ofertas dos sites dos supermercados</h2>
                                <p className="text-xs text-slate-500">Lê os encartes/planilha do coletor (colunas: data, supermercado, produto, marca, preco, validade, link) ao abrir e a cada 30 min, limpando ofertas expiradas automaticamente.</p>
                            </div>
                            <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${rotuloStatus.cls}`}>{rotuloStatus.txt}</span>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-2">
                            <input type="url" placeholder={urlPadraoRepo && !desativadoManual ? 'Automático: ./dados/ofertas.csv (ou cole outra URL CSV https://...)' : 'https://docs.google.com/spreadsheets/d/e/.../pub?output=csv'} value={urlInput} onChange={e => setUrlInput(e.target.value)} className="flex-1 border rounded-xl px-3 py-2 text-xs" />
                            <button onClick={salvarUrl} className="bg-violet-700 hover:bg-violet-600 text-white px-4 py-2 rounded-xl text-xs font-bold">{urlEfetiva ? 'Atualizar link' : 'Salvar e ativar'}</button>
                            {urlEfetiva && <button onClick={() => { setUrlInput(''); executar(async () => { await CB.saveDoc('settings', 'ofertas', { csv_url: '', desativado: true }); setDesativadoManual(true); setOfertas([]); mostrarToast('Monitoramento desativado.'); }); }} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold">Desativar</button>}
                        </div>
                        {ultimaLeitura && (
                            <div className="flex flex-wrap items-center justify-between gap-2">
                                <p className="text-[11px] text-slate-500">Última leitura: {ultimaLeitura.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} • {atuais.length} oferta(s) vigente(s) • {atuais.filter(o => o.prod).length} nos seus produtos</p>
                                {atuais.some(o => !o.prod) && (
                                    <button onClick={cruzarOfertasComIA} disabled={cruzandoIA} className="text-[11px] bg-violet-100 hover:bg-violet-200 text-violet-800 font-bold px-3 py-1.5 rounded-xl flex items-center gap-1 disabled:opacity-50">
                                        <Icon name="sparkles" className="w-3.5 h-3.5" />
                                        <span>{cruzandoIA ? 'Cruzando...' : 'Cruzar ofertas com IA'}</span>
                                    </button>
                                )}
                            </div>
                        )}
                        {erro && <p className="text-xs text-rose-600">⚠️ {erro}</p>}
                        <details className="text-xs text-slate-600">
                            <summary className="cursor-pointer font-bold text-violet-700">Testar colando linhas manualmente</summary>
                            <textarea value={textoManual} onChange={e => setTextoManual(e.target.value)} placeholder={'data,supermercado,produto,marca,preco,validade,link\n2026-11-18,Tatico,Arroz Branco 5kg,Tio João,26.90,2026-11-25,https://taticobaratotododia.com.br/gyn/tabloide/'} className="w-full h-24 border rounded-xl p-3 text-xs font-mono mt-2" />
                            <button onClick={importarManual} className="mt-2 bg-violet-100 text-violet-800 px-4 py-2 rounded-xl text-xs font-bold">Importar linhas</button>
                        </details>
                    </div>

                    {atuais.length > 0 && (
                        <div className="space-y-3">
                            <div className="flex flex-wrap gap-1.5 items-center">
                                <button onClick={() => setFiltroMercado('Todos')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${filtroMercado === 'Todos' ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>Todos</button>
                                {mercados.map(m => (
                                    <button key={m} onClick={() => setFiltroMercado(m)} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${filtroMercado === m ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>{m.replace('Supermercado ', '')}</button>
                                ))}
                                <label className="flex items-center space-x-1.5 text-xs text-slate-600 ml-2 cursor-pointer">
                                    <input type="checkbox" checked={soMeus} onChange={e => setSoMeus(e.target.checked)} className="accent-violet-700" />
                                    <span>Só meus produtos</span>
                                </label>
                            </div>
                            <input type="text" placeholder="Buscar produto ou marca nas ofertas..." value={busca} onChange={e => setBusca(e.target.value)} className="w-full bg-white border rounded-2xl px-4 py-2.5 text-xs shadow-sm" />
                        </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filtradas.map(o => {
                            const dias = calcularDiasParaVencer(o.data);
                            const antiga = dias !== null && dias < -7;
                            return (
                                <div key={`${o.mercado}|${o.produto}`} className={`bg-white rounded-3xl p-5 shadow-sm border flex flex-col justify-between ${o.prod ? 'border-violet-200' : 'border-slate-200'} ${antiga ? 'opacity-60' : ''}`}>
                                    <div>
                                        <div className="flex justify-between items-start gap-2 mb-2">
                                            <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full">{o.mercado.replace('Supermercado ', '')}</span>
                                            {o.vsMedia !== null && o.vsMedia > 0 && <span className="text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded-full">-{o.vsMedia.toFixed(0)}% vs sua média</span>}
                                        </div>
                                        <h4 className="text-sm font-bold text-slate-800">{o.produto}</h4>
                                        {o.marca && (
                                            <span className="inline-block mt-1 text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full">🏷️ {o.marca}</span>
                                        )}
                                        <p className="text-[11px] text-slate-500 mt-1">
                                            {o.data}{o.validade ? ` • válido até ${o.validade}` : ''}{antiga ? ' • possivelmente desatualizada' : ''}
                                        </p>
                                        {o.prod && <p className="text-[11px] text-violet-700 font-semibold mt-1">✅ Seu produto: {o.prod.name}</p>}
                                    </div>
                                    <div className="flex justify-between items-center mt-3 pt-3 border-t">
                                        <span className="text-base font-bold text-violet-800">R$ {dinheiro(o.preco)}</span>
                                        <div className="flex gap-2 items-center">
                                            {/^https?:\/\//i.test(o.link) && (
                                                <a href={o.link} target="_blank" rel="noopener noreferrer" className="text-[11px] text-violet-700 font-bold hover:underline inline-flex items-center gap-1">
                                                    <Icon name="external-link" className="w-3 h-3" />
                                                    <span>Conferir na fonte</span>
                                                </a>
                                            )}
                                            {!o.prod && <button onClick={() => cadastrar(o)} className="text-[11px] bg-violet-100 text-violet-800 font-bold px-2.5 py-1 rounded-lg hover:bg-violet-200">+ Monitorar</button>}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {atuais.length === 0 && (
                        <p className="text-xs text-slate-400 text-center py-8">{urlEfetiva ? 'Nenhuma oferta vigente lida ainda. Confira se o arquivo CSV tem ofertas válidas.' : 'Cole acima o link CSV da planilha do coletor ou ative ./dados/ofertas.csv para começar.'}</p>
                    )}
                    {atuais.length > 0 && filtradas.length === 0 && <p className="text-xs text-slate-400 text-center py-6">Nenhuma oferta neste filtro.</p>}
                </div>
            );
        }

        function CardapioRUView({ executar, mostrarToast }) {
            const [config, setConfig] = useState({
                unidade: 'Colemar Natal e Silva',
                titulo: '',
                dias: [],
                fonte_pagina_url: 'https://ru-ufg.web.ufg.br/tabs/cardapio',
                atualizado_em: '',
                palavras_chave: [
                    { termo: 'strogonoff', ativo: true },
                    { termo: 'lasanha', ativo: true },
                    { termo: 'feijoada', ativo: false },
                    { termo: 'frango assado', ativo: true }
                ]
            });
            const [novoTermo, setNovoTermo] = useState('');
            const [diaFiltro, setDiaFiltro] = useState('todos');

            useEffect(() => {
                return CB.subscribeCollection('settings', (docs) => {
                    const doc = docs.find(d => d.id === 'cardapio_ru');
                    if (doc) {
                        setConfig(prev => ({
                            ...prev,
                            ...doc,
                            fonte_pagina_url: doc.fonte_pagina_url || prev.fonte_pagina_url,
                            palavras_chave: Array.isArray(doc.palavras_chave) ? doc.palavras_chave : prev.palavras_chave,
                            dias: Array.isArray(doc.dias) ? doc.dias : []
                        }));
                    }
                });
            }, []);

            const salvarConfig = (parcial) => executar(async () => {
                const proximo = { ...config, ...parcial };
                setConfig(proximo);
                await CB.saveDoc('settings', 'cardapio_ru', {
                    unidade: proximo.unidade,
                    palavras_chave: proximo.palavras_chave
                });
            });

            const adicionarTermo = (e) => {
                e.preventDefault();
                const termo = novoTermo.trim();
                if (!termo) return;
                if (config.palavras_chave.some(p => normalizar(p.termo) === normalizar(termo))) {
                    mostrarToast('Esse item já está na lista.', 'erro');
                    return;
                }
                const lista = [...config.palavras_chave, { termo, ativo: true }];
                setNovoTermo('');
                salvarConfig({ palavras_chave: lista });
                mostrarToast('Alerta adicionado!');
            };

            const alternarTermo = (idx) => {
                const lista = config.palavras_chave.map((p, i) => i === idx ? { ...p, ativo: !p.ativo } : p);
                salvarConfig({ palavras_chave: lista });
            };

            const removerTermo = (idx) => {
                const lista = config.palavras_chave.filter((_, i) => i !== idx);
                salvarConfig({ palavras_chave: lista });
            };

            const diasSemanaNomes = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
            const hojeNome = diasSemanaNomes[new Date().getDay()];
            const termosAtivos = config.palavras_chave.filter(p => p.ativo).map(p => normalizar(p.termo)).filter(Boolean);
            const diasExibidos = config.dias.filter(d => {
                if (diaFiltro === 'todos') return true;
                if (diaFiltro === 'hoje') return normalizar(d.dia_semana) === normalizar(hojeNome);
                return normalizar(d.dia_semana) === normalizar(diaFiltro);
            });

            const temFavorito = (ref) => {
                if (!ref || termosAtivos.length === 0) return false;
                const texto = normalizar(typeof ref === 'string' ? ref : Object.values(ref).join(' '));
                return termosAtivos.some(t => texto.includes(t));
            };

            const renderRefeicao = (titulo, ref) => {
                if (!ref || (typeof ref === 'object' && !Object.values(ref).some(v => String(v || '').trim()))) {
                    return <p className="text-[11px] text-slate-400 italic">Sem {titulo.toLowerCase()}</p>;
                }
                const destaque = temFavorito(ref);

                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">

                                <p className="text-xs text-slate-500">
                                    {config.titulo || 'Aguardando primeira coleta semanal do App RU pela Action'}
                                    {config.atualizado_em ? ` • Atualizado em ${config.atualizado_em.slice(0, 10)}` : ''}
                                </p>
                            </div>
                            <div className="flex flex-wrap items-center gap-2">
                                <select
                                    value={config.unidade}
                                    onChange={e => salvarConfig({ unidade: e.target.value })}

                                >
                                    <option value="Colemar Natal e Silva">RU Colemar Natal e Silva</option>
                                    <option value="Samambaia">RU Samambaia</option>

                                <a href={config.fonte_pagina_url || 'https://ru-ufg.web.ufg.br/tabs/cardapio'} target="_blank" rel="noopener noreferrer" className="text-xs bg-violet-50 text-violet-700 font-bold px-3 py-1.5 rounded-xl hover:bg-violet-100 inline-flex items-center gap-1">
                                    <Icon name="external-link" className="w-3.5 h-3.5" />

                        {config.dias.length > 0 && (
                            <div className="flex flex-wrap gap-1.5 pt-2 border-t border-slate-100">

                                <button onClick={() => setDiaFiltro('hoje')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${diaFiltro === 'hoje' ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>Hoje</button>
                                {config.dias.map((d, i) => (
                                    <button key={i} onClick={() => setDiaFiltro(d.dia_semana)} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${normalizar(diaFiltro) === normalizar(d.dia_semana) ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                        {String(d.dia_semana || '').split('-')[0]}

                                ))}
                            </div>
                        )}

                        <details className="border-t pt-3">
                            <summary className="cursor-pointer text-xs font-bold text-slate-700 hover:text-violet-700 flex items-center justify-between">
                                <span>🔔 Alertas no WhatsApp ({termosAtivos.length} palavra(s)-chave ativa(s))</span>
                            </summary>
                            <div className="space-y-3 mt-3">

                                        + Adicionar
                                    </button>
                                </form>

                                <div className="flex flex-wrap gap-2">
                                    {config.palavras_chave.map((item, idx) => (
                                        <div

                                            <button type="button" onClick={() => removerTermo(idx)} className="text-slate-400 hover:text-rose-600 font-bold ml-1" title="Remover">✕</button>
                                        </div>

                            </div>
                        </details>
                    </div>

                    {config.dias.length === 0 ? (
                        <div className="bg-white rounded-3xl p-8 text-center border border-slate-200 text-xs text-slate-500">
                            Nenhum cardápio carregado ainda. Assim que você configurar as Secrets e rodar a Action <strong>Notificações Diárias (Vencimentos + Cardápio RU)</strong> no GitHub, a semana inteira aparecerá aqui automaticamente.
                        </div>
                    ) : diasExibidos.length === 0 ? (
                        <div className="bg-white rounded-3xl p-8 text-center border border-slate-200 text-xs text-slate-500">
