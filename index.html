            };

            const adicionarManual = (e) => {
                e.preventDefault();
                if (!novoItem.trim()) return;
                const prod = acharProdutoDaOferta(novoItem.trim(), produtos);
                const pInformado = Number(novoPrecoPadrao) || (prod && Number(prod.default_price)) || 0;
                executar(async () => {
                    await CB.saveDoc('shopping_list', `item_${Date.now()}`, {
                        product_id: prod ? prod.id : '',
                        product_name: novoItem.trim(),
                        unit: prod ? prod.unit : 'unidade',
                        quantity: 1,
                        default_price: pInformado,
                        purchased: false
                    });
                    setNovoItem('');
                    setNovoPrecoPadrao('');
                    mostrarToast('Item inserido na lista.');
                });
            };

            const adicionarTodosCriticos = () => executar(async () => {
                let n = 0;
                for (const p of itensAbaixoMinimo) {
                    if (listaCompras.some(l => !l.purchased && l.product_id === p.id)) continue;
                    const qtd = Math.max(Number(p.default_quantity || 1), Number(p.minimum_stock || 1) - p.stockTotal);
                    const h = historicoPrecos.find(x => x.product_id === p.id && Number(x.price) > 0);
                    const precoBase = Number(p.default_price) > 0 ? Number(p.default_price) : (h ? Number(h.price) : 0);
                    await CB.saveDoc('shopping_list', `auto_${p.id}`, {
                        product_id: p.id, product_name: p.name, unit: p.unit,
                        quantity: qtd > 0 ? qtd : 1, default_price: precoBase, purchased: false
                    });
                    n++;
                }
                mostrarToast(n > 0 ? `${n} item(ns) inserido(s).` : 'Todos já constam na lista.');
            });

            const removerComprados = () => executar(async () => {
                for (const l of listaCompras.filter(x => x.purchased)) await CB.removeDoc('shopping_list', l.id);
                mostrarToast('Itens concluídos removidos.');
            });

            const atualizarCampoLista = (l, campos) => executar(async () => {
                await CB.saveDoc('shopping_list', l.id, campos);
                if (l.product_id && campos.default_price !== undefined) {
                    await CB.saveDoc('products', l.product_id, { default_price: Number(campos.default_price) || 0 });
                }
            });

            return (
                <div className="space-y-5">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h2 className="text-base font-bold text-slate-900">Lista de Compras</h2>
                            <p className="text-xs text-slate-500">Defina os itens a comprar para estimativa e comparativo entre lojas.</p>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={onComparar} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3.5 py-2 rounded-xl transition border border-slate-200 flex items-center space-x-1.5">
                                <Icon name="scale" className="w-3.5 h-3.5 text-slate-500" />
                                <span>Onde Compensa</span>
                            </button>
                            <button onClick={onComprar} className="bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-sm transition">Finalizar Compra</button>
                        </div>
                    </div>

                    <form onSubmit={adicionarManual} className="flex flex-col sm:flex-row gap-2">
                        <input type="text" placeholder="Adicionar item (ex: Arroz 5kg)..." value={novoItem} onChange={e => setNovoItem(e.target.value)} className="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs shadow-sm focus:outline-none focus:ring-1 focus:ring-slate-900" />
                        <input type="number" step="0.01" min="0" placeholder="Preço ref. R$" value={novoPrecoPadrao} onChange={e => setNovoPrecoPadrao(e.target.value)} className="w-full sm:w-36 bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs shadow-sm focus:outline-none focus:ring-1 focus:ring-slate-900" />
                        <button type="submit" className="bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-semibold">Adicionar</button>
                    </form>

                    {itensAbaixoMinimo.length > 0 && (
                        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2">
                            <div className="flex flex-wrap justify-between items-center gap-2">
                                <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500">Recomendações do Estoque ({itensAbaixoMinimo.length})</h3>
                                <button onClick={adicionarTodosCriticos} className="text-xs text-slate-700 font-semibold hover:underline">Adicionar todos à lista</button>
                            </div>
                            {itensAbaixoMinimo.map(p => (
                                <div key={p.id} className="flex justify-between items-center p-2.5 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                                    <div>
                                        <p className="font-semibold text-slate-800">{p.name}</p>
                                        <p className="text-[11px] text-slate-500">Saldo: {p.stockTotal} {p.unit} (mín: {p.minimum_stock})</p>
                                    </div>
                                    <span className={`text-[10px] font-medium px-2 py-0.5 rounded border ${p.stockTotal <= 0 ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-amber-50 text-amber-700 border-amber-200'}`}>
                                        {p.stockTotal <= 0 ? 'Esgotado' : 'Acabando'}
                                    </span>
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-2">
                        <div className="flex justify-between items-center mb-1">
                            <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500">Itens na Lista ({listaCompras.length})</h3>
                            {listaCompras.some(l => l.purchased) && <button onClick={removerComprados} className="text-xs text-rose-600 font-semibold hover:underline">Limpar concluídos</button>}
                        </div>
                        {listaCompras.map(l => {
                            const precoPad = obterPrecoSugerido(l);
                            return (
                                <div key={l.id} className={`flex flex-wrap sm:flex-nowrap justify-between items-center gap-2 p-3 rounded-xl border ${l.purchased ? 'bg-slate-50 border-slate-100 opacity-50' : 'bg-white border-slate-200'}`}>
                                    <label className="flex items-center space-x-3 cursor-pointer flex-1 min-w-[180px]">
                                        <input type="checkbox" checked={Boolean(l.purchased)} onChange={() => executar(() => CB.saveDoc('shopping_list', l.id, { purchased: !l.purchased }))} className="w-4 h-4 accent-slate-900 rounded" />
                                        <div>
                                            <span className={`text-xs font-semibold text-slate-800 ${l.purchased ? 'line-through' : ''}`}>
                                                {l.product_name}
                                            </span>
                                            {l.unit && <span className="text-[11px] text-slate-400 ml-1.5">({l.unit})</span>}
                                        </div>
                                    </label>
                                    {!l.purchased && (
                                        <div className="flex items-center gap-2">
                                            <div className="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1">
                                                <span className="text-[10px] text-slate-400">Qtd:</span>
                                                <input
                                                    type="number"
                                                    step="0.5"
                                                    min="0.1"
                                                    defaultValue={l.quantity || 1}
                                                    onBlur={e => {
                                                        const v = Number(e.target.value);
                                                        if (v > 0 && v !== Number(l.quantity)) atualizarCampoLista(l, { quantity: v });
                                                    }}
                                                    className="w-10 text-xs font-semibold text-slate-700 bg-transparent focus:outline-none"
                                                />
                                            </div>
                                            <div className="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1" title="Preço de referência">
                                                <span className="text-[10px] text-slate-400">R$</span>
                                                <input
                                                    type="number"
                                                    step="0.01"
                                                    min="0"
                                                    defaultValue={precoPad > 0 ? precoPad.toFixed(2) : ''}
                                                    placeholder="0.00"
                                                    onBlur={e => {
                                                        const v = Number(e.target.value || 0);
                                                        if (v >= 0 && v !== Number(l.default_price || 0)) atualizarCampoLista(l, { default_price: v });
                                                    }}
                                                    className="w-14 text-xs font-semibold text-slate-900 bg-transparent focus:outline-none"
                                                />
                                            </div>
                                        </div>
                                    )}
                                    <button onClick={() => executar(() => CB.removeDoc('shopping_list', l.id))} className="text-slate-400 hover:text-rose-600 text-xs font-medium ml-2">Excluir</button>
                                </div>
                            );
                        })}
                        {listaCompras.length === 0 && <p className="text-xs text-slate-400 py-4 text-center">Nenhum item na lista de compras.</p>}
                    </div>
                </div>
            );
        }

        function ComparativoMercadosView({ listaCompras, produtos, historicoPrecos, ofertasSiteAtivas, establishments, setAbaAtiva, onUploadNF, executar, mostrarToast }) {
            const [apenasOfertas, setApenasOfertas] = useState(false);
            const [economiaMinDivisao, setEconomiaMinDivisao] = useState(10);
            const [termometrosAbertos, setTermometrosAbertos] = useState({});

            const pendentes = useMemo(() => listaCompras.filter(l => !l.purchased), [listaCompras]);

            const mercados = useMemo(() => {
                const base = establishments.filter(e => e !== 'Outro');
                const setM = new Set(base);
                ofertasSiteAtivas.filter(ehOfertaVigente).forEach(o => { if (o.mercado) setM.add(o.mercado); });
                return Array.from(setM);
            }, [establishments, ofertasSiteAtivas]);

            const calcularTermometro = (prod, precoAtual) => {
                if (!prod || !(precoAtual > 0)) return null;
                const ps = historicoPrecos
                    .filter(h => h.product_id === prod.id && Number(h.price) > 0)
                    .map(h => Number(h.price));
                if (ps.length === 0) return null;
                const min = Math.min(...ps);
                const max = Math.max(...ps);
                const avg = ps.reduce((a, b) => a + b, 0) / ps.length;
                if (precoAtual <= min * 1.02) {
                    return { label: 'Menor histórico', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200', min, avg, max, count: ps.length };
                }
                if (precoAtual <= avg * 1.02) {
                    return { label: 'Na média', cls: 'bg-slate-100 text-slate-700 border-slate-200', min, avg, max, count: ps.length };
                }
                return { label: 'Acima da média', cls: 'bg-rose-50 text-rose-700 border-rose-200', min, avg, max, count: ps.length };
            };

            const resultado = useMemo(() => {
                if (pendentes.length === 0) return { cards: [], split: null };

                const acharOfertaNoMercado = (itemLista, prod, mercado) => {
                    const mNorm = normalizar(mercado);
                    const candidatas = [];

                    ofertasSiteAtivas.filter(ehOfertaVigente).forEach(o => {
                        if (normalizar(o.mercado) !== mNorm) return;
                        let bateu = false;
                        if (prod && o.id_item_estoque && o.id_item_estoque === prod.id) bateu = true;
                        else if (prod && o.prod && o.prod.id === prod.id) bateu = true;
                        else {
                            const tItem = tokensNome(itemLista.product_name);
                            const setOf = new Set(tokensNome(o.produto));
                            if (tItem.length > 0 && tItem.every(t => setOf.has(t)) && tItem.length / Math.max(setOf.size, 1) >= 0.35) {
                                bateu = true;
                            }
                        }
                        if (bateu && Number(o.preco) > 0) {
                            candidatas.push({
                                preco: Number(o.preco),
                                nomeOferta: o.produto,
                                marca: o.marca || (prod && prod.brand) || '',
                                link: o.link || LINKS_MERCADOS[mercado] || '',
                                data: o.data
                            });
                        }
                    });

                    if (prod) {
                        historicoPrecos
                            .filter(h => h.from_site && ehOfertaVigente(h) && h.product_id === prod.id && normalizar(h.source) === mNorm && Number(h.price) > 0)
                            .forEach(h => {
                                candidatas.push({
                                    preco: Number(h.price),
                                    nomeOferta: h.product_name || prod.name,
                                    marca: h.brand || prod.brand || '',
                                    link: h.link || LINKS_MERCADOS[mercado] || '',
                                    data: h.date
                                });
                            });
                    }

                    if (candidatas.length === 0) return null;
                    candidatas.sort((a, b) => a.preco - b.preco);
                    return candidatas[0];
                };

                const obterPrecoBaseMercado = (itemLista, prod, mercado) => {
                    const mNorm = normalizar(mercado);
                    if (prod) {
                        const notasMercado = historicoPrecos
                            .filter(h => !h.from_site && (h.from_nota || h.purchase_id) && h.product_id === prod.id && normalizar(h.source) === mNorm && Number(h.price) > 0)
                            .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                        if (notasMercado.length > 0) {
                            return { preco: Number(notasMercado[0].price), origem: 'nota_mercado', dataNota: notasMercado[0].date };
                        }
                        const notasGerais = historicoPrecos
                            .filter(h => !h.from_site && h.product_id === prod.id && Number(h.price) > 0)
                            .map(h => Number(h.price));
                        if (notasGerais.length > 0) {
                            const mediaNotas = notasGerais.reduce((a, b) => a + b, 0) / notasGerais.length;
                            return { preco: Number(mediaNotas.toFixed(2)), origem: 'media_notas' };
                        }
                    }
                    if (Number(itemLista.default_price) > 0) return { preco: Number(itemLista.default_price), origem: 'padrao' };
                    if (prod && Number(prod.default_price) > 0) return { preco: Number(prod.default_price), origem: 'padrao' };
                    return { preco: 0, origem: 'sem_preco' };
                };

                const melhorPorItem = new Map();

                const cards = mercados.map(mercado => {
                    let somaOfertas = 0;
                    let somaBase = 0;
                    let somaReferenciaOfertas = 0;
                    const itensEmOferta = [];
                    const itensPadrao = [];
                    let itensSemPrecoBase = 0;

                    pendentes.forEach(item => {
                        const prod = item.product_id
                            ? produtos.find(p => p.id === item.product_id)
                            : acharProdutoDaOferta(item.product_name, produtos);
                        const qtd = Number(item.quantity || 1) > 0 ? Number(item.quantity) : 1;
                        const baseInfo = obterPrecoBaseMercado(item, prod, mercado);
                        const precoRefLista = Number(item.default_price) > 0 ? Number(item.default_price) : (prod && Number(prod.default_price) > 0 ? Number(prod.default_price) : baseInfo.preco);
                        const oferta = acharOfertaNoMercado(item, prod, mercado);

                        const precoEfetivo = oferta ? oferta.preco : baseInfo.preco;
                        if (precoEfetivo > 0) {
                            const atualBest = melhorPorItem.get(item.id);
                            const sub = precoEfetivo * qtd;
                            if (!atualBest || (!apenasOfertas ? sub < atualBest.subtotal : (oferta && (!atualBest.ehOferta || sub < atualBest.subtotal)))) {
                                if (!apenasOfertas || oferta) {
                                    melhorPorItem.set(item.id, {
                                        itemId: item.id,
                                        nome: oferta ? oferta.nomeOferta : item.product_name,
                                        mercado,
                                        qtd,
                                        precoUnit: precoEfetivo,
                                        subtotal: sub,
                                        ehOferta: !!oferta
                                    });
                                }
                            }
                        }

                        if (oferta) {
                            const subOferta = oferta.preco * qtd;
                            somaOfertas += subOferta;
                            if (precoRefLista > 0) somaReferenciaOfertas += precoRefLista * qtd;
                            const normInfo = calcularPrecoNormalizado(oferta.nomeOferta || item.product_name, oferta.preco, prod && prod.peso_por_unidade, prod && prod.unit);
                            const termometro = calcularTermometro(prod, oferta.preco);
                            itensEmOferta.push({
                                id: item.id,
                                prodId: prod ? prod.id : '',
                                nomeLista: item.product_name,
                                nomeOferta: oferta.nomeOferta,
                                marca: oferta.marca,
                                qtd,
                                precoOferta: oferta.preco,
                                precoBase: precoRefLista,
                                subtotal: subOferta,
                                normInfo,
                                termometro,
                                link: oferta.link
                            });
                        } else {
                            if (baseInfo.preco <= 0) itensSemPrecoBase++;
                            const subBase = baseInfo.preco * qtd;
                            somaBase += subBase;
                            itensPadrao.push({
                                id: item.id,
                                nomeLista: item.product_name,
                                qtd,
                                precoBase: baseInfo.preco,
                                origem: baseInfo.origem,
                                dataNota: baseInfo.dataNota || '',
                                subtotal: subBase
                            });
                        }
                    });

                    const totalEstimado = Number((apenasOfertas ? somaOfertas : (somaOfertas + somaBase)).toFixed(2));
                    const economiaReal = Number(Math.max(0, somaReferenciaOfertas - somaOfertas).toFixed(2));

                    return {
                        mercado,
                        linkMercado: LINKS_MERCADOS[mercado] || '',
                        totalItensLista: pendentes.length,
                        totalEmOferta: itensEmOferta.length,
                        somaOfertas: Number(somaOfertas.toFixed(2)),
                        somaBase: Number(somaBase.toFixed(2)),
                        totalEstimado,
                        economiaReal,
                        itensEmOferta,
                        itensPadrao,
                        itensSemPrecoBase
                    };
                });

                cards.sort((a, b) => {
                    if (apenasOfertas) {
                        if (b.totalEmOferta !== a.totalEmOferta) return b.totalEmOferta - a.totalEmOferta;
                        if (a.somaOfertas > 0 && b.somaOfertas > 0) return a.somaOfertas - b.somaOfertas;
                        return 0;
                    }
                    if (a.totalEstimado > 0 && b.totalEstimado > 0) return a.totalEstimado - b.totalEstimado || b.totalEmOferta - a.totalEmOferta;
                    return b.totalEmOferta - a.totalEmOferta;
                });

                const grupos = {};
                let totalDividido = 0;
                melhorPorItem.forEach(m => {
                    if (!grupos[m.mercado]) grupos[m.mercado] = [];
                    grupos[m.mercado].push(m);
                    totalDividido += m.subtotal;
                });
                const melhorUnicoCard = cards.find(c => c.totalEstimado > 0) || cards[0];
                const melhorUnicoTotal = melhorUnicoCard ? melhorUnicoCard.totalEstimado : 0;
                const economiaDivisao = Number(Math.max(0, melhorUnicoTotal - totalDividido).toFixed(2));

                return {
                    cards,
                    split: {
                        grupos,
                        qtdMercados: Object.keys(grupos).length,
                        totalDividido: Number(totalDividido.toFixed(2)),
                        melhorUnicoTotal,
                        melhorUnicoNome: melhorUnicoCard ? melhorUnicoCard.mercado : '',
                        economiaDivisao
                    }
                };
            }, [pendentes, mercados, produtos, historicoPrecos, ofertasSiteAtivas, apenasOfertas]);

            const vencedor = resultado.cards.find(r => r.totalEstimado > 0 || r.totalEmOferta > 0) || resultado.cards[0];

            return (
                <div className="space-y-5">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h2 className="text-base font-bold text-slate-900">Comparativo de Estabelecimentos</h2>
                                <p className="text-xs text-slate-500">Cálculo baseado em {pendentes.length} item(ns) da lista cruzados com histórico e encartes.</p>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                {onUploadNF && (
                                    <button onClick={onUploadNF} className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-2 rounded-xl transition flex items-center gap-1.5 border border-slate-200">

                                        <p className="text-xs text-slate-300 mt-0.5">
                                            {vencedor.totalEmOferta} de {vencedor.totalItensLista} itens em promoção
                                            {vencedor.economiaReal > 0 ? ` • Economia estimada: R$ ${dinheiro(vencedor.economiaReal)}` : ''}
                                        </p>
                                    </div>
                                    <div className="text-left sm:text-right bg-white/10 px-4 py-2.5 rounded-xl border border-white/10">
                                        <p className="text-[10px] text-slate-400">Total Estimado</p>
                                        <p className="text-xl font-bold text-white">R$ {dinheiro(vencedor.totalEstimado)}</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {resultado.cards.map((card, idx) => {
                                    const ehMelhor = idx === 0 && (card.totalEstimado > 0 || card.totalEmOferta > 0);
                                    return (
                                        <div key={card.mercado} className={`bg-white rounded-2xl p-5 shadow-sm border flex flex-col justify-between space-y-4 ${ehMelhor ? 'border-slate-900 ring-1 ring-slate-900' : 'border-slate-200'}`}>
                                            <div className="space-y-3">
                                                <div className="flex justify-between items-start gap-2">
                                                    <div>
                                                        <h3 className="text-sm font-semibold text-slate-900">{card.mercado}</h3>
                                                        <span className="text-[11px] text-slate-400">{card.totalEmOferta} de {card.totalItensLista} em promoção</span>
                                                    </div>
                                                    {card.linkMercado && (
                                                        <a href={card.linkMercado} target="_blank" rel="noopener noreferrer" className="text-[11px] text-slate-500 hover:text-slate-900 font-medium flex items-center gap-1">
                                                            <span>Encarte</span>
                                                            <Icon name="external-link" className="w-3 h-3" />
                                                        </a>
                                                    )}
                                                </div>

                                                <div className="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100 text-center">
                                                    <div>
                                                        <p className="text-[10px] text-slate-400">Total</p>
                                                        <p className="text-sm font-bold text-slate-900">R$ {dinheiro(card.totalEstimado)}</p>
                                                    </div>
                                                    <div>
                                                        <p className="text-[10px] text-slate-400">Economia</p>
                                                        <p className="text-sm font-bold text-emerald-700">R$ {dinheiro(card.economiaReal)}</p>
                                                    </div>
                                                </div>

                                                <div className="space-y-1.5 pt-2 border-t border-slate-100">
                                                    <p className="text-xs font-semibold text-slate-700">Itens em promoção ({card.itensEmOferta.length}):</p>
                                                    {card.itensEmOferta.length > 0 ? (
                                                        <div className="space-y-1.5 max-h-48 overflow-y-auto">
                                                            {card.itensEmOferta.map(it => {
                                                                const tid = `${card.mercado}|${it.id}`;
                                                                const termoAberto = !!termometrosAbertos[tid];
                                                                return (
                                                                    <div key={it.id} className="p-2.5 bg-slate-50 border border-slate-100 rounded-lg text-xs space-y-1">
                                                                        <div className="flex justify-between items-center gap-2">
                                                                            <div className="min-w-0">
                                                                                <p className="font-semibold text-slate-800 truncate">{it.qtd}x {it.nomeOferta}</p>
                                                                                <p className="text-[10px] text-slate-500">Unidade: R$ {dinheiro(it.precoOferta)} {it.normInfo ? `• ${it.normInfo.texto}` : ''}</p>
                                                                            </div>
                                                                            <div className="text-right shrink-0">
                                                                                <span className="font-bold text-slate-900 block">R$ {dinheiro(it.subtotal)}</span>
                                                                                {it.termometro && (
                                                                                    <button
                                                                                        type="button"
                                                                                        onClick={() => setTermometrosAbertos(prev => ({ ...prev, [tid]: !prev[tid] }))}

                                                                                        {it.termometro.label}
                                                                                    </button>

                                                                                <span>Mín: R$ {dinheiro(it.termometro.min)} • Média: R$ {dinheiro(it.termometro.avg)}</span>

                                                        <p className="text-[11px] text-slate-400 italic">Nenhum item da lista com oferta ativa nesta loja.</p>

                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {resultado.split && resultado.split.qtdMercados > 1 && (
                                <details className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                                    <summary className="cursor-pointer text-xs font-semibold text-slate-700 flex justify-between items-center">
                                        <span>Cenário de Compra Dividida</span>
                                        <span className="text-[11px] text-slate-500 font-normal">Economia potencial: R$ {dinheiro(resultado.split.economiaDivisao)}</span>
                                    </summary>

                                        {Object.entries(resultado.split.grupos).map(([merc, lista]) => (
                                            <div key={merc} className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs flex justify-between items-center">
                                                <span className="font-medium text-slate-800">{merc} ({lista.length} itens)</span>
                                                <span className="font-semibold text-slate-900">R$ {dinheiro(lista.reduce((a, b) => a + b.subtotal, 0))}</span>
                                            </div>

                                    </div>
                                </details>
                            )}
                        </>
                    )}

            );

        function OfertasView({ ofertas, ofertasSiteAtivas, produtos, onFotoAmpliada }) {
            const [mercadoFiltro, setMercadoFiltro] = useState('Todos');
            const [origemFiltro, setOrigemFiltro] = useState('todas');

            const todasOfertas = useMemo(() => {
                const mapa = new Map();

                ofertas.forEach(o => {
                    const key = `${normalizar(o.estabelecimento)}|${normalizar(o.name)}`;
                    mapa.set(key, {
                        key,
                        tipo: 'proprio',
                        nome: o.name,
                        marca: o.brand || '',
                        estabelecimento: o.estabelecimento,
                        precoAtual: o.precoAtual,
                        media: o.media,
                        desconto: o.desconto,
                        economia: o.economia,
                        data: o.dataPreco,
                        image_url: o.image_url,
                        link: o.link || LINKS_MERCADOS[o.estabelecimento] || ''
                    });
                });

                ofertasSiteAtivas.filter(ehOfertaVigente).forEach(o => {
                    const nomeRef = o.prod ? o.prod.name : o.produto;
                    const key = `${normalizar(o.mercado)}|${normalizar(nomeRef)}`;
                    if (mapa.has(key)) {
                        const existente = mapa.get(key);
                        if (!existente.marca && (o.marca || (o.prod && o.prod.brand))) {
                            existente.marca = o.marca || (o.prod && o.prod.brand) || '';
                        }
                        if (!existente.link && o.link) existente.link = o.link;
                        return;
                    }
                    mapa.set(key, {
                        key,
                        tipo: o.prod ? 'proprio' : 'site',
                        nome: o.produto,
                        marca: o.marca || (o.prod && o.prod.brand) || '',
                        estabelecimento: o.mercado,
                        precoAtual: o.preco,
                        media: null,
                        desconto: o.vsMedia && o.vsMedia > 0 ? o.vsMedia : null,
                        economia: null,
                        data: o.data,
                        image_url: o.prod ? o.prod.image_url : '',
                        link: o.link || LINKS_MERCADOS[o.mercado] || ''
                    });
                });

                return Array.from(mapa.values()).sort((a, b) => (b.desconto || 0) - (a.desconto || 0) || (b.data || '').localeCompare(a.data || ''));
            }, [ofertas, ofertasSiteAtivas]);

            const mercadosDisponiveis = useMemo(() => {
                const base = INITIAL_ESTABLISHMENTS.filter(m => m !== 'Outro');
                const setM = new Set(base);
                todasOfertas.forEach(o => { if (o.estabelecimento) setM.add(o.estabelecimento); });
                return Array.from(setM);
            }, [todasOfertas]);

            const filtradas = todasOfertas.filter(o =>
                (mercadoFiltro === 'Todos' || o.estabelecimento === mercadoFiltro) &&
                (origemFiltro === 'todas' || o.tipo === 'proprio')
            );

            return (
                <div className="space-y-5">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                                <h2 className="text-base font-bold text-slate-900">Ofertas Vigentes</h2>
                                <p className="text-xs text-slate-500">Promoções ativas com dados extraídos dos encartes e notas.</p>
                            </div>
                            <div className="flex gap-1.5">
                                <button onClick={() => setOrigemFiltro('todas')} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${origemFiltro === 'todas' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}>Todas ({todasOfertas.length})</button>
                                <button onClick={() => setOrigemFiltro('proprio')} className={`px-3 py-1.5 rounded-lg text-xs font-medium ${origemFiltro === 'proprio' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}>Apenas Cadastrados</button>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                            <button onClick={() => setMercadoFiltro('Todos')} className={`px-2.5 py-1 rounded-lg text-xs font-medium ${mercadoFiltro === 'Todos' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}>Todos</button>
                            {mercadosDisponiveis.map(m => (
                                <button key={m} onClick={() => setMercadoFiltro(m)} className={`px-2.5 py-1 rounded-lg text-xs font-medium ${mercadoFiltro === m ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600'}`}>{m.replace('Supermercado ', '')}</button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        {filtradas.map(o => (
                            <div key={o.key} className="rounded-2xl p-4 shadow-sm border border-slate-200 bg-white flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-start gap-2 mb-2">
                                        <span className="text-[10px] font-medium bg-slate-100 text-slate-600 px-2 py-0.5 rounded">{o.estabelecimento}</span>
                                        {o.desconto !== null && <span className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded">-{o.desconto.toFixed(0)}%</span>}
                                    </div>
                                    <div className="flex items-center space-x-3 my-2">
                                        {o.image_url && <img onClick={() => onFotoAmpliada({ url: o.image_url, nome: o.nome })} src={o.image_url} alt="" className="w-10 h-10 rounded-lg object-cover border cursor-pointer shrink-0" />}
                                        <div className="min-w-0">
                                            <h4 className="text-xs sm:text-sm font-semibold text-slate-900 truncate">{o.nome}</h4>
                                            {o.marca && <span className="text-[10px] text-slate-400">Marca: {o.marca}</span>}
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 grid grid-cols-2 gap-2 text-center my-2">
                                        <div>
                                            <p className="text-[10px] text-slate-400">Referência</p>
                                            <p className="text-xs font-medium text-slate-500">{o.media ? `R$ ${dinheiro(o.media)}` : (o.data || 'Recente')}</p>
                                        </div>
                                        <div>
                                            <p className="text-[10px] text-slate-400">Preço Atual</p>
                                            <p className="text-xs sm:text-sm font-bold text-slate-900">R$ {dinheiro(o.precoAtual)}</p>
                                        </div>
                                    </div>
                                </div>
                                <div className="pt-2 border-t border-slate-100 flex items-center justify-between gap-2">
                                    <span className="text-[10px] text-slate-400">{o.data || 'Encarte ativo'}</span>
                                    {/^https?:\/\//i.test(o.link) && (
                                        <a href={o.link} target="_blank" rel="noopener noreferrer" className="text-[11px] text-slate-700 hover:text-slate-900 font-semibold flex items-center gap-1">
                                            <span>Ver fonte</span>
                                            <Icon name="external-link" className="w-3 h-3" />
                                        </a>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                    {filtradas.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhuma oferta vigente encontrada neste filtro.</p>}
                </div>
            );
        }

        function PrecosView({ historicoPrecos }) {
            const [busca, setBusca] = useState('');

            const comparacao = useMemo(() => {
                const map = {};
                historicoPrecos.forEach(h => {
                    const nome = h.product_name || 'Produto';
                    if (!map[nome]) map[nome] = [];
                    map[nome].push(h);
                });
                return Object.entries(map).map(([nome, lista]) => {
                    const precos = lista.map(i => Number(i.price));
                    const menor = Math.min(...precos);
                    const maior = Math.max(...precos);
                    const media = precos.reduce((a, b) => a + b, 0) / precos.length;
                    const melhor = lista.find(i => Number(i.price) === menor);
                    return { nome, lista, menor, maior, media, melhorMercado: (melhor && melhor.source) || 'N/A' };
                }).filter(item => normalizar(item.nome).includes(normalizar(busca)));
            }, [historicoPrecos, busca]);

            return (
                <div className="space-y-5">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <h2 className="text-base font-bold text-slate-900">Histórico de Preços</h2>
                        <p className="text-xs text-slate-500">Média e menores valores registrados por produto.</p>
                    </div>
                    <input type="text" placeholder="Filtrar por produto..." value={busca} onChange={e => setBusca(e.target.value)} className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs shadow-sm focus:outline-none focus:ring-1 focus:ring-slate-900" />
                    <div className="space-y-3">
                        {comparacao.map(item => (
                            <div key={item.nome} className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-2">
                                    <div>
                                        <h4 className="text-xs sm:text-sm font-semibold text-slate-900">{item.nome}</h4>
                                        <p className="text-[11px] text-emerald-700 font-medium">Menor: R$ {dinheiro(item.menor)} ({item.melhorMercado})</p>
                                    </div>
                                    <div className="flex space-x-3 text-xs bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-100">
                                        <span>Média: <strong>R$ {dinheiro(item.media)}</strong></span>
                                        <span>Maior: <strong>R$ {dinheiro(item.maior)}</strong></span>
                                    </div>
                                </div>
                                <div className="space-y-1">
                                    {item.lista.slice(0, 4).map(reg => (
                                        <div key={reg.id} className="flex justify-between items-center text-xs p-2 bg-slate-50 rounded-lg">
                                            <span className="text-slate-600">{reg.date} — {reg.source}</span>
                                            <span className="font-semibold text-slate-900">R$ {dinheiro(reg.price)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                        {comparacao.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhum registro encontrado.</p>}
                    </div>
                </div>
            );
        }

        function GastosView({ compras, metricasGasto, estimativaProximaSemana }) {
            const porMercado = useMemo(() => {
                const map = {};
                compras.forEach(c => {
                    const m = c.notes || 'Outros';
                    map[m] = (map[m] || 0) + Number(c.total || 0);
                });
                return Object.entries(map).sort((a, b) => b[1] - a[1]);
            }, [compras]);

            return (
                <div className="space-y-5">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <h2 className="text-base font-bold text-slate-900">Métricas de Gastos</h2>
                        <p className="text-xs text-slate-500">Valores consolidados e previsão semanal.</p>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                            <p className="text-[11px] text-slate-400">Últimos 7 dias</p>
                            <h3 className="text-xl font-bold text-slate-900 mt-1">R$ {dinheiro(metricasGasto.semana)}</h3>
                        </div>
                        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                            <p className="text-[11px] text-slate-400">Mês Atual</p>
                            <h3 className="text-xl font-bold text-slate-900 mt-1">R$ {dinheiro(metricasGasto.mes)}</h3>
                        </div>
                        <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                            <p className="text-[11px] text-slate-400">Previsão Próxima Semana</p>
                            <h3 className="text-xl font-bold text-slate-900 mt-1">{estimativaProximaSemana.itensBase > 0 ? `R$ ${dinheiro(estimativaProximaSemana.total)}` : 'Sem dados'}</h3>
                        </div>
                    </div>
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Gastos por Estabelecimento</h3>
                        <div className="space-y-1.5">
                            {porMercado.map(([mercado, total]) => (
                                <div key={mercado} className="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl text-xs">
                                    <span className="font-medium text-slate-700">{mercado}</span>
                                    <span className="font-semibold text-slate-900">R$ {dinheiro(total)}</span>
                                </div>
                            ))}
                            {porMercado.length === 0 && <p className="text-xs text-slate-400 py-2">Sem registros de compras.</p>}
                        </div>
                    </div>
                </div>
            );
        }

        function RelatoriosView({ produtosComEstoque, consumos }) {
            const topConsumidos = useMemo(() => {
                const map = {};
                consumos.forEach(c => {
                    const n = c.product_name || 'Produto';
                    map[n] = (map[n] || 0) + Number(c.quantity || 0);
                });
                return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 5);
            }, [consumos]);

            const normal = produtosComEstoque.filter(p => p.stockTotal > p.minimum_stock).length;
            const acabando = produtosComEstoque.filter(p => p.stockTotal > 0 && p.stockTotal <= p.minimum_stock).length;
            const acabados = produtosComEstoque.filter(p => p.stockTotal <= 0).length;

            return (
                <div className="space-y-5">
                    <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                        <h2 className="text-base font-bold text-slate-900">Relatórios & Consumo</h2>
                        <p className="text-xs text-slate-500">Balanço das movimentações de estoque.</p>
                    </div>
                    <div className="grid grid-cols-3 gap-2">
                        <div className="bg-white border border-slate-200 rounded-xl p-3 text-center"><p className="text-lg font-bold text-slate-900">{normal}</p><p className="text-[10px] text-slate-500">Normais</p></div>
                        <div className="bg-white border border-slate-200 rounded-xl p-3 text-center"><p className="text-lg font-bold text-amber-700">{acabando}</p><p className="text-[10px] text-slate-500">Acabando</p></div>
                        <div className="bg-white border border-slate-200 rounded-xl p-3 text-center"><p className="text-lg font-bold text-rose-700">{acabados}</p><p className="text-[10px] text-slate-500">Esgotados</p></div>
                    </div>
                    <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                        <h3 className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Itens Mais Consumidos</h3>

        function ModalCatalogo({ produtos, onClose, onAdicionar }) {
            const [busca, setBusca] = useState('');
            const [selecionados, setSelecionados] = useState({});
            const [jaTenho, setJaTenho] = useState(false);
            const [salvando, setSalvando] = useState(false);

            const itens = useMemo(() => {
                const lista = [];
                Object.entries(CATALOGO).forEach(([categoria, arr]) => {
                    arr.forEach(([nome, unidade, qtd, min]) => {
                        lista.push({ id: `cat_${slug(nome)}`, nome, categoria, unidade, qtd, min });
                    });
                });
                return lista;
            }, []);

            const nomesExistentes = useMemo(() => new Set(produtos.map(p => normalizar(p.name))), [produtos]);
            const idsExistentes = useMemo(() => new Set(produtos.map(p => p.id)), [produtos]);
            const jaCadastrado = (it) => idsExistentes.has(it.id) || nomesExistentes.has(normalizar(it.nome));

            const termo = normalizar(busca);
            const visiveis = itens.filter(it => !termo || normalizar(it.nome).includes(termo) || normalizar(it.categoria).includes(termo));
            const categorias = [...new Set(visiveis.map(i => i.categoria))];
            const totalSel = Object.keys(selecionados).filter(k => selecionados[k]).length;

            const alternar = (it) => setSelecionados(prev => ({ ...prev, [it.id]: !prev[it.id] }));
            const marcarCategoria = (cat) => {
                const doGrupo = visiveis.filter(i => i.categoria === cat && !jaCadastrado(i));
                const todosMarcados = doGrupo.every(i => selecionados[i.id]);
                setSelecionados(prev => {
                    const novo = { ...prev };
                    doGrupo.forEach(i => { novo[i.id] = !todosMarcados; });
                    return novo;
                });
            };

            const confirmar = async () => {
                const escolhidos = itens.filter(i => selecionados[i.id] && !jaCadastrado(i));
                if (escolhidos.length === 0) return;
                setSalvando(true);
                await onAdicionar(escolhidos, jaTenho);
                setSalvando(false);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[55] p-4">
                    <div className="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-xl border border-slate-200">
                        <div className="p-4 border-b border-slate-100 space-y-2">
                            <div className="flex justify-between items-center">
                                <h3 className="text-sm font-bold text-slate-900">Catálogo de Alimentos e Limpeza</h3>
                                <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon name="x" className="w-4 h-4" /></button>
                            </div>
                            <input type="text" placeholder="Pesquisar itens..." value={busca} onChange={e => setBusca(e.target.value)} className="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs" />
                            <label className="flex items-center space-x-2 text-xs text-slate-600 cursor-pointer">
                                <input type="checkbox" checked={jaTenho} onChange={e => setJaTenho(e.target.checked)} className="accent-slate-900" />
                                <span>Iniciar com estoque padrão em casa</span>
                            </label>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            {categorias.map(cat => (
                                <div key={cat}>
                                    <div className="flex justify-between items-center mb-1.5">
                                        <h4 className="text-[11px] font-bold uppercase tracking-wider text-slate-400">{cat}</h4>
                                        <button onClick={() => marcarCategoria(cat)} className="text-[11px] text-slate-700 font-semibold hover:underline">Selecionar todos</button>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                                        {visiveis.filter(i => i.categoria === cat).map(it => {
                                            const ja = jaCadastrado(it);
                                            return (
                                                <label key={it.id} className={`flex items-center space-x-2 p-2 rounded-lg border text-xs ${ja ? 'bg-slate-50 text-slate-400 border-slate-100' : selecionados[it.id] ? 'bg-slate-50 border-slate-900 font-medium' : 'bg-white border-slate-200 hover:bg-slate-50'}`}>
                                                    <input type="checkbox" disabled={ja} checked={ja || !!selecionados[it.id]} onChange={() => alternar(it)} className="accent-slate-900" />
                                                    <span className="flex-1 truncate">{it.nome}</span>
                                                    <span className="text-[10px] text-slate-400">{ja ? 'já salvo' : it.unidade}</span>
                                                </label>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="p-4 border-t border-slate-100 flex justify-between items-center gap-2">
                            <span className="text-xs text-slate-500">{totalSel} selecionado(s)</span>
                            <div className="flex space-x-2">
                                <button onClick={onClose} className="px-3 py-1.5 text-xs text-slate-600">Cancelar</button>
                                <button onClick={confirmar} disabled={totalSel === 0 || salvando} className="bg-slate-900 text-white px-4 py-1.5 rounded-xl text-xs font-semibold disabled:opacity-40">
                                    Adicionar Selecionados
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ModalProduto({ produto, produtosComEstoque, categories, onClose, onSalvo, mostrarToast }) {
            const novo = !produto;
            const [name, setName] = useState(produto ? produto.name : '');
            const [category, setCategory] = useState(produto ? produto.category : categories[0]);
            const [brand, setBrand] = useState(produto ? (produto.brand || '') : '');
            const [unit, setUnit] = useState(produto ? produto.unit : 'unidade');
            const [defaultQty, setDefaultQty] = useState(produto ? produto.default_quantity : 1);
            const [minStock, setMinStock] = useState(produto ? produto.minimum_stock : 1);
            const [defaultPrice, setDefaultPrice] = useState(produto && Number(produto.default_price) > 0 ? produto.default_price : '');
            const [localEstoque, setLocalEstoque] = useState(() => obterLocalEstoque(produto, null));
            const todosLocais = useMemo(() => obterTodosLocais(produtosComEstoque), [produtosComEstoque]);
            const [essencial, setEssencial] = useState(produto ? !!produto.essencial : false);
            const [pesoPorUnidade, setPesoPorUnidade] = useState(produto && Number(produto.peso_por_unidade) > 0 ? produto.peso_por_unidade : '');
            const [estoqueInicial, setEstoqueInicial] = useState(0);
            const [validadeInicial, setValidadeInicial] = useState('');
            const [notes, setNotes] = useState(produto ? (produto.notes || '') : '');
            const [imageUrl, setImageUrl] = useState(produto ? (produto.image_url || '') : '');
            const [processandoFoto, setProcessandoFoto] = useState(false);
            const [salvando, setSalvando] = useState(false);

            const handleFoto = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setProcessandoFoto(true);
                try {
                    setImageUrl(await comprimirImagem(file, 420, 0.72));
                } catch (err) {
                    mostrarToast('Erro ao processar imagem.', 'erro');
                } finally {
                    setProcessandoFoto(false);
                    e.target.value = '';
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!name.trim()) return;
                setSalvando(true);
                try {
                    const id = produto ? produto.id : `prod_${Date.now()}`;
                    await CB.saveDoc('products', id, {
                        name: name.trim(), category, brand: brand.trim(), unit: unit.trim() || 'unidade',
                        default_quantity: Number(defaultQty) || 1, minimum_stock: Number(minStock) || 0,
                        default_price: Number(defaultPrice) || 0, local_estoque: localEstoque,
                        essencial: essencial, peso_por_unidade: Number(pesoPorUnidade) || 0,
                        image_url: imageUrl, notes: notes.trim(), is_demo: false
                    });
                    if (novo && Number(estoqueInicial) > 0) {
                        await CB.saveDoc('product_expiration', `lote_${id}_ini`, {
                            product_id: id, quantity: Number(estoqueInicial), expiration_date: validadeInicial || '',
                            local_estoque: localEstoque, is_demo: false
                        });
                    }
                    onSalvo();
                } catch (err) {
                    console.error(err);
                    mostrarToast('Erro ao salvar produto.', 'erro');
                } finally {
                    setSalvando(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[56] p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl my-6 space-y-4 border border-slate-200">
                        <h3 className="text-sm font-bold text-slate-900">{produto ? 'Editar Produto' : 'Cadastrar Novo Item'}</h3>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div className="flex items-center space-x-3 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <div className="w-16 h-16 bg-white rounded-lg flex items-center justify-center overflow-hidden border border-slate-200 shrink-0">
                                    {imageUrl ? <img src={imageUrl} alt="" className="w-full h-full object-cover" /> : <Icon name="camera" className="w-5 h-5 text-slate-400" />}
                                </div>
                                <div className="flex-1 text-xs space-y-1">
                                    <p className="font-semibold text-slate-800">Foto do Produto (opcional)</p>
                                    <div className="flex gap-2">
                                        <label className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-md text-[11px] font-medium cursor-pointer border border-slate-200">
                                            Carregar
                                            <input type="file" accept="image/*" onChange={handleFoto} className="hidden" />
                                        </label>
                                        {imageUrl && <button type="button" onClick={() => setImageUrl('')} className="text-[11px] text-rose-600 hover:underline">Remover</button>}
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-medium text-slate-600 mb-1">Nome do item *</label>
                                <input type="text" required placeholder="Ex: Arroz Branco 5kg" value={name} onChange={e => setName(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Categoria</label>
                                    <select value={category} onChange={e => {
                                        const c = e.target.value;
                                        setCategory(c);
                                        if (novo) setLocalEstoque(inferirLocalCategoria(c));
                                    }} className="w-full border rounded-xl px-2.5 py-2 text-xs bg-white">
                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Marca</label>
                                    <input type="text" placeholder="Ex: Camil" value={brand} onChange={e => setBrand(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <div>
                                    <label className="block text-xs font-medium text-slate-600 mb-1">Localização</label>
                                    <select value={localEstoque} onChange={e => {

                                            if (n) setLocalEstoque(n);
