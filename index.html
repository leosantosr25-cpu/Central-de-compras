                <div className="space-y-6">
                    <div className="flex justify-between items-center bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                        <div>
                            <h2 className="text-lg font-bold text-slate-800">🛒 Histórico de compras</h2>
                            <p className="text-xs text-slate-500">Notas e registros salvos.</p>
                        </div>
                        <button onClick={onNovaCompra} className="bg-violet-700 hover:bg-violet-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow transition">+ Nova compra</button>
                    </div>
                    <div className="space-y-3">
                        {compras.map(c => (
                            <div key={c.id} className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 flex justify-between items-center gap-3">
                                <div>
                                    <div className="flex flex-wrap items-center gap-2 mb-1">
                                        <span className="text-xs font-bold text-violet-700 bg-violet-50 px-2.5 py-1 rounded-lg">{c.purchase_date}</span>
                                        <span className="text-xs font-bold text-slate-700">{c.notes || 'Supermercado'}</span>
                                        {Array.isArray(c.photos) && c.photos.length > 0 && (
                                            <span className="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full">📷 {c.photos.length} foto(s)</span>
                                        )}
                                    </div>
                                    <p className="text-xs text-slate-500">{(c.purchase_items || []).length} produto(s)</p>
                                </div>
                                <div className="flex items-center space-x-3">
                                    <span className="text-sm font-bold text-slate-800">R$ {dinheiro(c.total)}</span>
                                    <button onClick={() => onVerDetalhes(c)} className="bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl text-xs font-bold">Ver itens</button>
                                </div>
                            </div>
                        ))}
                        {compras.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhuma compra registrada ainda.</p>}
                    </div>
                </div>
            );
        }

        function ListaComprasView({ listaCompras, produtos, historicoPrecos, itensAbaixoMinimo, onComprar, onComparar, executar, mostrarToast }) {
            const [novoItem, setNovoItem] = useState('');
            const [novoPrecoPadrao, setNovoPrecoPadrao] = useState('');

            const obterPrecoSugerido = (l) => {
                if (Number(l.default_price) > 0) return Number(l.default_price);
                const prod = l.product_id ? produtos.find(p => p.id === l.product_id) : acharProdutoDaOferta(l.product_name, produtos);
                if (prod && Number(prod.default_price) > 0) return Number(prod.default_price);
                if (prod) {
                    const h = historicoPrecos.find(x => x.product_id === prod.id && Number(x.price) > 0);
                    if (h) return Number(h.price);
                }
                return 0;
            };

            const adicionarManual = (e) => {
                e.preventDefault();
                if (!novoItem.trim()) return;
                const prod = acharProdutoDaOferta(novoItem.trim(), produtos);
                const pInformado = Number(novoPrecoPadrao) || (prod && Number(prod.default_price)) || 0;
                executar(async () => {
                    await CB.saveDoc('shopping_list', `item_${Date.now()}`, {
                        product_id: prod ? prod.id : '',
                        product_name: novoItem.trim(),
                        unit: prod ? prod.unit : 'unidade',
                        quantity: 1,
                        default_price: pInformado,
                        purchased: false
                    });
                    setNovoItem('');
                    setNovoPrecoPadrao('');
                    mostrarToast('Item adicionado à lista!');
                });
            };

            const adicionarTodosCriticos = () => executar(async () => {
                let n = 0;
                for (const p of itensAbaixoMinimo) {
                    if (listaCompras.some(l => !l.purchased && l.product_id === p.id)) continue;
                    const qtd = Math.max(Number(p.default_quantity || 1), Number(p.minimum_stock || 1) - p.stockTotal);
                    const h = historicoPrecos.find(x => x.product_id === p.id && Number(x.price) > 0);
                    const precoBase = Number(p.default_price) > 0 ? Number(p.default_price) : (h ? Number(h.price) : 0);
                    await CB.saveDoc('shopping_list', `auto_${p.id}`, {
                        product_id: p.id, product_name: p.name, unit: p.unit,
                        quantity: qtd > 0 ? qtd : 1, default_price: precoBase, purchased: false
                    });
                    n++;
                }
                mostrarToast(n > 0 ? `${n} item(ns) adicionado(s) à lista!` : 'Todos já estão na lista.');
            });

            const removerComprados = () => executar(async () => {
                for (const l of listaCompras.filter(x => x.purchased)) await CB.removeDoc('shopping_list', l.id);
                mostrarToast('Itens comprados removidos.');
            });

            const atualizarCampoLista = (l, campos) => executar(async () => {
                await CB.saveDoc('shopping_list', l.id, campos);
                if (l.product_id && campos.default_price !== undefined) {
                    await CB.saveDoc('products', l.product_id, { default_price: Number(campos.default_price) || 0 });
                }
            });

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h2 className="text-lg font-bold text-slate-800">📝 Lista de compras</h2>
                            <p className="text-xs text-slate-500">Defina quantidades e preços padrões para calcular onde compensa comprar.</p>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={onComparar} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow flex items-center space-x-1.5">
                                <Icon name="scale" className="w-4 h-4" />
                                <span>Onde compensa mais</span>
                            </button>
                            <button onClick={onComprar} className="bg-violet-700 hover:bg-violet-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">Registrar compra</button>
                        </div>
                    </div>

                    <form onSubmit={adicionarManual} className="flex flex-col sm:flex-row gap-2">
                        <input type="text" placeholder="Adicionar item (ex: arroz 5kg, sabão em pó)..." value={novoItem} onChange={e => setNovoItem(e.target.value)} className="flex-1 bg-white border rounded-2xl px-4 py-3 text-xs shadow-sm" />
                        <input type="number" step="0.01" min="0" placeholder="Preço padrão R$" value={novoPrecoPadrao} onChange={e => setNovoPrecoPadrao(e.target.value)} className="w-full sm:w-40 bg-white border rounded-2xl px-4 py-3 text-xs shadow-sm" />
                        <button type="submit" className="bg-violet-700 text-white px-5 py-3 rounded-2xl text-xs font-bold">Adicionar</button>
                    </form>

                    {itensAbaixoMinimo.length > 0 && (
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-amber-200 space-y-3">
                            <div className="flex flex-wrap justify-between items-center gap-2">
                                <h3 className="text-sm font-bold text-slate-800">Recomendações do estoque ({itensAbaixoMinimo.length})</h3>
                                <button onClick={adicionarTodosCriticos} className="text-xs bg-amber-100 text-amber-900 font-bold px-3 py-1.5 rounded-xl hover:bg-amber-200">Adicionar todos à lista</button>
                            </div>
                            {itensAbaixoMinimo.map(p => (
                                <div key={p.id} className="flex justify-between items-center p-3 rounded-2xl bg-amber-50/50 border border-amber-100 text-xs">
                                    <div>
                                        <p className="font-bold text-slate-800">{p.name}</p>
                                        <p className="text-[10px] text-slate-500">Restam: {p.stockTotal} {p.unit} (mín: {p.minimum_stock})</p>
                                    </div>
                                    <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full ${p.stockTotal <= 0 ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-800'}`}>
                                        {p.stockTotal <= 0 ? '🔴 Acabou' : '🟡 Acabando'}
                                    </span>
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200 space-y-2.5">
                        <div className="flex justify-between items-center mb-1">
                            <h3 className="text-sm font-bold text-slate-800">Minha lista ({listaCompras.length})</h3>
                            {listaCompras.some(l => l.purchased) && <button onClick={removerComprados} className="text-xs text-rose-600 font-bold hover:underline">Limpar comprados</button>}
                        </div>
                        {listaCompras.map(l => {
                            const precoPad = obterPrecoSugerido(l);
                            return (
                                <div key={l.id} className={`flex flex-wrap sm:flex-nowrap justify-between items-center gap-2 p-3.5 rounded-2xl border ${l.purchased ? 'bg-slate-100 opacity-60' : 'bg-slate-50'}`}>
                                    <label className="flex items-center space-x-3 cursor-pointer flex-1 min-w-[180px]">
                                        <input type="checkbox" checked={Boolean(l.purchased)} onChange={() => executar(() => CB.saveDoc('shopping_list', l.id, { purchased: !l.purchased }))} className="w-4 h-4 accent-violet-700 rounded" />
                                        <div>
                                            <span className={`text-xs font-bold text-slate-800 ${l.purchased ? 'line-through' : ''}`}>
                                                {l.product_name}
                                            </span>
                                            {l.unit && <span className="text-[10px] text-slate-400 ml-1.5">({l.unit})</span>}
                                        </div>
                                    </label>
                                    {!l.purchased && (
                                        <div className="flex items-center gap-2">
                                            <div className="flex items-center gap-1 bg-white border rounded-xl px-2 py-1">
                                                <span className="text-[10px] text-slate-400">Qtd:</span>
                                                <input
                                                    type="number"
                                                    step="0.5"
                                                    min="0.1"
                                                    defaultValue={l.quantity || 1}
                                                    onBlur={e => {
                                                        const v = Number(e.target.value);
                                                        if (v > 0 && v !== Number(l.quantity)) atualizarCampoLista(l, { quantity: v });
                                                    }}
                                                    className="w-12 text-xs font-bold text-slate-700 focus:outline-none"
                                                />
                                            </div>
                                            <div className="flex items-center gap-1 bg-white border rounded-xl px-2 py-1" title="Preço padrão usado quando o item não está em oferta">
                                                <span className="text-[10px] text-slate-400">Padrão R$</span>
                                                <input
                                                    type="number"
                                                    step="0.01"
                                                    min="0"
                                                    defaultValue={precoPad > 0 ? precoPad.toFixed(2) : ''}
                                                    placeholder="0.00"
                                                    onBlur={e => {
                                                        const v = Number(e.target.value || 0);
                                                        if (v >= 0 && v !== Number(l.default_price || 0)) atualizarCampoLista(l, { default_price: v });
                                                    }}
                                                    className="w-16 text-xs font-bold text-violet-800 focus:outline-none"
                                                />
                                            </div>
                                        </div>
                                    )}
                                    <button onClick={() => executar(() => CB.removeDoc('shopping_list', l.id))} className="text-rose-600 text-xs font-semibold hover:underline ml-2">Remover</button>
                                </div>
                            );
                        })}
                        {listaCompras.length === 0 && <p className="text-xs text-slate-400 py-4 text-center">Nenhum item na lista ainda.</p>}
                    </div>
                </div>
            );
        }

        function ComparativoMercadosView({ listaCompras, produtos, historicoPrecos, ofertasSiteAtivas, establishments, setAbaAtiva }) {
            const pendentes = useMemo(() => listaCompras.filter(l => !l.purchased), [listaCompras]);

            const mercados = useMemo(() => {
                const base = establishments.filter(e => e !== 'Outro');
                const setM = new Set(base);
                ofertasSiteAtivas.filter(ehOfertaVigente).forEach(o => { if (o.mercado) setM.add(o.mercado); });
                return Array.from(setM);
            }, [establishments, ofertasSiteAtivas]);

            const resultado = useMemo(() => {
                if (pendentes.length === 0) return [];

                const acharOfertaNoMercado = (itemLista, prod, mercado) => {
                    const mNorm = normalizar(mercado);
                    const candidatas = [];

                    ofertasSiteAtivas.filter(ehOfertaVigente).forEach(o => {
                        if (normalizar(o.mercado) !== mNorm) return;
                        let bateu = false;
                        if (prod && o.prod && o.prod.id === prod.id) bateu = true;
                        else {
                            const tItem = tokensNome(itemLista.product_name);
                            const setOf = new Set(tokensNome(o.produto));
                            if (tItem.length > 0 && tItem.every(t => setOf.has(t)) && tItem.length / Math.max(setOf.size, 1) >= 0.35) {
                                bateu = true;
                            }
                        }
                        if (bateu && Number(o.preco) > 0) {
                            candidatas.push({
                                preco: Number(o.preco),
                                nomeOferta: o.produto,
                                marca: o.marca || (prod && prod.brand) || '',
                                link: o.link || LINKS_MERCADOS[mercado] || '',
                                data: o.data
                            });
                        }
                    });

                    if (prod) {
                        historicoPrecos
                            .filter(h => h.from_site && ehOfertaVigente(h) && h.product_id === prod.id && normalizar(h.source) === mNorm && Number(h.price) > 0)
                            .forEach(h => {
                                candidatas.push({
                                    preco: Number(h.price),
                                    nomeOferta: h.product_name || prod.name,
                                    marca: h.brand || prod.brand || '',
                                    link: h.link || LINKS_MERCADOS[mercado] || '',
                                    data: h.date
                                });
                            });
                    }

                    if (candidatas.length === 0) return null;
                    candidatas.sort((a, b) => a.preco - b.preco);
                    return candidatas[0];
                };

                const obterPrecoPadrao = (itemLista, prod) => {
                    if (Number(itemLista.default_price) > 0) return Number(itemLista.default_price);
                    if (prod && Number(prod.default_price) > 0) return Number(prod.default_price);
                    if (prod) {
                        const ps = historicoPrecos.filter(h => h.product_id === prod.id && Number(h.price) > 0).map(h => Number(h.price));
                        if (ps.length > 0) return ps.reduce((a, b) => a + b, 0) / ps.length;
                    }
                    return 0;
                };

                const cards = mercados.map(mercado => {
                    let somaOfertas = 0;
                    let somaPadrao = 0;
                    let somaTudoPadrao = 0;
                    const itensEmOferta = [];
                    const itensPadrao = [];
                    let itensSemPrecoBase = 0;

                    pendentes.forEach(item => {
                        const prod = item.product_id
                            ? produtos.find(p => p.id === item.product_id)
                            : acharProdutoDaOferta(item.product_name, produtos);
                        const qtd = Number(item.quantity || 1) > 0 ? Number(item.quantity) : 1;
                        const precoPad = obterPrecoPadrao(item, prod);
                        const oferta = acharOfertaNoMercado(item, prod, mercado);

                        somaTudoPadrao += precoPad * qtd;

                        if (oferta) {
                            const subOferta = oferta.preco * qtd;
                            somaOfertas += subOferta;
                            itensEmOferta.push({
                                id: item.id,
                                nomeLista: item.product_name,
                                nomeOferta: oferta.nomeOferta,
                                marca: oferta.marca,
                                qtd,
                                precoOferta: oferta.preco,
                                precoPadrao: precoPad,
                                subtotal: subOferta,
                                link: oferta.link
                            });
                        } else {
                            if (precoPad <= 0) itensSemPrecoBase++;
                            const subPad = precoPad * qtd;
                            somaPadrao += subPad;
                            itensPadrao.push({
                                id: item.id,
                                nomeLista: item.product_name,
                                qtd,
                                precoPadrao: precoPad,
                                subtotal: subPad
                            });
                        }
                    });

                    const somaEstimada = Number((somaOfertas + somaPadrao).toFixed(2));
                    const economiaEstimada = Number(Math.max(0, somaTudoPadrao - somaEstimada).toFixed(2));

                    return {
                        mercado,
                        linkMercado: LINKS_MERCADOS[mercado] || '',
                        totalItensLista: pendentes.length,
                        totalEmOferta: itensEmOferta.length,
                        somaOfertas: Number(somaOfertas.toFixed(2)),
                        somaPadrao: Number(somaPadrao.toFixed(2)),
                        somaEstimada,
                        economiaEstimada,
                        itensEmOferta,
                        itensPadrao,
                        itensSemPrecoBase
                    };
                });

                cards.sort((a, b) => {
                    if (a.somaEstimada > 0 && b.somaEstimada > 0) return a.somaEstimada - b.somaEstimada || b.totalEmOferta - a.totalEmOferta;
                    return b.totalEmOferta - a.totalEmOferta;
                });

                return cards;
            }, [pendentes, mercados, produtos, historicoPrecos, ofertasSiteAtivas]);

            const vencedor = resultado.find(r => r.somaEstimada > 0 || r.totalEmOferta > 0) || resultado[0];

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h2 className="text-lg font-bold text-slate-800">⚖️ Onde compensa mais comprar hoje</h2>
                            <p className="text-xs text-slate-500">Cruza sua lista de compras ({pendentes.length} itens pendentes) com as ofertas vigentes + preços padrões.</p>
                        </div>
                        <button onClick={() => setAbaAtiva('lista')} className="bg-violet-100 hover:bg-violet-200 text-violet-800 text-xs font-bold px-4 py-2.5 rounded-xl">
                            Editar lista / preços padrão
                        </button>
                    </div>

                    {pendentes.length === 0 ? (
                        <div className="bg-white rounded-3xl p-8 text-center border border-slate-200 space-y-3">
                            <p className="text-sm font-bold text-slate-700">Sua lista de compras está vazia!</p>
                            <p className="text-xs text-slate-500">Adicione itens na aba Lista de Compras para calcular onde sai mais barato comprar.</p>
                            <button onClick={() => setAbaAtiva('lista')} className="bg-violet-700 text-white px-4 py-2 rounded-xl text-xs font-bold">Ir para Lista de Compras</button>
                        </div>
                    ) : (
                        <>
                            {vencedor && (
                                <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white rounded-3xl p-5 shadow-md flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div>
                                        <span className="text-[10px] font-bold uppercase tracking-wider bg-white/20 px-2.5 py-1 rounded-full">🏆 Melhor opção hoje</span>
                                        <h3 className="text-xl font-bold mt-2">{vencedor.mercado}</h3>
                                        <p className="text-xs text-emerald-100 mt-0.5">
                                            {vencedor.totalEmOferta} de {vencedor.totalItensLista} itens em oferta
                                            {vencedor.economiaEstimada > 0 ? ` • Economia estimada de R$ ${dinheiro(vencedor.economiaEstimada)} sobre seus preços padrões` : ''}
                                        </p>
                                    </div>
                                    <div className="text-left sm:text-right bg-black/15 px-4 py-3 rounded-2xl">
                                        <p className="text-[11px] text-emerald-100">Soma estimada da compra</p>
                                        <p className="text-2xl font-bold">R$ {dinheiro(vencedor.somaEstimada)}</p>
                                    </div>
                                </div>
                            )}

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {resultado.map((card, idx) => {
                                    const ehMelhor = idx === 0 && (card.somaEstimada > 0 || card.totalEmOferta > 0);
                                    const pctOferta = Math.round((card.totalEmOferta / Math.max(card.totalItensLista, 1)) * 100);
                                    return (
                                        <div key={card.mercado} className={`bg-white rounded-3xl p-5 shadow-sm border-2 flex flex-col justify-between space-y-4 ${ehMelhor ? 'border-emerald-500 ring-2 ring-emerald-100' : 'border-slate-200'}`}>
                                            <div className="space-y-3">
                                                <div className="flex justify-between items-start gap-2">
                                                    <div>
                                                        {ehMelhor && <span className="inline-block mb-1 text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-full">🏆 Mais Econômico</span>}
                                                        <h3 className="text-base font-bold text-slate-800">{card.mercado}</h3>
                                                    </div>
                                                    {card.linkMercado && (
                                                        <a href={card.linkMercado} target="_blank" rel="noopener noreferrer" className="text-[11px] text-violet-700 font-bold hover:underline flex items-center gap-1">
                                                            <span>Site</span>
                                                            <Icon name="external-link" className="w-3 h-3" />
                                                        </a>
                                                    )}
                                                </div>

                                                <div className="grid grid-cols-2 gap-2.5">
                                                    <div className="bg-violet-50/70 border border-violet-100 p-3 rounded-2xl">
                                                        <p className="text-[10px] text-slate-500 font-semibold">Itens em oferta</p>
                                                        <p className="text-sm font-bold text-violet-800">{card.totalEmOferta} de {card.totalItensLista} ({pctOferta}%)</p>
                                                    </div>
                                                    <div className={`${ehMelhor ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-50 border-slate-200'} border p-3 rounded-2xl`}>
                                                        <p className="text-[10px] text-slate-500 font-semibold">Soma estimada</p>
                                                        <p className={`text-sm font-bold ${ehMelhor ? 'text-emerald-800' : 'text-slate-800'}`}>R$ {dinheiro(card.somaEstimada)}</p>
                                                    </div>
                                                </div>

                                                <div className="text-[11px] text-slate-500 flex flex-wrap gap-x-3 gap-y-1">
                                                    <span>🏷️ Ofertas: <strong>R$ {dinheiro(card.somaOfertas)}</strong></span>
                                                    <span>📌 Preços padrão: <strong>R$ {dinheiro(card.somaPadrao)}</strong></span>
                                                    {card.itensSemPrecoBase > 0 && (
                                                        <span className="text-amber-700 font-semibold">⚠️ {card.itensSemPrecoBase} item(ns) sem preço padrão</span>
                                                    )}
                                                </div>

                                                <div className="space-y-1.5 pt-2 border-t">
                                                    <p className="text-xs font-bold text-slate-700">Itens em oferta neste mercado ({card.itensEmOferta.length}):</p>
                                                    {card.itensEmOferta.length > 0 ? (
                                                        <div className="space-y-1.5 max-h-48 overflow-y-auto">
                                                            {card.itensEmOferta.map(it => (
                                                                <div key={it.id} className="flex justify-between items-center p-2.5 bg-emerald-50/60 border border-emerald-100 rounded-xl text-xs gap-2">
                                                                    <div className="min-w-0">
                                                                        <p className="font-bold text-slate-800 truncate">{it.qtd}x {it.nomeOferta}</p>
                                                                        <p className="text-[10px] text-slate-500">
                                                                            {it.marca ? `Marca: ${it.marca} • ` : ''}
                                                                            Un: R$ {dinheiro(it.precoOferta)}
                                                                            {it.precoPadrao > 0 ? ` (padrão R$ ${dinheiro(it.precoPadrao)})` : ''}
                                                                        </p>
                                                                    </div>
                                                                    <div className="text-right shrink-0">
                                                                        <span className="font-bold text-emerald-700 block">R$ {dinheiro(it.subtotal)}</span>
                                                                        {it.link && (
                                                                            <a href={it.link} target="_blank" rel="noopener noreferrer" className="text-[10px] text-violet-700 font-bold hover:underline">Fonte ↗</a>
                                                                        )}
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    ) : (
                                                        <p className="text-[11px] text-slate-400 italic">Nenhum item da sua lista em oferta aqui hoje.</p>
                                                    )}
                                                </div>

                                                {card.itensPadrao.length > 0 && (
                                                    <details className="text-xs">
                                                        <summary className="cursor-pointer text-[11px] font-bold text-slate-500 hover:text-violet-700">
                                                            Ver {card.itensPadrao.length} item(ns) calculado(s) pelo preço padrão
                                                        </summary>
                                                        <div className="space-y-1 mt-2 max-h-36 overflow-y-auto">
                                                            {card.itensPadrao.map(it => (
                                                                <div key={it.id} className="flex justify-between items-center px-2.5 py-1.5 bg-slate-50 rounded-lg text-[11px]">
                                                                    <span className="text-slate-700 truncate">{it.qtd}x {it.nomeLista}</span>
                                                                    <span className={`font-semibold ${it.precoPadrao > 0 ? 'text-slate-700' : 'text-amber-600'}`}>
                                                                        {it.precoPadrao > 0 ? `R$ ${dinheiro(it.subtotal)}` : 'Sem preço'}
                                                                    </span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </details>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        function OfertasView({ ofertas, ofertasSiteAtivas, produtos, onFotoAmpliada }) {
            const [mercadoFiltro, setMercadoFiltro] = useState('Todos');
            const [origemFiltro, setOrigemFiltro] = useState('todas');

            const todasOfertas = useMemo(() => {
                const mapa = new Map();

                ofertas.forEach(o => {
                    const key = `${normalizar(o.estabelecimento)}|${normalizar(o.name)}`;
                    mapa.set(key, {
                        key,
                        tipo: 'proprio',
                        nome: o.name,
                        marca: o.brand || '',
                        estabelecimento: o.estabelecimento,
                        precoAtual: o.precoAtual,
                        media: o.media,
                        desconto: o.desconto,
                        economia: o.economia,
                        data: o.dataPreco,
                        image_url: o.image_url,
                        link: o.link || LINKS_MERCADOS[o.estabelecimento] || ''
                    });
                });

                ofertasSiteAtivas.filter(ehOfertaVigente).forEach(o => {
                    const nomeRef = o.prod ? o.prod.name : o.produto;
                    const key = `${normalizar(o.mercado)}|${normalizar(nomeRef)}`;
                    if (mapa.has(key)) {
                        const existente = mapa.get(key);
                        if (!existente.marca && (o.marca || (o.prod && o.prod.brand))) {
                            existente.marca = o.marca || (o.prod && o.prod.brand) || '';
                        }
                        if (!existente.link && o.link) existente.link = o.link;
                        return;
                    }
                    mapa.set(key, {
                        key,
                        tipo: o.prod ? 'proprio' : 'site',
                        nome: o.produto,
                        marca: o.marca || (o.prod && o.prod.brand) || '',
                        estabelecimento: o.mercado,
                        precoAtual: o.preco,
                        media: null,
                        desconto: o.vsMedia && o.vsMedia > 0 ? o.vsMedia : null,
                        economia: null,
                        data: o.data,
                        image_url: o.prod ? o.prod.image_url : '',
                        link: o.link || LINKS_MERCADOS[o.mercado] || ''
                    });
                });

                return Array.from(mapa.values()).sort((a, b) => (b.desconto || 0) - (a.desconto || 0) || (b.data || '').localeCompare(a.data || ''));
            }, [ofertas, ofertasSiteAtivas]);

            const mercadosDisponiveis = useMemo(() => {
                const base = INITIAL_ESTABLISHMENTS.filter(m => m !== 'Outro');
                const setM = new Set(base);
                todasOfertas.forEach(o => { if (o.estabelecimento) setM.add(o.estabelecimento); });
                return Array.from(setM);
            }, [todasOfertas]);

            const filtradas = todasOfertas.filter(o =>
                (mercadoFiltro === 'Todos' || o.estabelecimento === mercadoFiltro) &&
                (origemFiltro === 'todas' || o.tipo === 'proprio')
            );

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200 space-y-3">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                                <h2 className="text-lg font-bold text-slate-800">🏷️ Ofertas vigentes</h2>
                                <p className="text-xs text-slate-500">Apenas promoções ativas e não expiradas dos mercados e dos seus produtos.</p>
                            </div>
                            <div className="flex gap-1.5">
                                <button onClick={() => setOrigemFiltro('todas')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${origemFiltro === 'todas' ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>Todas ({todasOfertas.length})</button>
                                <button onClick={() => setOrigemFiltro('proprio')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${origemFiltro === 'proprio' ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>Só meus produtos</button>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-1.5">
                            <button onClick={() => setMercadoFiltro('Todos')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${mercadoFiltro === 'Todos' ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>Todos</button>
                            {mercadosDisponiveis.map(m => (
                                <button key={m} onClick={() => setMercadoFiltro(m)} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${mercadoFiltro === m ? 'bg-violet-700 text-white' : 'bg-slate-100 text-slate-600'}`}>{m.replace('Supermercado ', '')}</button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {filtradas.map(o => {
                            const tag = o.desconto >= 20 ? '🔥 GRANDE OPORTUNIDADE' : o.desconto >= 10 ? '✨ ÓTIMA OFERTA' : '🏷️ OFERTA ATIVA';
                            return (
                                <div key={o.key} className="rounded-3xl p-5 shadow-sm border border-fuchsia-200 bg-gradient-to-br from-white to-fuchsia-50/40 flex flex-col justify-between">
                                    <div>
                                        <div className="flex justify-between items-start gap-2 mb-2">
                                            <span className="text-[10px] font-bold bg-fuchsia-100 text-fuchsia-800 px-2.5 py-0.5 rounded-full">{tag}</span>
                                            {o.desconto !== null && <span className="text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded-full">-{o.desconto.toFixed(1)}%</span>}
                                        </div>
                                        <div className="flex items-center space-x-3 my-2">
                                            {o.image_url && <img onClick={() => onFotoAmpliada({ url: o.image_url, nome: o.nome })} src={o.image_url} alt="" className="w-11 h-11 rounded-xl object-cover border cursor-pointer" />}
                                            <div className="min-w-0">
                                                <h4 className="text-sm font-bold text-slate-800">{o.nome}</h4>
                                                <div className="flex flex-wrap items-center gap-1.5 mt-1">
                                                    <span className="text-[11px] font-semibold text-violet-700">{o.estabelecimento}</span>
                                                    {o.marca && (
                                                        <span className="text-[10px] font-bold bg-violet-100 text-violet-800 px-2 py-0.5 rounded-full">
                                                            Marca: {o.marca}
                                                        </span>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="bg-white p-3 rounded-2xl mt-3 border grid grid-cols-2 gap-2 text-center">
                                            <div>
                                                <p className="text-[10px] text-slate-400">{o.media ? 'Média histórica' : 'Data do encarte'}</p>
                                                <p className={`text-xs font-semibold ${o.media ? 'line-through text-slate-500' : 'text-slate-600'}`}>
                                                    {o.media ? `R$ ${dinheiro(o.media)}` : (o.data || 'Recente')}
                                                </p>
                                            </div>
                                            <div>
                                                <p className="text-[10px] text-slate-400">Preço atual</p>
                                                <p className="text-sm font-bold text-violet-800">R$ {dinheiro(o.precoAtual)}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="mt-3 pt-2.5 border-t border-fuchsia-100 flex items-center justify-between gap-2">
                                        {o.economia > 0 ? (
                                            <p className="text-[10px] text-emerald-700 font-bold">Economia: R$ {dinheiro(o.economia)}</p>
                                        ) : <span className="text-[10px] text-slate-400">Promoção vigente</span>}
                                        {/^https?:\/\//i.test(o.link) && (
                                            <a
                                                href={o.link}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="inline-flex items-center gap-1 text-[11px] bg-violet-700 hover:bg-violet-800 text-white font-bold px-3 py-1.5 rounded-xl transition"
                                            >
                                                <span>Conferir na fonte</span>
                                                <Icon name="external-link" className="w-3 h-3" />
                                            </a>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    {filtradas.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhuma oferta vigente encontrada neste filtro.</p>}
                </div>
            );
        }

        function PrecosView({ historicoPrecos }) {
            const [busca, setBusca] = useState('');

            const comparacao = useMemo(() => {
                const map = {};
                historicoPrecos.forEach(h => {
                    const nome = h.product_name || 'Produto';
                    if (!map[nome]) map[nome] = [];
                    map[nome].push(h);
                });
                return Object.entries(map).map(([nome, lista]) => {
                    const precos = lista.map(i => Number(i.price));
                    const menor = Math.min(...precos);
                    const maior = Math.max(...precos);
                    const media = precos.reduce((a, b) => a + b, 0) / precos.length;
                    const melhor = lista.find(i => Number(i.price) === menor);
                    return { nome, lista, menor, maior, media, melhorMercado: (melhor && melhor.source) || 'N/A' };
                }).filter(item => normalizar(item.nome).includes(normalizar(busca)));
            }, [historicoPrecos, busca]);

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                        <h2 className="text-lg font-bold text-slate-800">📈 Comparação de preços entre mercados</h2>
                        <p className="text-xs text-slate-500">Veja onde cada produto costuma ser mais barato, com base nas suas compras.</p>
                    </div>
                    <input type="text" placeholder="Pesquisar produto..." value={busca} onChange={e => setBusca(e.target.value)} className="w-full bg-white border rounded-2xl px-4 py-2.5 text-xs shadow-sm" />
                    <div className="space-y-4">
                        {comparacao.map(item => (
                            <div key={item.nome} className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-3">
                                    <div>
                                        <h4 className="text-sm font-bold text-slate-800">{item.nome}</h4>
                                        <p className="text-[11px] text-emerald-700 font-bold">🏆 Menor preço: R$ {dinheiro(item.menor)} ({item.melhorMercado})</p>
                                    </div>
                                    <div className="flex space-x-3 text-xs bg-slate-50 px-3 py-1.5 rounded-xl border">
                                        <span>Média: <strong>R$ {dinheiro(item.media)}</strong></span>
                                        <span>Maior: <strong>R$ {dinheiro(item.maior)}</strong></span>
                                    </div>
                                </div>
                                <div className="space-y-1.5">
                                    {item.lista.slice(0, 5).map(reg => (
                                        <div key={reg.id} className="flex justify-between items-center text-xs p-2 bg-slate-50 rounded-xl">
                                            <span>{reg.date} — <strong>{reg.source}</strong></span>
                                            <span className="font-bold text-violet-700">R$ {dinheiro(reg.price)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                        {comparacao.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhum registro de preço encontrado.</p>}
                    </div>
                </div>
            );
        }

        function GastosView({ compras, metricasGasto, estimativaProximaSemana }) {
            const porMercado = useMemo(() => {
                const map = {};
                compras.forEach(c => {
                    const m = c.notes || 'Outros';
                    map[m] = (map[m] || 0) + Number(c.total || 0);
                });
                return Object.entries(map).sort((a, b) => b[1] - a[1]);
            }, [compras]);

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                        <h2 className="text-lg font-bold text-slate-800">💰 Controle financeiro & previsão</h2>
                        <p className="text-xs text-slate-500">Gastos registrados e estimativa de reposição.</p>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                            <p className="text-xs text-slate-400">Últimos 7 dias</p>
                            <h3 className="text-2xl font-bold text-violet-800 mt-1">R$ {dinheiro(metricasGasto.semana)}</h3>
                        </div>
                        <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                            <p className="text-xs text-slate-400">Mês atual</p>
                            <h3 className="text-2xl font-bold text-slate-800 mt-1">R$ {dinheiro(metricasGasto.mes)}</h3>
                        </div>
                        <div className="rounded-3xl p-5 shadow-sm border border-emerald-200 bg-emerald-50/30">
                            <p className="text-xs text-emerald-700 font-semibold">Previsão próxima semana</p>
                            <h3 className="text-2xl font-bold text-emerald-800 mt-1">{estimativaProximaSemana.itensBase > 0 ? `R$ ${dinheiro(estimativaProximaSemana.total)}` : 'Sem dados'}</h3>
                            <p className="text-[10px] text-slate-500 mt-1">Baseada nos itens abaixo do mínimo que já têm preço registrado</p>
                        </div>
                    </div>
                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                        <h3 className="text-sm font-bold text-slate-800 mb-3">Gastos por supermercado</h3>
                        <div className="space-y-2">
                            {porMercado.map(([mercado, total]) => (
                                <div key={mercado} className="flex justify-between items-center p-3 bg-slate-50 rounded-2xl text-xs">
                                    <span className="font-bold text-slate-700">{mercado}</span>
                                    <span className="font-bold text-violet-700">R$ {dinheiro(total)}</span>
                                </div>
                            ))}
                            {porMercado.length === 0 && <p className="text-xs text-slate-400">Nenhuma compra registrada.</p>}
                        </div>
                    </div>
                </div>
            );
        }

        function RelatoriosView({ produtosComEstoque, consumos }) {
            const topConsumidos = useMemo(() => {
                const map = {};
                consumos.forEach(c => {
                    const n = c.product_name || 'Produto';
                    map[n] = (map[n] || 0) + Number(c.quantity || 0);
                });
                return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 5);
            }, [consumos]);

            const normal = produtosComEstoque.filter(p => p.stockTotal > p.minimum_stock).length;
            const acabando = produtosComEstoque.filter(p => p.stockTotal > 0 && p.stockTotal <= p.minimum_stock).length;
            const acabados = produtosComEstoque.filter(p => p.stockTotal <= 0).length;

            return (
                <div className="space-y-6">
                    <div className="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                        <h2 className="text-lg font-bold text-slate-800">📊 Relatórios e consumo</h2>
                        <p className="text-xs text-slate-500">Movimentações e saúde do estoque.</p>
                    </div>
                    <div className="grid grid-cols-3 gap-3">
                        <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 text-center"><p className="text-xl font-bold text-emerald-700">{normal}</p><p className="text-[10px] text-emerald-800">Normais</p></div>
                        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-center"><p className="text-xl font-bold text-amber-700">{acabando}</p><p className="text-[10px] text-amber-800">Acabando</p></div>
                        <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4 text-center"><p className="text-xl font-bold text-rose-700">{acabados}</p><p className="text-[10px] text-rose-800">Acabados</p></div>
                    </div>
                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                        <h3 className="text-sm font-bold text-slate-800 mb-3">Mais consumidos</h3>
                        <div className="space-y-2">
                            {topConsumidos.map(([nome, qtd], i) => (
                                <div key={nome} className="flex justify-between items-center p-3 bg-slate-50 rounded-2xl text-xs">
                                    <span className="font-bold text-slate-700">{i + 1}. {nome}</span>
                                    <span className="font-bold text-violet-700">{Number(qtd.toFixed(2))}</span>
                                </div>
                            ))}
                            {topConsumidos.length === 0 && <p className="text-xs text-slate-400 py-2 text-center">Sem consumo registrado.</p>}
                        </div>
                    </div>
                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                        <h3 className="text-sm font-bold text-slate-800 mb-3">Últimas baixas registradas</h3>
                        <div className="space-y-2">
                            {consumos.slice(0, 15).map(c => (
                                <div key={c.id} className="flex justify-between items-center p-3 bg-slate-50 rounded-2xl text-xs">
                                    <div>
                                        <p className="font-bold text-slate-800">{c.product_name || 'Produto'}</p>
                                        <p className="text-[10px] text-slate-500">{c.notes} • {c.consumed_at ? new Date(c.consumed_at).toLocaleDateString('pt-BR') : ''}</p>
                                    </div>
                                    <span className="font-bold text-rose-600">-{c.quantity}</span>
                                </div>
                            ))}
                            {consumos.length === 0 && <p className="text-xs text-slate-400 py-4 text-center">Nenhum consumo registrado ainda.</p>}
                        </div>
                    </div>
                </div>
            );
        }

        function ModalCatalogo({ produtos, onClose, onAdicionar }) {
            const [busca, setBusca] = useState('');
            const [selecionados, setSelecionados] = useState({});
            const [jaTenho, setJaTenho] = useState(false);
            const [salvando, setSalvando] = useState(false);

            const itens = useMemo(() => {
                const lista = [];
                Object.entries(CATALOGO).forEach(([categoria, arr]) => {
                    arr.forEach(([nome, unidade, qtd, min]) => {
                        lista.push({ id: `cat_${slug(nome)}`, nome, categoria, unidade, qtd, min });
                    });
                });
                return lista;
            }, []);

            const nomesExistentes = useMemo(() => new Set(produtos.map(p => normalizar(p.name))), [produtos]);
            const idsExistentes = useMemo(() => new Set(produtos.map(p => p.id)), [produtos]);
            const jaCadastrado = (it) => idsExistentes.has(it.id) || nomesExistentes.has(normalizar(it.nome));

            const termo = normalizar(busca);
            const visiveis = itens.filter(it => !termo || normalizar(it.nome).includes(termo) || normalizar(it.categoria).includes(termo));
            const categorias = [...new Set(visiveis.map(i => i.categoria))];
            const totalSel = Object.keys(selecionados).filter(k => selecionados[k]).length;

            const alternar = (it) => setSelecionados(prev => ({ ...prev, [it.id]: !prev[it.id] }));
            const marcarCategoria = (cat) => {
                const doGrupo = visiveis.filter(i => i.categoria === cat && !jaCadastrado(i));
                const todosMarcados = doGrupo.every(i => selecionados[i.id]);
                setSelecionados(prev => {
                    const novo = { ...prev };
                    doGrupo.forEach(i => { novo[i.id] = !todosMarcados; });
                    return novo;
                });
            };

            const confirmar = async () => {
                const escolhidos = itens.filter(i => selecionados[i.id] && !jaCadastrado(i));
                if (escolhidos.length === 0) return;
                setSalvando(true);
                await onAdicionar(escolhidos, jaTenho);
                setSalvando(false);
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[55] p-4">
                    <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl">
                        <div className="p-5 border-b space-y-3">
                            <div className="flex justify-between items-center">
                                <h3 className="text-base font-bold text-slate-800">📋 Catálogo de itens básicos</h3>
                                <button onClick={onClose} className="text-slate-400 font-bold px-2">✕</button>
                            </div>
                            <input type="text" placeholder="Buscar item (ex: sabonete, miojo, bolacha)..." value={busca} onChange={e => setBusca(e.target.value)} className="w-full border rounded-2xl px-4 py-2.5 text-xs" />
                            <label className="flex items-center space-x-2 text-xs text-slate-600 cursor-pointer">
                                <input type="checkbox" checked={jaTenho} onChange={e => setJaTenho(e.target.checked)} className="accent-violet-700" />
                                <span>Já tenho esses itens em casa (começa com a quantidade padrão no estoque)</span>
                            </label>
                            <p className="text-[10px] text-slate-400">Sem essa opção, os itens entram com estoque zero e aparecem na lista de compras.</p>
                        </div>

                        <div className="flex-1 overflow-y-auto p-5 space-y-5">
                            {categorias.map(cat => (
                                <div key={cat}>
                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="text-xs font-bold uppercase tracking-wide text-violet-800">{cat}</h4>
                                        <button onClick={() => marcarCategoria(cat)} className="text-[11px] text-violet-700 font-bold hover:underline">Marcar / desmarcar todos</button>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                                        {visiveis.filter(i => i.categoria === cat).map(it => {
                                            const ja = jaCadastrado(it);
                                            return (
                                                <label key={it.id} className={`flex items-center space-x-2 p-2.5 rounded-xl border text-xs ${ja ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : selecionados[it.id] ? 'bg-violet-50 border-violet-300 cursor-pointer' : 'bg-white border-slate-200 cursor-pointer hover:bg-slate-50'}`}>
                                                    <input type="checkbox" disabled={ja} checked={ja || !!selecionados[it.id]} onChange={() => alternar(it)} className="accent-violet-700" />
                                                    <span className="flex-1">{it.nome}</span>
                                                    <span className="text-[10px] text-slate-400">{ja ? 'já cadastrado' : it.unidade}</span>
                                                </label>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                            {categorias.length === 0 && <p className="text-xs text-slate-400 text-center py-8">Nenhum item encontrado. Você pode cadastrar um produto novo manualmente.</p>}
                        </div>

                        <div className="p-5 border-t flex justify-between items-center gap-3">
                            <span className="text-xs text-slate-500">{totalSel} selecionado(s)</span>
                            <div className="flex space-x-2">
                                <button onClick={onClose} className="px-4 py-2 text-xs text-slate-600">Cancelar</button>
                                <button onClick={confirmar} disabled={totalSel === 0 || salvando} className="bg-violet-700 disabled:opacity-40 text-white px-5 py-2 rounded-xl text-xs font-bold">
                                    {salvando ? 'Adicionando...' : `Adicionar ${totalSel} item(ns)`}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ModalProduto({ produto, categories, onClose, onSalvo, mostrarToast }) {
            const novo = !produto;
            const [name, setName] = useState(produto ? produto.name : '');
            const [category, setCategory] = useState(produto ? produto.category : categories[0]);
            const [brand, setBrand] = useState(produto ? (produto.brand || '') : '');
            const [unit, setUnit] = useState(produto ? produto.unit : 'unidade');
            const [defaultQty, setDefaultQty] = useState(produto ? produto.default_quantity : 1);
            const [minStock, setMinStock] = useState(produto ? produto.minimum_stock : 1);
            const [defaultPrice, setDefaultPrice] = useState(produto && Number(produto.default_price) > 0 ? produto.default_price : '');
            const [localEstoque, setLocalEstoque] = useState(() => obterLocalEstoque(produto, null));
            const [estoqueInicial, setEstoqueInicial] = useState(0);
            const [validadeInicial, setValidadeInicial] = useState('');
            const [notes, setNotes] = useState(produto ? (produto.notes || '') : '');
            const [imageUrl, setImageUrl] = useState(produto ? (produto.image_url || '') : '');
            const [processandoFoto, setProcessandoFoto] = useState(false);
            const [salvando, setSalvando] = useState(false);

            const handleFoto = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setProcessandoFoto(true);
                try {
                    setImageUrl(await comprimirImagem(file, 420, 0.72));
                } catch (err) {
                    mostrarToast('Erro ao processar a imagem.', 'erro');
                } finally {
                    setProcessandoFoto(false);
                    e.target.value = '';
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!name.trim()) return;
                setSalvando(true);
                try {
                    const id = produto ? produto.id : `prod_${Date.now()}`;
                    await CB.saveDoc('products', id, {
                        name: name.trim(), category, brand: brand.trim(), unit: unit.trim() || 'unidade',
                        default_quantity: Number(defaultQty) || 1, minimum_stock: Number(minStock) || 0,
                        default_price: Number(defaultPrice) || 0, local_estoque: localEstoque,
                        image_url: imageUrl, notes: notes.trim(), is_demo: false
                    });
                    if (novo && Number(estoqueInicial) > 0) {
                        await CB.saveDoc('product_expiration', `lote_${id}_ini`, {
                            product_id: id, quantity: Number(estoqueInicial), expiration_date: validadeInicial || '',
                            local_estoque: localEstoque, is_demo: false
                        });
                    }
                    onSalvo();
                } catch (err) {
                    console.error(err);
                    mostrarToast('Erro ao salvar produto.', 'erro');
                } finally {
                    setSalvando(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[56] p-4 overflow-y-auto">
                    <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl my-8 space-y-4">
                        <h3 className="text-base font-bold text-slate-800">{produto ? 'Editar produto' : '+ Cadastrar produto'}</h3>
                        <form onSubmit={handleSubmit} className="space-y-3">
                            <div className="flex items-center space-x-4 bg-slate-50 p-3 rounded-2xl border border-dashed border-violet-300">
                                <div className="w-20 h-20 bg-white rounded-2xl flex flex-col items-center justify-center overflow-hidden border shadow-sm shrink-0">
                                    {imageUrl ? <img src={imageUrl} alt="Prévia" className="w-full h-full object-cover" /> : <Icon name="camera" className="w-7 h-7 text-violet-400" />}
                                </div>
                                <div className="flex-1 text-xs space-y-1.5">
                                    <p className="font-bold text-slate-800">Foto do produto (opcional)</p>
                                    <div className="flex flex-wrap gap-2">
                                        <label className="bg-violet-700 text-white px-3 py-1.5 rounded-xl text-[11px] font-bold cursor-pointer">
                                            📷 Tirar foto
                                            <input type="file" accept="image/*" capture="environment" onChange={handleFoto} className="hidden" />
                                        </label>
                                        <label className="bg-white border border-violet-300 text-violet-800 px-3 py-1.5 rounded-xl text-[11px] font-bold cursor-pointer">
                                            🖼️ Galeria
                                            <input type="file" accept="image/*" onChange={handleFoto} className="hidden" />
                                        </label>
                                        {imageUrl && <button type="button" onClick={() => setImageUrl('')} className="text-[11px] text-rose-600 font-bold hover:underline">Remover</button>}
                                    </div>
                                </div>
                            </div>
                            {processandoFoto && <p className="text-xs text-violet-700 font-semibold animate-pulse">Otimizando imagem...</p>}

                            <div>
                                <label className="block text-xs font-semibold mb-1">Nome do produto *</label>
                                <input type="text" required placeholder="Ex: Arroz 5kg, Leite integral 1L" value={name} onChange={e => setName(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Categoria</label>
                                    <select value={category} onChange={e => {
                                        const novaCat = e.target.value;
                                        setCategory(novaCat);
                                        if (novo) setLocalEstoque(inferirLocalCategoria(novaCat));
                                    }} className="w-full border rounded-xl px-3 py-2 text-xs">
                                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Marca (opcional)</label>
                                    <input type="text" placeholder="Ex: Tio João" value={brand} onChange={e => setBrand(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Local no estoque</label>
                                    <select value={localEstoque} onChange={e => setLocalEstoque(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs bg-white">
                                        {LOCAIS_ESTOQUE.map(loc => <option key={loc.id} value={loc.id}>{loc.icon} {loc.label}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Preço padrão (R$)</label>
                                    <input type="number" step="0.01" min="0" placeholder="Ex: 24.90" value={defaultPrice} onChange={e => setDefaultPrice(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" title="Usado no comparativo quando não estiver em oferta" />
                                </div>
                            </div>
                            <div className="grid grid-cols-3 gap-3">
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Unidade</label>
                                    <input type="text" placeholder="un, kg, L" value={unit} onChange={e => setUnit(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Qtd padrão</label>
                                    <input type="number" step="0.01" min="0.01" value={defaultQty} onChange={e => setDefaultQty(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold mb-1">Estoque mín.</label>
                                    <input type="number" step="0.01" min="0" value={minStock} onChange={e => setMinStock(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                                </div>
                            </div>
                            {novo && (
                                <div className="grid grid-cols-2 gap-3 bg-violet-50/60 p-3 rounded-2xl">
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">Quanto tenho agora</label>
                                        <input type="number" step="0.01" min="0" value={estoqueInicial} onChange={e => setEstoqueInicial(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs bg-white" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold mb-1">Validade (opcional)</label>
                                        <input type="date" value={validadeInicial} onChange={e => setValidadeInicial(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs bg-white" />
                                    </div>
                                </div>
                            )}
                            <div>
                                <label className="block text-xs font-semibold mb-1">Observações (opcional)</label>
                                <input type="text" value={notes} onChange={e => setNotes(e.target.value)} className="w-full border rounded-xl px-3 py-2 text-xs" />
                            </div>
                            <div className="flex justify-end space-x-2 pt-3">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-xs text-slate-600">Cancelar</button>
                                <button type="submit" disabled={salvando || processandoFoto} className="bg-violet-700 text-white px-5 py-2 rounded-xl text-xs font-bold disabled:opacity-50">{salvando ? 'Salvando...' : 'Salvar produto'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // ---------- Modal: Compra (Com Leitor Múltiplo de Notas/Galeria por IA e Edição) ----------
        function ModalCompra({ compraParaEditar, produtos, lotesValidade, historicoPrecos, listaCompras, establishments, onClose, onSalvo, onNovoProduto, onCatalogo, mostrarToast }) {
            const editando = Boolean(compraParaEditar && compraParaEditar.id);
            const itemVazio = () => ({ productId: '', quantity: 1, unitPrice: 0, expirationDate: '' });

            const [establishment, setEstablishment] = useState(() => {
                if (!compraParaEditar) return establishments[0];
                const achado = establishments.find(e => e === compraParaEditar.notes);
                return achado ? achado : 'Outro';
            });
            const [customEstablishment, setCustomEstablishment] = useState(() => {
                if (!compraParaEditar) return '';
                const achado = establishments.find(e => e === compraParaEditar.notes);
                return achado ? '' : (compraParaEditar.notes || '');
            });
            const [purchaseDate, setPurchaseDate] = useState(() => (compraParaEditar && compraParaEditar.purchase_date) || hojeISO());
            const [itens, setItens] = useState(() => {
                if (compraParaEditar && compraParaEditar.purchase_items && compraParaEditar.purchase_items.length > 0) {
                    return compraParaEditar.purchase_items.map(it => ({
                        productId: it.product_id,
                        quantity: it.quantity,
                        unitPrice: it.unit_price,
                        expirationDate: it.expiration_date || ''
                    }));
                }
                return [itemVazio()];
            });
            const [fotosCompra, setFotosCompra] = useState(() => {
                if (compraParaEditar && Array.isArray(compraParaEditar.photos)) {
                    return compraParaEditar.photos.map((url, idx) => ({
                        id: `saved_${idx}_${Date.now()}`,
                        previewUrl: url,
                        ocrB64: (url || '').split(',')[1] || ''
                    }));
                }
                return [];
            });

            const [salvando, setSalvando] = useState(false);
            const [lendoNota, setLendoNota] = useState(false);
            const [preparandoFotos, setPreparandoFotos] = useState(false);

            const totalNota = itens.reduce((acc, i) => acc + (Number(i.quantity || 0) * Number(i.unitPrice || 0)), 0);

            const atualizar = (idx, campos) => setItens(prev => prev.map((it, i) => i === idx ? { ...it, ...campos } : it));

            const escolherProduto = (idx, productId) => {
                const prod = produtos.find(p => p.id === productId);
                const ultimo = historicoPrecos.find(h => h.product_id === productId && Number(h.price) > 0);
                atualizar(idx, {
                    productId,
                    quantity: prod ? Number(prod.default_quantity || 1) : 1,
                    unitPrice: ultimo ? Number(ultimo.price) : (prod && Number(prod.default_price) > 0 ? Number(prod.default_price) : 0)
                });
            };

            const adicionarFotosCompra = async (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;
                setPreparandoFotos(true);
                try {
                    const novasFotos = [];
                    for (const file of files) {
                        const ocrDataUrl = await comprimirImagem(file, 1280, 0.84);
                        const previewUrl = await comprimirImagem(file, 640, 0.62);
                        novasFotos.push({
                            id: `foto_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                            previewUrl,
                            ocrB64: ocrDataUrl.split(',')[1] || ''
                        });
                    }
                    setFotosCompra(prev => [...prev, ...novasFotos]);
                    mostrarToast(`${novasFotos.length} foto(s) adicionada(s)! Clique em "Extrair itens com IA" se quiser preencher automático.`);
                } catch (err) {
                    console.error(err);
                    mostrarToast('Erro ao carregar uma ou mais imagens.', 'erro');
                } finally {
                    setPreparandoFotos(false);
                    e.target.value = '';
                }
            };

            const removerFotoCompra = (idFoto) => {
                setFotosCompra(prev => prev.filter(f => f.id !== idFoto));
            };

            // ---- Leitor de Cupom Fiscal com IA (Múltiplas Fotos via Gemini) ----
            const analisarFotosComIA = async () => {
                if (fotosCompra.length === 0) {
                    mostrarToast('Adicione pelo menos uma foto (câmera ou galeria) primeiro.', 'erro');
                    return;
                }

                let apiKey = localStorage.getItem('gemini_api_key') || '';
                if (!apiKey) {
                    apiKey = prompt('Digite sua chave GEMINI_API_KEY do Google AI Studio para ler cupons fiscais:') || '';
                    if (apiKey.trim()) {
                        apiKey = apiKey.trim();
                        localStorage.setItem('gemini_api_key', apiKey);
